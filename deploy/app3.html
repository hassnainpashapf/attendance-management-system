const T = k => I18N.t(k);
/* settings values arrive as strings/booleans; treat '1' like true */
function on(v){ return v===true || v===1 || v==='1' || v==='true' || v==='TRUE'; }
function statusBadge(st){
  if(st==='sent') return badge(T('t3.stSent'),'emerald');
  if(st==='failed') return badge(T('t3.stFailed'),'red');
  return badge(T('t3.stPending'),'amber');
}
const EV_LABEL = { late:'t3.evLate', absent:'t3.evAbsent', leave_approved:'t3.evLeave',
  leave_rejected:'t3.evLeave', out_of_zone:'t3.evZone', test:'t3.testWa' };
function evLabel(ev){
  const k = EV_LABEL[ev];
  if(!k) return ev;
  const t = T(k);
  return (t === k) ? ev : t;
}

const Alerts = {
  on,

  /* Notifications card body for the Settings page. Field names match the
     settings keys, so collectForm() + saveSettings() round-trip directly. */
  notifHTML(s, canEdit){
    s = s || {};
    const dis = canEdit ? '' : 'disabled';
    return `
    <div class="rounded-xl border border-slate-200/70 p-4 mb-4">
      <div class="flex items-center gap-2 mb-3">
        <span class="text-base">💬</span><span class="font-semibold text-slate-700 text-sm">${T('t3.whatsapp')}</span>
        <label class="ml-auto inline-flex items-center gap-2 text-xs text-slate-500 cursor-pointer">

        </label>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-2">${field(T('t3.waToken'),'wa_token',{type:'password',value:s.wa_token||'',cls:dis})}</div>

        ${field(T('t3.waTemplate'),'wa_template_name',{value:s.wa_template_name||'',ph:'optional'})}
      </div>
      <p class="text-[11px] text-slate-400 mt-2">${T('t3.waTemplateHint')}</p>
    </div>
    <div class="rounded-xl border border-slate-200/70 p-4 mb-4">
      <div class="flex items-center gap-2 mb-3">
        <span class="text-base">📩</span><span class="font-semibold text-slate-700 text-sm">${T('t3.sms')}</span>
        <label class="ml-auto inline-flex items-center gap-2 text-xs text-slate-500 cursor-pointer">
          <input type="checkbox" name="sms_enabled" ${on(s.sms_enabled)?'checked':''} ${dis} class="w-4 h-4 rounded accent-teal-600"> ${T('t3.smsEnabled')}
        </label>
      </div>
      ${field(T('t3.smsUrl'),'sms_webhook_url',{value:s.sms_webhook_url||'',ph:'webhook.example.com/sms-hook'})}
      <p class="text-[11px] text-slate-400 mt-2">${T('t3.smsUrlHint')}</p>
    </div>
    <div class="rounded-xl border border-slate-200/70 p-4 mb-4">
      <div class="font-semibold text-slate-700 text-sm mb-3">${T('t3.events')}</div>
      <div class="grid grid-cols-2 gap-2.5">
        ${[['alert_late','t3.evLate'],['alert_absent','t3.evAbsent'],['alert_leave_decision','t3.evLeave'],['alert_out_of_zone','t3.evZone']]
          .map(([k,l])=>`<label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer"><input type="checkbox" name="${k}" ${on(s[k])?'checked':''} ${dis} class="w-4 h-4 rounded accent-teal-600"> ${T(l)}</label>`).join('')}
      </div>
      <div class="mt-4 max-w-[220px]">${field(T('t3.grace'),'absence_grace_minutes',{type:'number',min:0,value:s.absence_grace_minutes||60})}</div>
      <p class="text-[11px] text-slate-400 mt-1">${T('t3.graceHint')}</p>
    </div>
    ${canEdit?`
    <div class="rounded-xl bg-slate-50 border border-slate-200/70 p-4 mb-4">
      <div class="flex flex-wrap items-end gap-3">
        <div class="flex-1 min-w-[180px]">${field(T('t3.testTo'),'t3_test_to',{ph:'03XXXXXXXXX'})}</div>
        <button class="${btnS} !text-xs" data-t3test="whatsapp">${T('t3.testWa')}</button>
        <button class="${btnS} !text-xs" data-t3test="sms">${T('t3.testSms')}</button>
      </div>
      <p class="text-[11px] text-slate-400 mt-2">${T('t3.pendingNote')}</p>
    </div>
    <button class="${btnP}" data-t3save>${T('t3.save')}</button>`:''}`;
  },

  initNotif(rootId, canEdit){
    const root = document.getElementById(rootId);
    if(!root) return;
    const sv = root.querySelector('[data-t3save]');
    if(sv) sv.onclick = async ()=>{
      const d = collectForm(root);
      delete d.t3_test_to;
      await API.call('saveSettings', d);
      toast(T('t3.saved'),'success');
    };
    root.querySelectorAll('[data-t3test]').forEach(b=>{
      b.onclick = async ()=>{
        const to = formVal(root, 't3_test_to');
        if(!to){ toast(T('t3.testNeedNo'),'warn'); return; }
        b.disabled = true;
        try{
          const r = await API.call('testAlert', b.dataset.t3test, to);
          toast(T('t3.testSent')+' ('+r.status+')', r.status==='sent'?'success':'warn');
          const ml = document.querySelector('[data-t3log]');
          if(ml) Alerts.renderLog(ml);
        }catch(e){ toast(e.message,'error'); }
        b.disabled = false;
      };
    });
  },

  /* Message log table with per-row resend. */
  async renderLog(el){
    el.setAttribute('data-t3log','1');
    el.innerHTML = '<div class="py-8 text-center"><span class="spinner"></span></div>';
    let rows = [];
    try{ rows = await API.call('listMessageLog', 100); }catch(e){ el.innerHTML = `<div class="text-sm text-red-600">${esc(e.message)}</div>`; return; }
    if(!rows.length){ el.innerHTML = `<div class="text-sm text-slate-400 py-6 text-center">${T('t3.noLogs')}</div>`; return; }
    el.innerHTML = tableHTML([
      {label:T('t3.cTime'), get:r=>`<span class="tabular-nums text-xs whitespace-nowrap">${fmtDateTime(r.ts)}</span>`},
      {label:T('t3.cChannel'), get:r=>r.channel==='whatsapp'?badge('WhatsApp','emerald'):r.channel==='sms'?badge('SMS','sky'):badge('—','slate')},
      {label:T('t3.cTo'), get:r=>`<span class="font-mono text-xs">${esc(r.to||'—')}</span>`},
      {label:T('t3.cEvent'), get:r=>`<span class="text-xs font-medium text-slate-600">${esc(evLabel(r.event))}</span>`},
      {label:T('t3.cStatus'), get:r=>statusBadge(r.status)},
      {label:T('t3.cError'), get:r=>r.error?`<span class="text-xs text-red-500 max-w-[220px] block truncate" title="${esc(r.error)}">${esc(r.error)}</span>`:'<span class="text-slate-300">—</span>'},
      {label:'', get:r=>`<div class="flex justify-end"><button class="${btnS} !px-3 !py-1.5 !text-xs" data-t3resend="${esc(r.id)}">${T('t3.resend')}</button></div>`},
    ], rows, {empty:T('t3.noLogs'), compact:true});
    el.querySelectorAll('[data-t3resend]').forEach(b=>{
      b.onclick = async ()=>{
        b.disabled = true;
        try{
          const r = await API.call('resendAlert', b.dataset.t3resend);
          toast(T('t3.resent')+' ('+r.status+')', r.status==='sent'?'success':'warn');
          Alerts.renderLog(el);
        }catch(e){ toast(e.message,'error'); b.disabled=false; }
      };
    });
  },

  /* Fire alert checks after punch / leave decisions without touching those
     flows' files. Idempotent: safe to call once per page load. */
  patch(){
    if(window.__t3patched) return;
    window.__t3patched = true;
    const SKIP = {runAlertChecks:1, alertLeaveDecision:1, checkAbsences:1, listMessageLog:1, resendAlert:1, testAlert:1, sendAlert:1};
    const apply = ()=>{
      if(!window.API || !window.API.call || window.API.call.__t3) return false;
      const orig = window.API.call.bind(window.API);
      const wrapped = async function(fn){
        const args = Array.prototype.slice.call(arguments, 1);
        const r = await orig.apply(null, [fn].concat(args));
        try{
          if(!SKIP[fn]){
            if(fn==='punch' && r && r.punch) orig('runAlertChecks', args[0]).catch(function(){});
            else if(fn==='devicePunch' && r && r.punch) orig('runAlertChecks', args[1]).catch(function(){});
            else if(fn==='decideLeave') orig('alertLeaveDecision', args[0]).catch(function(){});
          }
        }catch(e){}
        return r;
      };
      wrapped.__t3 = true;
      window.API.call = wrapped;
      return true;
    };
    if(!apply()){
      const iv = setInterval(()=>{ if(apply()) clearInterval(iv); }, 300);
      setTimeout(()=>clearInterval(iv), 10000);
    }
  }
};

window.Alerts = Alerts;
Alerts.patch();
})();


/* ===== 165_geofence.js ===== */
/* 165_geofence.js — TRACK 5: geofence auto-punch support for the native Android app.
   New-file only: nothing here edits 30_punch.js or any other module. The punch
   page hook is applied lazily (hashchange + retry), so script load order never
   matters. Exposes window.AndroidGetPunchConfig() for the native WebView
   bridge and injects a small "Automatic attendance" toggle card into the
   punch page DOM. */
(function(){
'use strict';

/* ---------- minimal I18N shim (first track to need it defines it) ---------- */
if(!window.I18N){
  window.I18N = {
    lang: (window.AMS_LANG || 'en'),
    dict: { en: {}, ur: {} },
    t: function(k){
      var d = window.I18N.dict || {};
      var lang = window.I18N.lang || 'en';
      if(d[lang] && d[lang][k] != null) return d[lang][k];
      if(d.en && d.en[k] != null) return d.en[k];
      return k;
    }
  };
}
Object.assign(I18N.dict.en, {
  't5.autoTitle': 'Automatic attendance',
  't5.autoDesc': 'When ON, the Android app may check you in or out automatically when you enter or leave your assigned site geofences. Manual punches always work.',
  't5.isOn': 'Automatic attendance is ON for this employee.',
  't5.isOff': 'Automatic attendance is OFF — the app will not auto-punch.',
  't5.saved': 'Preference saved',
  't5.saveFail': 'Could not save preference'
});
Object.assign(I18N.dict.ur, {
  't5.autoTitle': 'خودکار حاضری',
  't5.autoDesc': 'آن ہونے پر اینڈرائیڈ ایپ آپ کے مقررہ سائٹ کے دائرے میں داخل ہونے یا نکلنے پر خودکار حاضری لگا سکتی ہے۔ دستی حاضری ہمیشہ کام کرتی ہے۔',
  't5.isOn': 'اس ملازم کے لیے خودکار حاضری آن ہے۔',
  't5.isOff': 'خودکار حاضری آف ہے — ایپ خودکار حاضری نہیں لگائے گی۔',
  't5.saved': 'ترجیح محفوظ ہو گئی',
  't5.saveFail': 'ترجیح محفوظ نہیں ہو سکی'
});

/* ---------- cached config shared by the bridge and the toggle ---------- */
const T5 = {
  cache: { autoPunch: true, sites: [], deviceId: '', employeeId: '' },
  myEmployeeId(){
    try{
      const sel = document.querySelector('[name="empId"]');
      if(sel && sel.value) return sel.value;
    }catch(e){}
    const u = (typeof Session !== 'undefined' && Session.user) || {};
    return u.employeeId || '';
  },
  /* Refresh the cached toggle state, geofences and bound device id. Safe to
     call in mock mode or offline: failures keep the last known values. */
  async refresh(employeeId){
    const eid = employeeId || T5.myEmployeeId();
    if(!eid) return T5.cache;
    try{
      const g = await API.call('getAutoPunch', eid);
      if(g) T5.cache.autoPunch = !!g.autoPunch;
    }catch(e){}
    try{
      const sites = await API.call('getAssignedGeofences', eid);
      if(Array.isArray(sites)) T5.cache.sites = sites.map(s=>({
        siteId: s.siteId, name: s.name,
        lat: Number(s.lat), lng: Number(s.lng), radiusM: Number(s.radiusM) || 200
      }));
    }catch(e){}
    try{
      const emps = await API.call('listEmployees');
      const me = (emps || []).filter(x=>String(x.id) === String(eid))[0];
      if(me) T5.cache.deviceId = me.deviceId || '';
    }catch(e){}
    T5.cache.employeeId = eid;
    return T5.cache;
  }
};
window.T5 = T5;

/* ---------- native bridge: JSON STRING, no selfie or face data ---------- */
/* The session token is read exactly like 01_api.js does: Session.user, which
   is parsed from localStorage key 'ams_session' (set at login). */
window.AndroidGetPunchConfig = function(){
  const u = (typeof Session !== 'undefined' && Session.user) || {};
  const cfg = {
    token: u.token || '',
    tenantId: u.tenantId || '',
    employeeId: T5.cache.employeeId || u.employeeId || '',
    autoPunch: !!T5.cache.autoPunch,
    deviceId: T5.cache.deviceId || '',
    sites: T5.cache.sites || []
  };
  /* refresh in the background so the next call is fresh; never throws */
  try{ T5.refresh(cfg.employeeId).catch(()=>{}); }catch(e){}
  return JSON.stringify(cfg);
};
/* Async variant the app can await when it needs guaranteed-fresh values. */
window.AndroidRefreshPunchConfig = async function(employeeId){
  await T5.refresh(employeeId);
  return window.AndroidGetPunchConfig();
};

        </div>
        <label class="relative inline-flex cursor-pointer items-center shrink-0" title="${esc(I18N.t('t5.autoTitle'))}">
          <input type="checkbox" id="t5-auto-toggle" class="sr-only peer"${on ? ' checked' : ''}>
          <span class="block w-11 h-6 rounded-full bg-slate-200 peer-checked:bg-teal-500 transition-colors"></span>
          <span class="absolute left-0.5 top-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform peer-checked:translate-x-5 pointer-events-none"></span>

    </div>
  </div>`;
}

function injectToggle(){
  try{
    if(!Session.user) return false;
    if(document.getElementById('t5-auto-card')) return true;
    /* punch page marker: 30_punch.js renders a "<cid>-msg" div */
    const msg = document.querySelector('[id$="-msg"]');
    if(!msg) return false;
    const grid = msg.closest('.grid');
    if(!grid || !grid.parentNode) return false;
    const eid = T5.myEmployeeId();
    if(!eid) return false;
    grid.insertAdjacentHTML('afterend', t5CardHTML(true));
    const tgl = document.getElementById('t5-auto-toggle');
    const status = document.getElementById('t5-auto-status');
    if(!tgl || !status) return false;
    const paint = on=>{
      tgl.checked = !!on;
      status.textContent = I18N.t(on ? 't5.isOn' : 't5.isOff');
    };
    /* load the real toggle state + warm the bridge cache */
    T5.refresh(eid).then(()=>paint(T5.cache.autoPunch)).catch(()=>{});
    tgl.addEventListener('change', async ()=>{
      tgl.disabled = true;
      try{
        const r = await API.call('setAutoPunch', eid, tgl.checked);
        T5.cache.autoPunch = !!(r && r.autoPunch);
        paint(T5.cache.autoPunch);
        toast(I18N.t('t5.saved'), 'success');
      }catch(e){
        paint(!tgl.checked);
        toast((e && e.message) || I18N.t('t5.saveFail'), 'error');
      }
      tgl.disabled = false;
    });
    return true;
  }catch(e){ return false; }
}

/* Hook the punch route lazily: the route renders asynchronously, so retry
   until the marker appears (or give up quietly). */
let t5Timer = null;
function maybeHookT5(){
  if((location.hash || '') !== '#/punch') return;
  let tries = 0;
  if(t5Timer) clearInterval(t5Timer);
  t5Timer = setInterval(()=>{
    tries++;
    let done = false;
    try{ done = injectToggle(); }catch(e){ done = false; }
    if(done || tries > 24) clearInterval(t5Timer);
  }, 250);
}
window.addEventListener('hashchange', maybeHookT5);
maybeHookT5();
})();

  const cid = uid('rules');
  const canEdit = ((Session.user||{}).role === 'admin');
  el.innerHTML = pageHead(I18N.t('t6.title'), I18N.t('t6.subtitle')) +
    `<div id="${cid}-body"><div class="bg-white rounded-2xl border border-slate-200/70 p-6"><div class="h-5 shimmer rounded-xl w-1/4 mb-4"></div><div class="h-24 shimmer rounded-xl"></div></div></div>`;

  let rules;

    rules = await API.call('getRules');
  }catch(e){
    document.getElementById(cid+'-body').innerHTML =
      `<div class="bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 text-sm">${esc(I18N.t('t6.loadFail'))}: ${esc(e.message||'')}</div>`;
    return;
  }
  rules = Array.isArray(rules) ? rules : [];
  const groups = ['attendance', 'payroll'];

  document.getElementById(cid+'-body').innerHTML = groups.map(g=>{
    const rows = rules.filter(r=>r.group===g);
    if(!rows.length) return '';
    return `<div class="bg-white rounded-2xl border border-slate-200/70 shadow-[0_1px_3px_rgba(15,23,42,.05)] p-6 mb-4">
      <h3 class="font-display font-bold text-slate-800 mb-2">${esc(I18N.t('t6.group.'+g))}</h3>
      <div class="divide-y divide-slate-100">
      ${rows.map(r=>`
        <div class="flex items-center justify-between gap-6 py-4">
          <div class="min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-sm font-semibold text-slate-700">${esc(r.key)}</span>
              <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full ring-1 ring-inset ${T6_BADGE[r.source]||T6_BADGE.default}">${esc(I18N.t('t6.src.'+(r.source||'default')))}</span>
            </div>
            <div class="text-xs text-slate-400 mt-1 max-w-xl">${esc(r.description||'')}</div>
          </div>
          <div class="shrink-0">${t6Editor(cid, r, canEdit)}</div>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('') + (canEdit
    ? `<button class="${btnP}" id="${cid}-save" disabled>${esc(I18N.t('t6.save'))}</button>
       <span id="${cid}-msg" class="ml-3 text-sm text-slate-400"></span>`
    : `<p class="text-sm text-slate-400">${esc(I18N.t('t6.adminOnly'))}</p>`);

  if(!canEdit) return;

  const readVal = r=>{
    const inp = document.getElementById(cid+'-t6v-'+r.key);
    if(!inp) return r.value;
    if(r.valueType==='bool') return inp.checked;
    return inp.value;
  };
  const norm = r=>{
    const v = readVal(r);
    if(r.valueType==='bool') return !!v;
    return String(v);
  };
  const dirty = ()=> rules.some(r=> norm(r) !== (r.valueType==='bool' ? !!r.value : String(r.value)));
  const paint = ()=>{
    const btn = document.getElementById(cid+'-save');
    if(btn) btn.disabled = !dirty();
  };
  rules.forEach(r=>{
    const inp = document.getElementById(cid+'-t6v-'+r.key);
    if(inp) inp.addEventListener('change', paint);
  });

  document.getElementById(cid+'-save').onclick = async ()=>{
    const btn = document.getElementById(cid+'-save');
    const msg = document.getElementById(cid+'-msg');
    const changed = rules.filter(r=> norm(r) !== (r.valueType==='bool' ? !!r.value : String(r.value)));
    if(!changed.length){ toast(I18N.t('t6.noChanges'), 'info'); return; }
    btn.disabled = true;
    try{
      for(const r of changed){
        const res = await API.call('saveRule', r.key, readVal(r));
        r.value = res.value;
        r.source = 'rule';
      }
      toast(I18N.t('t6.saved'), 'success');
      if(msg) msg.textContent = '';
    }catch(e){
      toast((e && e.message) || I18N.t('t6.saveFail'), 'error');
    }
    paint();
  };
};
})();

function getQueue(){ try{return JSON.parse(localStorage.getItem(QKEY)||'[]');}catch(e){return [];} }
function setQueue(q){ localStorage.setItem(QKEY,JSON.stringify(q)); }
function getLastPunch(){ try{return JSON.parse(localStorage.getItem(LKEY)||'null');}catch(e){return null;} }
function setLastPunch(o){ localStorage.setItem(LKEY,JSON.stringify(o)); }

async function syncQueue(statusEl){
  const q=getQueue();
  if(!q.length){ if(statusEl) statusEl.innerHTML=''; return; }
  if(!navigator.onLine){ if(statusEl) statusEl.innerHTML=badge(I18N.t('c4.punch.offlineQueued').replace('{n}',q.length),'amber'); return; }
  let ok=0, fail=0;
  for(const item of q){
    try{
      await API.call('punch', item.employeeId, item.type, item.lat, item.lng, item.selfie, item.deviceId, 'gps');
      ok++;
    }catch(e){ fail++; }
  }
  setQueue(fail? q.slice(ok) : []);
  if(statusEl) statusEl.innerHTML = fail
    ? badge(I18N.t('c4.punch.stillQueued').replace('{n}',fail),'amber')
    : `<span class="text-emerald-600 text-sm font-medium">${I18N.t('c4.punch.syncedN').replace('{n}',ok)}</span>`;
  toast(I18N.t('c4.punch.syncedN').replace('{n}',ok), ok?'success':'warn');
}

function myEmployeeId(){
  const u=Session.user||{};
  if(u.employeeId) return u.employeeId;
  return null;
}

App.routes['#/punch'] = async (el)=>{
  const cid=uid('punch');
  const employees=await API.call('listEmployees').catch(()=>[]);
  const activeEmps=(employees||[]).filter(e=>e.active);
  const me=myEmployeeId();
  const empOpts=activeEmps.map(e=>({value:e.id, label:e.name+' ('+e.code+')'}));

  el.innerHTML=pageHead(I18N.t('c4.nav.punch'),I18N.t('c4.punch.sub'),
    `<span id="${cid}-qstatus"></span>`)+`
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 max-w-5xl">
    <div class="bg-white rounded-2xl border border-slate-200/70 shadow-[0_1px_3px_rgba(15,23,42,.05)] p-6 anim-fadeUp">
      <h3 class="font-display font-bold text-slate-800 mb-4">${I18N.t('c4.punch.step1')}</h3>
      ${field(I18N.t('c4.common.employee'),'empId',{type:'select',options:empOpts,value:me||'',cls:'mb-4'})}
      <div class="grid grid-cols-2 gap-3 mb-4">
        <div class="rounded-xl bg-slate-50 border border-slate-200/60 p-3">
          <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1">${I18N.t('c4.punch.fLatitude')}</div>
          <div id="${cid}-lat" class="font-mono text-sm text-slate-700">—</div>
        </div>
        <div class="rounded-xl bg-slate-50 border border-slate-200/60 p-3">
          <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1">${I18N.t('c4.punch.fLongitude')}</div>
          <div id="${cid}-lng" class="font-mono text-sm text-slate-700">—</div>
        </div>
      </div>
      <div id="${cid}-siteinfo" class="mb-4"></div>
      <div id="${cid}-map" class="h-52 border border-slate-200/70"></div>
    </div>
    <div class="bg-white rounded-2xl border border-slate-200/70 shadow-[0_1px_3px_rgba(15,23,42,.05)] p-6 anim-fadeUp">
      <h3 class="font-display font-bold text-slate-800 mb-4">${I18N.t('c4.punch.step2')}</h3>
      <div class="rounded-2xl overflow-hidden bg-slate-900 aspect-[4/3] relative mb-4">
        <video id="${cid}-vid" class="w-full h-full object-cover" autoplay playsinline muted></video>
        <canvas id="${cid}-cap" class="hidden"></canvas>
        <div id="${cid}-novideo" class="absolute inset-0 hidden items-center justify-center text-slate-400 text-sm text-center p-6">${I18N.t('c4.punch.camUnavailable')}</div>
      </div>
      <div class="flex gap-2 mb-5">
        <button id="${cid}-camon" class="${btnS} flex-1">${I18N.t('c4.punch.enableCam')}</button>
        <button id="${cid}-snap" class="${btnS} flex-1" disabled>${I18N.t('c4.punch.captureSelfie')}</button>
      </div>
      <div id="${cid}-shot" class="hidden mb-5 flex items-center gap-3">
        <img id="${cid}-shotimg" class="w-16 h-16 rounded-xl object-cover border border-slate-200" alt="selfie">
        <div class="text-sm"><div class="font-semibold text-emerald-600">${I18N.t('c4.punch.selfieCaptured')}</div><div class="text-slate-400 text-xs">${I18N.t('c4.punch.selfieCompressed')}</div></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <button id="${cid}-in" class="py-4 rounded-2xl bg-gradient-to-b from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white font-bold text-lg shadow-[0_4px_14px_rgba(16,185,129,.4)] active:scale-[.98] transition disabled:opacity-50">${I18N.t('c4.punch.checkInBtn')}</button>
        <button id="${cid}-out" class="py-4 rounded-2xl bg-gradient-to-b from-slate-600 to-slate-700 hover:from-slate-700 hover:to-slate-800 text-white font-bold text-lg shadow-[0_4px_14px_rgba(71,85,105,.35)] active:scale-[.98] transition disabled:opacity-50">${I18N.t('c4.punch.checkOutBtn')}</button>
      </div>
      <div id="${cid}-msg" class="mt-4"></div>
    </div>
  </div>`;

  const $=id=>document.getElementById(cid+'-'+id);
  const state={lat:null,lng:null,selfie:null,stream:null,sites:[],empId:me||''};

  /* load sites + map */
  try{
    state.sites=await API.call('listSites');
    const map=buildMap($('map'),[31.5,74.35],11);
    state.sites.filter(s=>s.active).forEach(s=>{
      L.circle([Number(s.lat),Number(s.lng)],{radius:Number(s.radiusM)||150,color:'#0ea5e9',weight:1.5,fillOpacity:.07}).addTo(map)
        .bindPopup(`<b>${esc(s.name)}</b><br>${I18N.t('c4.common.geofenceN').replace('{n}',fmtNum(s.radiusM))}`);
    });
    state.map=map; state.marker=null;
    setTimeout(()=>map.invalidateSize(),150);
  }catch(e){}

  function updateSiteInfo(){
    if(state.lat==null){ $('siteinfo').innerHTML=''; return; }
    let best=null,bestD=Infinity;
    (state.sites||[]).filter(s=>s.active).forEach(s=>{
      const d=haversineM(state.lat,state.lng,Number(s.lat),Number(s.lng));
      if(d!=null&&d<bestD){bestD=d;best=s;}
    });
    if(!best){ $('siteinfo').innerHTML=''; return; }
    const ooz=bestD>Number(best.radiusM||150);
    $('siteinfo').innerHTML=`
      <div class="rounded-xl border p-3.5 flex items-center gap-3 ${ooz?'border-red-200 bg-red-50/60':'border-emerald-200 bg-emerald-50/60'}">
        <div class="w-9 h-9 rounded-xl ${ooz?'bg-red-100 text-red-500':'bg-emerald-100 text-emerald-600'} flex items-center justify-center shrink-0">${App.ICONS.sites}</div>
        <div class="min-w-0"><div class="text-sm font-semibold ${ooz?'text-red-700':'text-emerald-800'}">${esc(best.name)}</div>
        <div class="text-xs ${ooz?'text-red-500':'text-emerald-600'}">${I18N.t('c4.punch.mAway').replace('{n}',fmtNum(Math.round(bestD)))} · ${ooz?I18N.t('c4.punch.oozFlag'):I18N.t('c4.punch.insideGeofence')}</div></div>
      </div>`;
  }

  /* geolocation */
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      state.lat=pos.coords.latitude; state.lng=pos.coords.longitude;
      $('lat').textContent=state.lat.toFixed(6); $('lng').textContent=state.lng.toFixed(6);
      updateSiteInfo();
      if(state.map){
        state.map.setView([state.lat,state.lng],15);
        state.marker=L.circleMarker([state.lat,state.lng],{radius:8,color:'#0d9488',fillColor:'#0d9488',fillOpacity:.9}).addTo(state.map).bindPopup('Your location').openPopup();
      }
    },err=>{ $('msg').innerHTML=`<div class="text-sm text-amber-600 bg-amber-50 border border-amber-200/70 rounded-xl px-4 py-3">${I18N.t('c4.punch.locUnavailable').replace('{msg}',esc(err.message))}</div>`; },
    {enableHighAccuracy:true, timeout:12000});
  }

  /* camera */
  const vid=$('vid');
  $('camon').onclick=async()=>{
    try{
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:640}, height:{ideal:480}}, audio:false});
      state.stream=stream; vid.srcObject=stream;
      $('snap').disabled=false; $('camon').disabled=true;
      $('camon').textContent=I18N.t('c4.punch.cameraOn');
    }catch(e){
      $('novideo').style.display='flex';
      toast(I18N.t('c4.punch.camNotAvailable').replace('{msg}',e.message),'warn');
    }
  };
  $('snap').onclick=()=>{
    if(!state.stream) return;
    const cap=$('cap');
    const vw=vid.videoWidth||640, vh=vid.videoHeight||480;
    const scale=Math.min(1, 320/Math.max(vw,vh));
    cap.width=Math.round(vw*scale); cap.height=Math.round(vh*scale);
    cap.getContext('2d').drawImage(vid,0,0,cap.width,cap.height);
    state.selfie=cap.toDataURL('image/jpeg',0.6);
    $('shotimg').src=state.selfie; $('shot').classList.remove('hidden'); $('shot').classList.add('flex');
  };

  async function doPunch(type){
    const msg=$('msg');
    const empSel=document.querySelector(`[name="empId"]`);
    const empId=empSel?empSel.value:state.empId;
    if(!empId){ msg.innerHTML=`<div class="text-sm text-red-600 bg-red-50 border border-red-200/70 rounded-xl px-4 py-3">${I18N.t('c4.punch.selectEmp')}</div>`; return; }
    /* client-side duplicate guard: same employee+type within 5 minutes */
    const last=getLastPunch();
    if(last&&last.employeeId===empId&&last.type===type&&(Date.now()-last.at)<5*60*1000){
      msg.innerHTML=`<div class="text-sm text-amber-700 bg-amber-50 border border-amber-200/70 rounded-xl px-4 py-3">${I18N.t('c4.punch.dupBlocked').replace('{type}',type)}</div>`;
      return;
    }
    const btn=type==='in'?$('in'):$('out');
    btn.disabled=true; btn.innerHTML='<span class="spinner"></span>';
    const payload={employeeId:empId, type, lat:state.lat, lng:state.lng, selfie:state.selfie, deviceId:'', source:'gps'};
    const queueIt=()=>{
      const q=getQueue(); q.push({...payload, queuedAt:Date.now()});
      setQueue(q);
      msg.innerHTML=`<div class="text-sm text-amber-700 bg-amber-50 border border-amber-200/70 rounded-xl px-4 py-3">
        ${I18N.t('c4.punch.queuedOffline').replace('{n}',q.length)}</div>`;
      syncQueue($('qstatus'));
      btn.disabled=false; btn.textContent=I18N.t(type==='in'?'c4.punch.checkInBtn':'c4.punch.checkOutBtn');
    };
    if(!navigator.onLine){ queueIt(); return; }
    try{
      const r=await API.call('punch', payload.employeeId, payload.type, payload.lat, payload.lng, payload.selfie, payload.deviceId, payload.source);
      setLastPunch({employeeId:empId, type, at:Date.now()});
      msg.innerHTML=`<div class="text-sm ${r.outOfZone?'text-amber-700 bg-amber-50 border-amber-200/70':'text-emerald-700 bg-emerald-50 border-emerald-200/70'} border rounded-xl px-4 py-3">
        <b>${type==='in'?I18N.t('c4.common.checkedIn'):I18N.t('c4.common.checkedOut')} ✓</b> at ${esc(r.punch.time)} · ${esc((r.site||{}).name||I18N.t('c4.punch.noSiteMatched'))} · ${I18N.t('c4.punch.mAway').replace('{n}',fmtNum(r.distanceM??0))}
        ${r.outOfZone?I18N.t('c4.punch.flaggedOoz'):''}</div>`;
      toast(I18N.t('c4.punch.recordedToast').replace('{s}',type==='in'?I18N.t('c4.common.checkedIn'):I18N.t('c4.common.checkedOut')),'success');
    }catch(e){
      /* offline or server error → queue */
      const q=getQueue(); q.push({...payload, queuedAt:Date.now()});
      setQueue(q);
      msg.innerHTML=`<div class="text-sm text-amber-700 bg-amber-50 border border-amber-200/70 rounded-xl px-4 py-3">
        ${navigator.onLine?I18N.t('c4.punch.serverBusy'):I18N.t('c4.punch.youOffline')} — ${I18N.t('c4.punch.queuedAuto').replace('{n}',q.length)}</div>`;
      syncQueue($('qstatus'));
    }
    btn.disabled=false; btn.textContent=I18N.t(type==='in'?'c4.punch.checkInBtn':'c4.punch.checkOutBtn');
  }
  $('in').onclick=()=>doPunch('in');
  $('out').onclick=()=>doPunch('out');

  /* offline queue status + auto-sync */
  const qs=$('qstatus');
  const q0=getQueue();
  if(q0.length) qs.innerHTML=badge(I18N.t('c4.punch.queuedN').replace('{n}',q0.length),'amber');
  syncQueue(qs);
  window.addEventListener('online',()=>syncQueue(qs));
};
})();

/* 40_employees.js — employee table, add/edit modal, device bind/unbind,
   CSV import, departments tab. */
(function(){
'use strict';

App.nav.push({group:'WORKFORCE', path:'#/employees', label:I18N.t('c4.nav.employees'), labelKey:'c4.nav.employees', icon:'employees', perm:'employees'});

App.routes['#/employees'] = async (el, params)=>{
  const cid=uid('emp');
  const tab=(params&&params.tab)||'list';
  el.innerHTML=pageHead(I18N.t('c4.nav.employees'),I18N.t('c4.emp.sub'),
    `${perm('employees','edit')?`<button class="${btnP}" id="${cid}-add">${I18N.t('c4.emp.addEmployee')}</button><button class="${btnS}" id="${cid}-import">${I18N.t('c4.emp.importCsv')}</button>`:''}`)+
  `<div class="flex gap-2 mb-5">
    <a href="#/employees" class="px-4 py-2 rounded-xl text-sm font-semibold ${tab==='list'?'bg-teal-600 text-white shadow':'bg-white text-slate-500 border border-slate-200'}">${I18N.t('c4.emp.tabEmployees')}</a>
    <a href="#/employees?tab=departments" class="px-4 py-2 rounded-xl text-sm font-semibold ${tab==='departments'?'bg-teal-600 text-white shadow':'bg-white text-slate-500 border border-slate-200'}">${I18N.t('c4.emp.tabDepartments')}</a>
  </div>
  <div class="mb-4"><input id="${cid}-q" placeholder="${I18N.t('c4.emp.searchPh')}" class="bg-white border border-slate-200 rounded-xl px-4 py-2.5 w-full max-w-sm text-sm focus:ring-2 focus:ring-teal-500/40 focus:border-teal-500 focus:outline-none"></div>
  <div id="${cid}-body"></div>`;

  const body=document.getElementById(cid+'-body');
  let emps=[], depts=[];
  async function load(){
    emps=await API.call('listEmployees');
    depts=await API.call('listDepartments');
    render();
  }
  function render(){
    const q=(document.getElementById(cid+'-q').value||'').toLowerCase();
    if(tab==='departments'){
      body.innerHTML=(perm('employees','edit')?`<div class="flex justify-end mb-3"><button class="${btnS}" id="${cid}-addDept">${I18N.t('c4.emp.addDept')}</button></div>`:'')+tableHTML([
        {label:I18N.t('c4.emp.colDepartment'), get:d=>`<span class="font-semibold text-slate-700">${esc(d.name)}</span>`},
        {label:I18N.t('c4.emp.colHeadcount'), num:1, get:d=>fmtNum(d.headcount)},
        {label:'', get:d=>perm('employees','edit')?`<div class="flex gap-1 justify-end"><button class="${btnS} !px-3 !py-1.5 !text-xs" data-ed="${d.id}">${I18N.t('c4.common.edit')}</button><button class="${btnS} !px-3 !py-1.5 !text-xs !text-red-600" data-del="${d.id}">${I18N.t('c4.common.delete')}</button></div>`:''},
      ], depts.filter(d=>d.name.toLowerCase().includes(q)), {empty:I18N.t('c4.emp.emptyDepts')});
      if(perm('employees','edit')){
        const addD=document.getElementById(cid+'-addDept');
        if(addD) addD.onclick=()=>{
          const m=modal(I18N.t('c4.emp.addDeptTitle'), `${field(I18N.t('c4.emp.deptName'),'name',{req:true})}<div class="flex justify-end gap-2 mt-5"><button class="${btnS}" id="dCancel">${I18N.t('c4.common.cancel')}</button><button class="${btnP}" id="dSave">${I18N.t('c4.common.save')}</button></div>`);
          m.el.querySelector('#dCancel').onclick=()=>m.close();
          m.el.querySelector('#dSave').onclick=async()=>{ const nm=formVal(m.el,'name'); if(!nm){toast(I18N.t('c4.emp.nameRequired'),'warn');return;} await API.call('saveDepartment',{name:nm}); m.close(); toast(I18N.t('c4.emp.deptSaved'),'success'); load(); };
        };
        body.querySelectorAll('[data-ed]').forEach(b=>b.onclick=async()=>{
          const d=depts.find(x=>x.id===b.dataset.ed);
          const m=modal(I18N.t('c4.emp.editDeptTitle'), `${field(I18N.t('c4.emp.deptName'),'name',{value:d.name,req:true})}<div class="flex justify-end gap-2 mt-5"><button class="${btnS}" id="dCancel">${I18N.t('c4.common.cancel')}</button><button class="${btnP}" id="dSave">${I18N.t('c4.common.save')}</button></div>`);
          m.el.querySelector('#dCancel').onclick=()=>m.close();
          m.el.querySelector('#dSave').onclick=async()=>{ await API.call('saveDepartment',{id:d.id,name:formVal(m.el,'name')}); m.close(); toast(I18N.t('c4.emp.deptSaved'),'success'); load(); };
        });
        body.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
          if(!await confirmDlg(I18N.t('c4.emp.delDeptTitle'),I18N.t('c4.emp.cannotUndo'),I18N.t('c4.common.delete'))) return;
          try{ await API.call('deleteDepartment',b.dataset.del); toast(I18N.t('c4.emp.deleted'),'success'); load(); }catch(e){ toast(e.message,'error'); }
        });
      }
      return;
    }
    const rows=emps.filter(e=>(e.name+' '+e.code+' '+(e.phone||'')).toLowerCase().includes(q));
    body.innerHTML=tableHTML([
      {label:I18N.t('c4.emp.colEmployee'), get:e=>`<div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl bg-teal-50 text-teal-700 flex items-center justify-center font-bold text-sm">${esc((e.name||'?')[0])}</div><div><div class="font-semibold text-slate-700">${esc(e.name)}</div><div class="text-xs text-slate-400">${esc(e.code)} · ${esc(e.designation||'—')}</div></div></div>`},
      {label:I18N.t('c4.emp.colDepartment'), get:e=>esc(e.department||'—')},
      {label:I18N.t('c4.emp.colPhone'), get:e=>esc(e.phone||'—')},
      {label:I18N.t('c4.emp.colSalary'), num:1, get:e=>`<span class="tabular-nums">${fmt(e.salary)}</span>`},
      {label:I18N.t('c4.emp.colDevice'), get:e=>e.deviceId?`<span class="font-mono text-xs bg-slate-100 px-2 py-1 rounded-lg">${esc(e.deviceId)}</span>`:'<span class="text-slate-300 text-xs">'+I18N.t('c4.emp.notBound')+'</span>'},
      {label:I18N.t('c4.common.status'), get:e=>e.active?badge(I18N.t('c4.common.active'),'emerald'):badge(I18N.t('c4.common.inactive'),'slate')},
      {label:'', get:e=>perm('employees','edit')?`<div class="flex gap-1 justify-end">
        <button class="${btnS} !px-3 !py-1.5 !text-xs" data-edit="${e.id}">${I18N.t('c4.common.edit')}</button>
        <button class="${btnS} !px-3 !py-1.5 !text-xs" data-dev="${e.id}">${e.deviceId?I18N.t('c4.common.unbind'):I18N.t('c4.common.bind')}</button>
        <button class="${btnS} !px-3 !py-1.5 !text-xs !text-red-600" data-del="${e.id}">${I18N.t('c4.common.delete')}</button></div>`:''},
    ], rows, {empty:I18N.t('c4.emp.emptyEmps')});
    bindRow();
  }
  function bindRow(){
    body.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(emps.find(e=>e.id===b.dataset.edit)));
    body.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      if(!await confirmDlg(I18N.t('c4.emp.delEmpTitle'),I18N.t('c4.emp.delEmpMsg'),I18N.t('c4.common.delete'))) return;
      await API.call('deleteEmployee',b.dataset.del); toast(I18N.t('c4.emp.empDeleted'),'success'); load();
    });
    body.querySelectorAll('[data-dev]').forEach(b=>b.onclick=async()=>{
      const e=emps.find(x=>x.id===b.dataset.dev);
      if(e.deviceId){
        await API.call('unbindDevice',e.id); toast(I18N.t('c4.emp.deviceUnbound'),'success'); load();
      }else{
        const m=modal(I18N.t('c4.emp.bindTitle'),`<p class="text-sm text-slate-500 mb-4">${I18N.t('c4.emp.bindMsg').replace('{name}',esc(e.name))}</p>
          ${field(I18N.t('c4.emp.fDeviceId'),'deviceId',{ph:'ZK-1001',req:true})}
          <div class="flex justify-end gap-2 mt-5"><button class="${btnS}" id="dCancel">${I18N.t('c4.common.cancel')}</button><button class="${btnP}" id="dSave">${I18N.t('c4.common.bind')}</button></div>`);
        m.el.querySelector('#dCancel').onclick=()=>m.close();
        m.el.querySelector('#dSave').onclick=async()=>{
          await API.call('bindDevice',e.id,formVal(m.el,'deviceId')); m.close(); toast(I18N.t('c4.emp.deviceBound'),'success'); load();
        };
      }
    });
  }
  function openEditor(e){
    const isNew=!e; e=e||{name:'',code:'',departmentId:'d1',designation:'',phone:'',email:'',salary:0,joinDate:todayISO(),active:true};
    const m=modal(isNew?I18N.t('c4.emp.addEmpTitle'):I18N.t('c4.emp.editEmpTitle'),`
      <div class="grid grid-cols-2 gap-4">
        ${field(I18N.t('c4.emp.fFullName'),'name',{value:e.name,req:true})}
        ${field(I18N.t('c4.emp.fEmpCode'),'code',{value:e.code,ph:'EMP-011'})}
        ${field(I18N.t('c4.emp.colDepartment'),'departmentId',{type:'select',value:e.departmentId,options:depts.map(d=>({value:d.id,label:d.name}))})}
        ${field(I18N.t('c4.emp.fDesignation'),'designation',{value:e.designation||''})}
        ${field(I18N.t('c4.emp.fPhone'),'phone',{value:e.phone||'',ph:'0300-0000000'})}
        ${field(I18N.t('c4.emp.fEmail'),'email',{value:e.email||'',type:'email'})}
        ${field(I18N.t('c4.emp.fSalary'),'salary',{value:e.salary||0,type:'number',min:0})}
        ${field(I18N.t('c4.emp.fJoinDate'),'joinDate',{value:e.joinDate||todayISO(),type:'date'})}
        <div class="col-span-2">${field(I18N.t('c4.emp.fActive'),'active',{type:'checkbox',value:e.active})}</div>
      </div>
      <div class="flex justify-end gap-2 mt-6"><button class="${btnS}" id="eCancel">${I18N.t('c4.common.cancel')}</button><button class="${btnP}" id="eSave">${I18N.t('c4.emp.saveEmployee')}</button></div>`,{wide:true});
    m.el.querySelector('#eCancel').onclick=()=>m.close();
    m.el.querySelector('#eSave').onclick=async()=>{
      const data=collectForm(m.el);
      if(!data.name){ toast(I18N.t('c4.emp.nameIsRequired'),'warn'); return; }
      await API.call('saveEmployee',{...(isNew?{}:{id:e.id}),...data});
      m.close(); toast(I18N.t('c4.emp.empSaved'),'success'); load();
    };
  }
  const addB=document.getElementById(cid+'-add'); if(addB) addB.onclick=()=>openEditor(null);
  const impB=document.getElementById(cid+'-import');
  if(impB) impB.onclick=()=>{
    const m=modal(I18N.t('c4.emp.importTitle'),`
      <p class="text-sm text-slate-500 mb-3">${I18N.t('c4.emp.importHelp')}<code class="bg-slate-100 px-1 rounded">name,code,designation,phone,email,salary,joinDate</code></p>
      <input type="file" id="csvFile" accept=".csv" class="text-sm mb-4">
      <div class="flex justify-end gap-2"><button class="${btnS}" id="iCancel">${I18N.t('c4.common.cancel')}</button><button class="${btnP}" id="iGo">${I18N.t('c4.common.import')}</button></div>`);
    m.el.querySelector('#iCancel').onclick=()=>m.close();
    m.el.querySelector('#iGo').onclick=()=>{
      const f=m.el.querySelector('#csvFile').files[0];
      if(!f){ toast(I18N.t('c4.emp.chooseCsv'),'warn'); return; }
      const rd=new FileReader();
      rd.onload=async()=>{
        try{
          const lines=String(rd.result).split(/\r?\n/).filter(l=>l.trim());
          const heads=lines[0].split(',').map(h=>h.trim().toLowerCase());
          const rows=lines.slice(1).map(l=>{ const cells=l.split(','); const o={}; heads.forEach((h2,i)=>o[h2]=(cells[i]||'').trim()); return o; });
          const r=await API.call('importEmployeesCSV',rows);
          m.close(); toast(I18N.t('c4.emp.importedN').replace('{n}',r.imported),'success'); load();
        }catch(e2){ toast(e2.message,'error'); }
      };
      rd.readAsText(f);
    };
  };
  document.getElementById(cid+'-q').addEventListener('input',debounce(render,200));
  await load();
};
})();


/* ===== 50_sites.js ===== */
/* 50_sites.js — site table + Leaflet map picker modal (lat/lng + radius slider)
   + employee assignment checkboxes. */
(function(){
'use strict';

App.nav.push({group:'WORKFORCE', path:'#/sites', label:I18N.t('c4.nav.sites'), labelKey:'c4.nav.sites', icon:'sites', perm:'sites'});

App.routes['#/sites'] = async (el)=>{
  const cid=uid('sites');
  el.innerHTML=pageHead(I18N.t('c4.nav.sites'),I18N.t('c4.sites.sub'),
    `${perm('sites','edit')?`<button class="${btnP}" id="${cid}-add">${I18N.t('c4.sites.addSite')}</button>`:''}`)+
    `<div id="${cid}-body"></div>`;
  const body=document.getElementById(cid+'-body');
  let sites=[], emps=[];
  async function load(){
    sites=await API.call('listSites');
    emps=await API.call('listEmployees');
    body.innerHTML=tableHTML([
      {label:I18N.t('c4.sites.colSite'), get:s=>`<div><div class="font-semibold text-slate-700">${esc(s.name)}</div><div class="text-xs text-slate-400">${esc(s.address||'—')}</div></div>`},
      {label:I18N.t('c4.sites.colCoords'), get:s=>`<span class="font-mono text-xs">${Number(s.lat).toFixed(4)}, ${Number(s.lng).toFixed(4)}</span>`},
      {label:I18N.t('c4.sites.colGeofence'), num:1, get:s=>`<span class="tabular-nums">${fmtNum(s.radiusM)} m</span>`},
      {label:I18N.t('c4.sites.colStaff'), num:1, get:s=>fmtNum(s.employeeCount||0)},
      {label:I18N.t('c4.common.status'), get:s=>s.active?badge(I18N.t('c4.common.active'),'emerald'):badge(I18N.t('c4.common.inactive'),'slate')},
      {label:'', get:s=>perm('sites','edit')?`<div class="flex gap-1 justify-end">
        <button class="${btnS} !px-3 !py-1.5 !text-xs" data-assign="${s.id}">${I18N.t('c4.sites.assignStaff')}</button>
        <button class="${btnS} !px-3 !py-1.5 !text-xs" data-edit="${s.id}">${I18N.t('c4.common.edit')}</button>
        <button class="${btnS} !px-3 !py-1.5 !text-xs !text-red-600" data-del="${s.id}">${I18N.t('c4.common.delete')}</button></div>`:''},
    ], sites, {empty:I18N.t('c4.sites.emptySites')});
    body.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(sites.find(s=>s.id===b.dataset.edit)));
    body.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      if(!await confirmDlg(I18N.t('c4.sites.delSiteTitle'),I18N.t('c4.sites.delSiteMsg'),I18N.t('c4.common.delete'))) return;
      await API.call('deleteSite',b.dataset.del); toast(I18N.t('c4.sites.siteDeleted'),'success'); load();
    });
    body.querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>openAssign(b.dataset.assign));
  }

  function openEditor(s){
    const isNew=!s; s=s||{name:'',address:'',lat:31.5204,lng:74.3587,radiusM:150,active:true};
    const m=modal(isNew?I18N.t('c4.sites.addSiteTitle'):I18N.t('c4.sites.editSiteTitle'),`
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div class="col-span-2">${field(I18N.t('c4.sites.fSiteName'),'name',{value:s.name,req:true})}</div>
        <div class="col-span-2">${field(I18N.t('c4.sites.fAddress'),'address',{value:s.address||''})}</div>
        ${field(I18N.t('c4.sites.fLat'),'lat',{value:s.lat,type:'number',step:'0.000001',req:true})}
        ${field(I18N.t('c4.sites.fLng'),'lng',{value:s.lng,type:'number',step:'0.000001',req:true})}
        <div class="col-span-2"><label class="block"><span class="block text-xs font-semibold text-slate-500 mb-1.5 tracking-wide">${I18N.t('c4.sites.fRadius')} · <span id="radVal" class="text-teal-600">${fmtNum(s.radiusM)} m</span></span>
          <input type="range" name="radiusM" min="50" max="1000" step="10" value="${s.radiusM}" class="w-full accent-teal-600"></label></div>
        <div class="col-span-2">${field(I18N.t('c4.emp.fActive'),'active',{type:'checkbox',value:s.active})}</div>
      </div>
      <div id="mapPick" class="h-64 border border-slate-200/70 mb-2"></div>
      <p class="text-xs text-slate-400 mb-4">${I18N.t('c4.sites.mapHint')}</p>
      <div class="flex justify-end gap-2"><button class="${btnS}" id="sCancel">${I18N.t('c4.common.cancel')}</button><button class="${btnP}" id="sSave">${I18N.t('c4.sites.saveSite')}</button></div>`,{wide:true});
    const mapEl=m.el.querySelector('#mapPick');
    const map=buildMap(mapEl,[Number(s.lat),Number(s.lng)],14);
    let marker=null, circle=null;
    const radInput=m.el.querySelector('[name="radiusM"]');
    const radVal=m.el.querySelector('#radVal');
    radInput.addEventListener('input',()=>{ radVal.textContent=fmtNum(radInput.value)+' m'; if(circle) circle.setRadius(Number(radInput.value)); });
    if(map){
      marker=L.marker([Number(s.lat),Number(s.lng)],{draggable:true}).addTo(map);
      circle=L.circle([Number(s.lat),Number(s.lng)],{radius:Number(s.radiusM),color:'#0d9488',weight:2,fillOpacity:.08}).addTo(map);
      marker.on('dragend',sync);
      map.on('click',e=>{ marker.setLatLng(e.latlng); sync(); });
      setTimeout(()=>map.invalidateSize(),150);
    }
    function sync(){
      if(!marker) return;
      const lat=marker.getLatLng().lat, lng=marker.getLatLng().lng;
      m.el.querySelector('[name="lat"]').value=lat.toFixed(6);
      m.el.querySelector('[name="lng"]').value=lng.toFixed(6);
      if(circle) circle.setLatLng([lat,lng]);
    }
    m.el.querySelector('#sCancel').onclick=()=>m.close();
    m.el.querySelector('#sSave').onclick=async()=>{
      const data=collectForm(m.el);
      if(!data.name){ toast(I18N.t('c4.sites.siteNameRequired'),'warn'); return; }
      data.radiusM=Number(data.radiusM)||150;
      await API.call('saveSite',{...(isNew?{}:{id:s.id}),...data});
      m.close(); toast(I18N.t('c4.sites.siteSaved'),'success'); load();
    };
  }

  function openAssign(siteId){
    const s=sites.find(x=>x.id===siteId);
    const assigned=s.employeeIds||(window.MockDB?MockDB.siteEmployees:[]).filter(x=>x.siteId===siteId).map(x=>x.employeeId);
    const m=modal(I18N.t('c4.sites.assignTitle').replace('{name}',s.name),`
      <div class="max-h-80 overflow-y-auto space-y-1 mb-5">
        ${emps.filter(e=>e.active).map(e=>`<label class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-50 cursor-pointer">
          <input type="checkbox" name="emp" value="${e.id}" ${assigned.includes(e.id)?'checked':''} class="w-4 h-4 rounded accent-teal-600">
          <span class="text-sm font-medium text-slate-700">${esc(e.name)}</span><span class="text-xs text-slate-400 ml-auto">${esc(e.code)}</span></label>`).join('')}
      </div>
      <div class="flex justify-end gap-2"><button class="${btnS}" id="aCancel">${I18N.t('c4.common.cancel')}</button><button class="${btnP}" id="aSave">${I18N.t('c4.sites.saveAssignments')}</button></div>`);
    m.el.querySelector('#aCancel').onclick=()=>m.close();
    m.el.querySelector('#aSave').onclick=async()=>{
      const ids=[...m.el.querySelectorAll('[name="emp"]:checked')].map(x=>x.value);
      await API.call('assignSiteEmployees',siteId,ids);
      m.close(); toast(I18N.t('c4.sites.assignedN').replace('{n}',ids.length),'success'); load();
    };
  }

  const addB=document.getElementById(cid+'-add'); if(addB) addB.onclick=()=>openEditor(null);
  await load();
};
})();

    ], rosters, {empty:I18N.t('c4.shifts.emptyRoster')});
    rosterEl.querySelectorAll('[data-rd]').forEach(b=>b.onclick=async()=>{

  function openShiftEditor(s){

      <div class="grid grid-cols-2 gap-4">

    m.el.querySelector('#rCancel').onclick=()=>m.close();

/* ===== 70_attendance.js ===== */
/* 70_attendance.js — attendance log with filters, live map, bulk-mark modal,
   delete punch, corrections tab with approve/reject. */
(function(){
'use strict';

App.nav.push({group:'MAIN', path:'#/attendance', label:I18N.t('c4.nav.attendance'), labelKey:'c4.nav.attendance', icon:'attendance', perm:'attendance'});

App.routes['#/attendance'] = async (el, params)=>{
  const cid=uid('att');
  const tab=(params&&params.tab)||'log';
  const canEdit=perm('attendance','edit');
  el.innerHTML=pageHead(I18N.t('c4.nav.attendance'),I18N.t('c4.att.sub'),
    `${canEdit?`<button class="${btnP}" id="${cid}-bulk">${I18N.t('c4.att.bulkMark')}</button>`:''}`)+`
  <div class="flex gap-2 mb-5">
    ${[['log',I18N.t('c4.att.tabLog')],['map',I18N.t('c4.att.tabMap')],['corrections',I18N.t('c4.att.tabCorrections')]].map(([k,l])=>
      `<a href="#/attendance${k==='log'?'':'?tab='+k}" class="px-4 py-2 rounded-xl text-sm font-semibold ${tab===k?'bg-teal-600 text-white shadow':'bg-white text-slate-500 border border-slate-200'}">${l}</a>`).join('')}
  </div>
  <div id="${cid}-body"></div>`;
  const body=document.getElementById(cid+'-body');
  const bulkB=document.getElementById(cid+'-bulk');

  if(tab==='map'){
    body.innerHTML=`<div class="bg-white rounded-2xl border border-slate-200/70 shadow-[0_1px_3px_rgba(15,23,42,.05)] p-6">
      <div class="flex items-center justify-between mb-4"><h3 class="font-display font-bold text-slate-800">${I18N.t('c4.att.liveMapToday')}</h3>
      <button class="${btnS}" id="${cid}-refresh">${I18N.t('c4.common.refresh')}</button></div>
      <div id="${cid}-livemap" class="h-[480px] border border-slate-200/70"></div></div>`;
    const draw=async()=>{
      const mapEl=document.getElementById(cid+'-livemap'); if(!mapEl) return;
      mapEl.innerHTML='';
      const map=buildMap(mapEl,[31.5,74.35],11);
      if(!map) return;
      const pts=await API.call('getLiveMap');
      (pts||[]).forEach(p=>{
        const m=L.circleMarker([p.lat,p.lng],{radius:7,color:p.outOfZone?'#ef4444':'#0d9488',fillColor:p.outOfZone?'#ef4444':'#0d9488',fillOpacity:.9,weight:2})
          .addTo(map).bindPopup(`<b>${esc(p.employeeName)}</b><br>${p.type==='in'?I18N.t('c4.common.checkedIn'):I18N.t('c4.common.checkedOut')} · ${esc(p.time)}<br>${esc(p.siteName)}${p.outOfZone?I18N.t('c4.att.oozPopup'):''}${p.selfie?I18N.t('c4.att.selfieAttached'):''}`);
      });
      const sites=await API.call('listSites');
      (sites||[]).filter(s=>s.active).forEach(s=>{
        L.circle([Number(s.lat),Number(s.lng)],{radius:Number(s.radiusM)||150,color:'#0ea5e9',weight:1.5,fillOpacity:.05}).addTo(map)
          .bindPopup(`<b>${esc(s.name)}</b><br>${I18N.t('c4.common.geofenceN').replace('{n}',fmtNum(s.radiusM))}`);
      });
      setTimeout(()=>map.invalidateSize(),150);
      const rf=document.getElementById(cid+'-refresh'); if(rf) rf.onclick=draw;
    };
    await draw();
    return;
  }

  if(tab==='corrections'){
    const rows=await API.call('listCorrections');
    body.innerHTML=tableHTML([
      {label:I18N.t('c4.common.employee'), get:c=>`<span class="font-medium text-slate-700">${esc(c.employeeName)}</span>`},
      {label:I18N.t('c4.att.colPunch'), get:c=>`${esc(c.punchDate)} · ${c.punchType==='in'?I18N.t('c4.common.checkIn'):I18N.t('c4.common.checkOut')} ${esc(c.punchTime)}`},
      {label:I18N.t('c4.att.colRequest'), get:c=>`<span class="text-slate-600">${esc(c.note)}</span>`},
      {label:I18N.t('c4.common.status'), get:c=>c.status==='pending'?badge(I18N.t('c4.common.pending'),'amber'):c.status==='approved'?badge(I18N.t('c4.common.approved'),'emerald'):badge(I18N.t('c4.common.rejected'),'red')},
      {label:'', get:c=>c.status==='pending'&&canEdit?`<div class="flex gap-1 justify-end">
        <button class="${btnS} !px-3 !py-1.5 !text-xs !text-emerald-700" data-ok="${c.id}">${I18N.t('c4.common.approve')}</button>
        <button class="${btnS} !px-3 !py-1.5 !text-xs !text-red-600" data-no="${c.id}">${I18N.t('c4.common.reject')}</button></div>`:`<span class="text-xs text-slate-400">${esc(c.decidedBy||'')}</span>`},
    ], rows, {empty:I18N.t('c4.att.emptyCorrections')});
    body.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{ await API.call('decideCorrection',b.dataset.ok,'approved'); toast(I18N.t('c4.att.correctionApproved'),'success'); App.route(); });
    body.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{ await API.call('decideCorrection',b.dataset.no,'rejected'); toast(I18N.t('c4.att.correctionRejected'),'success'); App.route(); });
    return;
  }

  /* punch log */
  const emps=await API.call('listEmployees').catch(()=>[]);
  const sites=await API.call('listSites').catch(()=>[]);
  body.innerHTML=`
    <div class="bg-white rounded-2xl border border-slate-200/70 p-4 mb-4 flex flex-wrap gap-3 items-end anim-fadeUp">
      ${field(I18N.t('c4.common.from'),'from',{type:'date',value:addDays(todayISO(),-7)})}
      ${field(I18N.t('c4.common.to'),'to',{type:'date',value:todayISO()})}
      ${field(I18N.t('c4.common.employee'),'employeeId',{type:'select',options:[{value:'',label:I18N.t('c4.att.allEmployees')}].concat(emps.filter(e=>e.active).map(e=>({value:e.id,label:e.name})))})}
      ${field(I18N.t('c4.common.site'),'siteId',{type:'select',options:[{value:'',label:I18N.t('c4.att.allSites')}].concat(sites.map(s=>({value:s.id,label:s.name})))})}
      <label class="flex items-center gap-2 text-sm cursor-pointer pb-2.5"><input type="checkbox" id="${cid}-ooz" class="w-4 h-4 rounded accent-teal-600"><span class="font-medium text-slate-600">${I18N.t('c4.att.oozOnly')}</span></label>
      <button class="${btnP}" id="${cid}-go">${I18N.t('c4.common.apply')}</button>
      <button class="${btnS}" id="${cid}-csv">${I18N.t('c4.att.exportCsv')}</button>
    </div>
    <div id="${cid}-rows"></div>`;
  const rowsEl=document.getElementById(cid+'-rows');
  async function load(){
    const f={
      from:formVal(body,'from'), to:formVal(body,'to'),
      employeeId:formVal(body,'employeeId'), siteId:formVal(body,'siteId'),
      outOfZone:document.getElementById(cid+'-ooz').checked||'',
    };
    const rows=await API.call('listAttendance',f);
    rowsEl.innerHTML=tableHTML([
      {label:I18N.t('c4.common.date'), get:p=>`<span class="tabular-nums">${fmtDate(p.date)}</span>`},
      {label:I18N.t('c4.common.employee'), get:p=>`<div><div class="font-medium text-slate-700">${esc(p.employeeName)}</div><div class="text-xs text-slate-400">${esc(p.employeeCode||'')}</div></div>`},
      {label:I18N.t('c4.att.colType'), get:p=>p.type==='in'?badge(I18N.t('c4.common.checkIn'),'emerald'):badge(I18N.t('c4.common.checkOut'),'slate')},
      {label:I18N.t('c4.att.colTime'), get:p=>`<span class="tabular-nums font-medium">${esc(p.time)}</span>`},
      {label:I18N.t('c4.common.site'), get:p=>esc(p.siteName||'—')},
      {label:I18N.t('c4.att.colDistance'), num:1, get:p=>p.distanceM!=null?`<span class="tabular-nums">${fmtNum(p.distanceM)} m</span>`:'<span class="text-slate-300">—</span>'},
      {label:I18N.t('c4.att.colZone'), get:p=>p.outOfZone?badge(I18N.t('c4.common.outOfZone'),'red'):badge(I18N.t('c4.common.inZone'),'teal')},
      {label:I18N.t('c4.att.colSource'), get:p=>`<span class="text-xs text-slate-400">${esc(p.source||'')}</span>`},
      {label:'', get:p=>`<div class="flex gap-1 justify-end">
        ${p.selfie?`<button class="${btnS} !px-2.5 !py-1.5 !text-xs" data-img="${p.id}">${I18N.t('c4.att.selfieBtn')}</button>`:''}
        ${canEdit?`<button class="${btnS} !px-2.5 !py-1.5 !text-xs" data-corr="${p.id}">${I18N.t('c4.att.requestFix')}</button>
        <button class="${btnS} !px-2.5 !py-1.5 !text-xs !text-red-600" data-del="${p.id}">✕</button>`:''}</div>`},
    ], rows, {empty:I18N.t('c4.att.emptyLog')});
    rowsEl.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      if(!await confirmDlg(I18N.t('c4.att.delPunchTitle'),I18N.t('c4.emp.cannotUndo'),I18N.t('c4.common.delete'))) return;
      await API.call('deletePunch',b.dataset.del); toast(I18N.t('c4.att.punchDeleted'),'success'); load();
    });
    rowsEl.querySelectorAll('[data-corr]').forEach(b=>b.onclick=()=>{
      const m=modal(I18N.t('c4.att.reqCorrectionTitle'),`${field(I18N.t('c4.att.fWhatCorrected'),'note',{type:'textarea',ph:I18N.t('c4.att.phCorrection'),req:true})}
        <div class="flex justify-end gap-2 mt-5"><button class="${btnS}" id="cCancel">${I18N.t('c4.common.cancel')}</button><button class="${btnP}" id="cSend">${I18N.t('c4.att.sendRequest')}</button></div>`);
      m.el.querySelector('#cCancel').onclick=()=>m.close();
      m.el.querySelector('#cSend').onclick=async()=>{
        const note=formVal(m.el,'note'); if(!note){toast(I18N.t('c4.att.describeCorrection'),'warn');return;}
        await API.call('requestCorrection',b.dataset.corr,note); m.close(); toast(I18N.t('c4.att.correctionRequested'),'success');
      };
    });
    rowsEl.querySelectorAll('[data-img]').forEach(b=>b.onclick=async()=>{
      const all=await API.call('listAttendance',{from:formVal(body,'from'),to:formVal(body,'to')});
      const p=all.find(x=>x.id===b.dataset.img);
      if(p&&p.selfie) modal(I18N.t('c4.att.selfieTitle').replace('{name}',p.employeeName),`<img src="${p.selfie}" class="rounded-2xl w-full" alt="selfie"><p class="text-xs text-slate-400 mt-3">${fmtDate(p.date)} · ${esc(p.time)} · ${esc(p.siteName||'')}</p>`);
      else toast(I18N.t('c4.att.noSelfie'),'warn');
    });
  }
  document.getElementById(cid+'-go').onclick=load;
  document.getElementById(cid+'-csv').onclick=async()=>{
    const r=await API.call('exportCSV','attendance',{from:formVal(body,'from'),to:formVal(body,'to')});
    downloadCSV(r.filename,r.csv); toast(I18N.t('c4.att.csvDownloaded'),'success');
  };
  await load();

  if(bulkB) bulkB.onclick=async()=>{
    const m=modal(I18N.t('c4.att.bulkTitle'),`
      <div class="grid grid-cols-2 gap-4 mb-4">
        ${field(I18N.t('c4.common.date'),'date',{type:'date',value:todayISO(),req:true})}
        ${field(I18N.t('c4.att.fType'),'type',{type:'select',options:[{value:'in',label:I18N.t('c4.common.checkIn')},{value:'out',label:I18N.t('c4.common.checkOut')}]})}
      </div>
      ${field(I18N.t('c4.att.fNote'),'note',{ph:I18N.t('c4.att.phNote')})}
      <div class="max-h-64 overflow-y-auto border border-slate-200/70 rounded-2xl mt-4 mb-4 divide-y divide-slate-50">
        ${emps.filter(e=>e.active).map(e=>`<label class="flex items-center gap-3 px-4 py-2.5 hover:bg-slate-50 cursor-pointer">
          <input type="checkbox" name="bemp" value="${e.id}" class="w-4 h-4 rounded accent-teal-600">
          <span class="text-sm font-medium text-slate-700">${esc(e.name)}</span><span class="text-xs text-slate-400 ml-auto">${esc(e.code)}</span></label>`).join('')}
      </div>
      <div class="flex justify-end gap-2"><button class="${btnS}" id="bCancel">${I18N.t('c4.common.cancel')}</button><button class="${btnP}" id="bGo">${I18N.t('c4.att.markSelected')}</button></div>`);
    m.el.querySelector('#bCancel').onclick=()=>m.close();
    m.el.querySelector('#bGo').onclick=async()=>{
      const ids=[...m.el.querySelectorAll('[name="bemp"]:checked')].map(x=>x.value);
      if(!ids.length){ toast(I18N.t('c4.att.selectOne'),'warn'); return; }
      const r=await API.call('bulkMark',formVal(m.el,'date'),ids,formVal(m.el,'type'),formVal(m.el,'note'));
      m.close(); toast(I18N.t('c4.att.markedN').replace('{n}',r.count),'success'); load();
    };
  };
};
})();


/* ===== 80_leave.js ===== */
/* 80_leave.js — leave types, balances, requests approve/reject, holidays. */
(function(){
'use strict';

App.nav.push({group:'PEOPLE', path:'#/leave', label:I18N.t('c4.nav.leave'), labelKey:'c4.nav.leave', icon:'leave', perm:'leave'});

App.routes['#/leave'] = async (el, params)=>{
  const cid=uid('leave');
  const tab=(params&&params.tab)||'requests';
  const canEdit=perm('leave','edit');
  el.innerHTML=pageHead(I18N.t('c4.leave.title'),I18N.t('c4.leave.sub'),
    `${canEdit?`<button class="${btnS}" id="${cid}-holiday">${I18N.t('c4.leave.addHoliday')}</button><button class="${btnS}" id="${cid}-type">${I18N.t('c4.leave.addLeaveType')}</button>`:''}<button class="${btnP}" id="${cid}-req">${I18N.t('c4.leave.requestLeave')}</button>`)+`
  <div class="flex gap-2 mb-5 flex-wrap">
    ${[['requests',I18N.t('c4.leave.tabRequests')],['balances',I18N.t('c4.leave.tabBalances')],['types',I18N.t('c4.leave.tabTypes')],['holidays',I18N.t('c4.leave.tabHolidays')]].map(([k,l])=>
      `<a href="#/leave${k==='requests'?'':'?tab='+k}" class="px-4 py-2 rounded-xl text-sm font-semibold ${tab===k?'bg-teal-600 text-white shadow':'bg-white text-slate-500 border border-slate-200'}">${l}</a>`).join('')}
  </div>
  <div id="${cid}-body"></div>`;
  const body=document.getElementById(cid+'-body');
  const emps=await API.call('listEmployees').catch(()=>[]);
  const types=await API.call('listLeaveTypes').catch(()=>[]);

  if(tab==='types'){
    body.innerHTML=tableHTML([
      {label:I18N.t('c4.leave.colType'), get:t=>`<span class="font-semibold text-slate-700">${esc(t.name)}</span>`},
      {label:I18N.t('c4.leave.colQuota'), num:1, get:t=>t.quota?I18N.t('c4.leave.daysN').replace('{n}',fmtNum(t.quota)):'—'},
      {label:I18N.t('c4.leave.colPaid'), get:t=>t.paid?badge(I18N.t('c4.common.paid'),'emerald'):badge(I18N.t('c4.common.unpaid'),'slate')},
      {label:'', get:t=>canEdit?`<div class="flex gap-1 justify-end"><button class="${btnS} !px-3 !py-1.5 !text-xs" data-te="${t.id}">${I18N.t('c4.common.edit')}</button><button class="${btnS} !px-3 !py-1.5 !text-xs !text-red-600" data-td="${t.id}">${I18N.t('c4.common.delete')}</button></div>`:''},
    ], types, {empty:I18N.t('c4.leave.emptyTypes')});
    body.querySelectorAll('[data-te]').forEach(b=>b.onclick=()=>typeEditor(types.find(t=>t.id===b.dataset.te)));
    body.querySelectorAll('[data-td]').forEach(b=>b.onclick=async()=>{
      if(!await confirmDlg(I18N.t('c4.leave.delTypeTitle'),I18N.t('c4.leave.delTypeMsg'),I18N.t('c4.common.delete'))) return;
      await API.call('deleteLeaveType',b.dataset.td); toast(I18N.t('c4.emp.deleted'),'success'); App.route();
    });
    const tb=document.getElementById(cid+'-type'); if(tb) tb.onclick=()=>typeEditor(null);
  }
  else if(tab==='balances'){
    const rows=await API.call('getLeaveBalances',new Date().getFullYear());
    body.innerHTML=tableHTML([
      {label:I18N.t('c4.common.employee'), get:r=>`<div><div class="font-medium text-slate-700">${esc(r.employeeName)}</div><div class="text-xs text-slate-400">${esc(r.employeeCode)}</div></div>`},
      ...types.map(t=>({label:t.name, get:r=>{ const x=(r.types||[]).find(y=>y.typeId===t.id)||{used:0,quota:t.quota,left:t.quota};
        return `<div class="text-center"><div class="text-sm font-semibold tabular-nums ${x.left<=2&&x.quota?'text-amber-600':'text-slate-700'}">${x.left}<span class="text-slate-400 font-normal">/${x.quota||'∞'}</span></div><div class="text-[10px] text-slate-400">${I18N.t('c4.leave.leftWord')}</div></div>`;}})),
    ], rows, {empty:I18N.t('c4.leave.emptyBalances')});
  }
  else if(tab==='holidays'){
    const rows=await API.call('listHolidays');
    body.innerHTML=tableHTML([
      {label:I18N.t('c4.common.date'), get:h=>`<span class="tabular-nums font-medium">${fmtDate(h.date)}</span>`},
      {label:I18N.t('c4.leave.colHoliday'), get:h=>`<span class="font-medium text-slate-700">${esc(h.name)}</span>`},
      {label:'', get:h=>canEdit?`<div class="flex justify-end"><button class="${btnS} !px-3 !py-1.5 !text-xs !text-red-600" data-hd="${h.id}">${I18N.t('c4.common.delete')}</button></div>`:''},
    ], rows, {empty:I18N.t('c4.leave.emptyHolidays')});
    body.querySelectorAll('[data-hd]').forEach(b=>b.onclick=async()=>{
      await API.call('deleteHoliday',b.dataset.hd); toast(I18N.t('c4.leave.holidayRemoved'),'success'); App.route();
    });
    const hb=document.getElementById(cid+'-holiday');
    if(hb) hb.onclick=()=>{
      const m=modal(I18N.t('c4.leave.addHolidayTitle'),`${field(I18N.t('c4.common.date'),'date',{type:'date',value:todayISO(),req:true})}${field(I18N.t('c4.common.name'),'name',{req:true,ph:I18N.t('c4.leave.phHoliday')})}
        <div class="flex justify-end gap-2 mt-5"><button class="${btnS}" id="hCancel">${I18N.t('c4.common.cancel')}</button><button class="${btnP}" id="hSave">${I18N.t('c4.common.save')}</button></div>`);
      m.el.querySelector('#hCancel').onclick=()=>m.close();
      m.el.querySelector('#hSave').onclick=async()=>{
        if(!formVal(m.el,'date')||!formVal(m.el,'name')){toast(I18N.t('c4.leave.dateNameRequired'),'warn');return;}
        await API.call('saveHoliday',collectForm(m.el)); m.close(); toast(I18N.t('c4.leave.holidayAdded'),'success'); App.route();
      };
    };
  }
  else{
    const rows=await API.call('listLeaveRequests');
    body.innerHTML=tableHTML([
      {label:I18N.t('c4.common.employee'), get:r=>`<span class="font-medium text-slate-700">${esc(r.employeeName)}</span>`},
      {label:I18N.t('c4.leave.colType'), get:r=>esc(r.typeName)},
      {label:I18N.t('c4.common.from'), get:r=>fmtDate(r.from)},
      {label:I18N.t('c4.common.to'), get:r=>fmtDate(r.to)},
      {label:I18N.t('c4.leave.colDays'), num:1, get:r=>fmtNum(r.days)},
      {label:I18N.t('c4.common.reason'), get:r=>`<span class="text-slate-500 text-xs">${esc(r.reason||'—')}</span>`},
      {label:I18N.t('c4.common.status'), get:r=>r.status==='pending'?badge(I18N.t('c4.common.pending'),'amber'):r.status==='approved'?badge(I18N.t('c4.common.approved'),'emerald'):badge(I18N.t('c4.common.rejected'),'red')},
      {label:'', get:r=>r.status==='pending'&&canEdit?`<div class="flex gap-1 justify-end">
        <button class="${btnS} !px-3 !py-1.5 !text-xs !text-emerald-700" data-ok="${r.id}">${I18N.t('c4.common.approve')}</button>
        <button class="${btnS} !px-3 !py-1.5 !text-xs !text-red-600" data-no="${r.id}">${I18N.t('c4.common.reject')}</button></div>`:`<span class="text-xs text-slate-400">${esc(r.decidedBy||'')}</span>`},
    ], rows, {empty:I18N.t('c4.leave.emptyRequests')});
    body.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{ await API.call('decideLeave',b.dataset.ok,'approved'); toast(I18N.t('c4.leave.leaveApproved'),'success'); App.route(); });
    body.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{ await API.call('decideLeave',b.dataset.no,'rejected'); toast(I18N.t('c4.leave.leaveRejected'),'success'); App.route(); });
  }

  function typeEditor(t){
    const isNew=!t; t=t||{name:'',quota:0,paid:true};
    const m=modal(isNew?I18N.t('c4.leave.addTypeTitle'):I18N.t('c4.leave.editTypeTitle'),`
      ${field(I18N.t('c4.leave.fTypeName'),'name',{value:t.name,req:true})}
      <div class="grid grid-cols-2 gap-4 mt-4">
        ${field(I18N.t('c4.leave.fQuota'),'quota',{value:t.quota,type:'number',min:0})}
        <div class="flex items-end pb-2.5">${field(I18N.t('c4.leave.fPaidLeave'),'paid',{type:'checkbox',value:t.paid})}</div>
      </div>
      <div class="flex justify-end gap-2 mt-6"><button class="${btnS}" id="tCancel">${I18N.t('c4.common.cancel')}</button><button class="${btnP}" id="tSave">${I18N.t('c4.common.save')}</button></div>`);
    m.el.querySelector('#tCancel').onclick=()=>m.close();
    m.el.querySelector('#tSave').onclick=async()=>{
      const data=collectForm(m.el); if(!data.name){toast(I18N.t('c4.emp.nameRequired'),'warn');return;}
      await API.call('saveLeaveType',{...(isNew?{}:{id:t.id}),...data}); m.close(); toast(I18N.t('c4.leave.typeSaved'),'success'); App.route();
    };
  }

  document.getElementById(cid+'-req').onclick=()=>{
    const m=modal(I18N.t('c4.leave.reqLeaveTitle'),`
      <div class="grid grid-cols-2 gap-4">
        ${field(I18N.t('c4.common.employee'),'employeeId',{type:'select',options:emps.filter(e=>e.active).map(e=>({value:e.id,label:e.name}))})}
        ${field(I18N.t('c4.leave.fLeaveType'),'typeId',{type:'select',options:types.map(t=>({value:t.id,label:t.name+' '+I18N.t('c4.leave.quotaYr').replace('{n}',t.quota)}))})}
        ${field(I18N.t('c4.common.from'),'from',{type:'date',value:todayISO(),req:true})}
        ${field(I18N.t('c4.common.to'),'to',{type:'date',value:todayISO(),req:true})}
        <div class="col-span-2">${field(I18N.t('c4.common.reason'),'reason',{type:'textarea',ph:I18N.t('c4.leave.phReason')})}</div>
      </div>
      <div class="flex justify-end gap-2 mt-6"><button class="${btnS}" id="lCancel">${I18N.t('c4.common.cancel')}</button><button class="${btnP}" id="lSend">${I18N.t('c4.leave.submitRequest')}</button></div>`);
    m.el.querySelector('#lCancel').onclick=()=>m.close();
    m.el.querySelector('#lSend').onclick=async()=>{
      const d=collectForm(m.el);
      if(!d.from||!d.to){toast(I18N.t('c4.leave.datesRequired'),'warn');return;}
      await API.call('requestLeave',d.employeeId,d.typeId,d.from,d.to,d.reason);
      m.close(); toast(I18N.t('c4.leave.leaveSubmitted'),'success'); App.route();
    };
  };
};
})();


/* ===== 90_overtime.js ===== */
/* 90_overtime.js — overtime request list with approve/revoke. */
(function(){

    body.innerHTML=`
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-5">
        ${statCard(I18N.t('c4.ot.kpiRequests'),fmtNum(rows.length),I18N.t('c4.ot.kpiRequestsSub'),'violet',App.ICONS.overtime,rows.length)}
        ${statCard(I18N.t('c4.ot.kpiHours'),fmtNum(totalHrs),I18N.t('c4.ot.kpiHoursSub'),'blue',App.ICONS.shifts,totalHrs)}
        ${statCard(I18N.t('c4.ot.kpiPayout'),fmt(totalAmt),I18N.t('c4.ot.kpiPayoutSub'),'emerald',App.ICONS.payroll,Math.round(totalAmt),'Rs ')}
        ${statCard(I18N.t('c4.ot.kpiPending'),fmtNum(rows.filter(r=>r.status==='pending').length),I18N.t('c4.ot.kpiPendingSub'),'amber',App.ICONS.leave,rows.filter(r=>r.status==='pending').length)}
      </div>`+tableHTML([
      {label:I18N.t('c4.common.date'), get:r=>`<span class="tabular-nums">${fmtDate(r.date)}</span>`},
      {label:I18N.t('c4.common.employee'), get:r=>`<span class="font-medium text-slate-700">${esc(r.employeeName)}</span>`},
      {label:I18N.t('c4.ot.colHours'), num:1, get:r=>`<span class="tabular-nums font-semibold">${r.hours}</span>`},
      {label:I18N.t('c4.ot.colRate'), num:1, get:r=>`<span class="tabular-nums">${I18N.t('c4.ot.perHour').replace('{s}',fmt(r.rate))}</span>`},
      {label:I18N.t('c4.ot.colAmount'), num:1, get:r=>`<span class="tabular-nums font-semibold text-slate-800">${fmt(r.amount)}</span>`},
      {label:I18N.t('c4.common.reason'), get:r=>`<span class="text-slate-500 text-xs">${esc(r.reason||'—')}</span>`},
      {label:I18N.t('c4.common.status'), get:r=>r.status==='pending'?badge(I18N.t('c4.common.pending'),'amber'):r.status==='approved'?badge(I18N.t('c4.common.approved'),'emerald'):badge(I18N.t('c4.common.rejected'),'red')},
      {label:'', get:r=>r.status==='pending'&&canEdit?`<div class="flex gap-1 justify-end">
        <button class="${btnS} !px-3 !py-1.5 !text-xs !text-emerald-700" data-ok="${r.id}">${I18N.t('c4.common.approve')}</button>
        <button class="${btnS} !px-3 !py-1.5 !text-xs !text-red-600" data-no="${r.id}">${I18N.t('c4.common.reject')}</button></div>`
        :(r.status==='approved'&&canEdit?`<div class="flex justify-end"><button class="${btnS} !px-3 !py-1.5 !text-xs" data-revoke="${r.id}">${I18N.t('c4.common.revoke')}</button></div>`:`<span class="text-xs text-slate-400">${esc(r.approvedBy||'')}</span>`)},
    ], rows, {empty:I18N.t('c4.ot.emptyOt')});
    body.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{ await API.call('decideOvertime',b.dataset.ok,'approved'); toast(I18N.t('c4.ot.otApproved'),'success'); load(); });
    body.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{ await API.call('decideOvertime',b.dataset.no,'rejected'); toast(I18N.t('c4.ot.otRejected'),'success'); load(); });
    body.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=async()=>{ await API.call('decideOvertime',b.dataset.revoke,'rejected'); toast(I18N.t('c4.ot.approvalRevoked'),'success'); load(); });
  }
  fEl.onchange=load;
  document.getElementById(cid+'-add').onclick=()=>{
    const m=modal(I18N.t('c4.ot.logOtTitle'),`
      <div class="grid grid-cols-2 gap-4">
        ${field(I18N.t('c4.common.employee'),'employeeId',{type:'select',options:emps.filter(e=>e.active).map(e=>({value:e.id,label:e.name}))})}
        ${field(I18N.t('c4.common.date'),'date',{type:'date',value:todayISO(),req:true})}
        ${field(I18N.t('c4.ot.fHours'),'hours',{type:'number',value:2,min:0.5,step:0.5,req:true})}
        ${field(I18N.t('c4.ot.fRate'),'rate',{type:'number',value:250,min:0,req:true})}
        <div class="col-span-2">${field(I18N.t('c4.common.reason'),'reason',{type:'textarea',ph:I18N.t('c4.ot.phOtReason')})}</div>
      </div>
      <div class="flex justify-end gap-2 mt-6"><button class="${btnS}" id="oCancel">${I18N.t('c4.common.cancel')}</button><button class="${btnP}" id="oSave">${I18N.t('c4.common.save')}</button></div>`);
    m.el.querySelector('#oCancel').onclick=()=>m.close();
    m.el.querySelector('#oSave').onclick=async()=>{
      const d=collectForm(m.el);
      await API.call('requestOvertime',d.employeeId,d.date,d.hours,d.rate,d.reason);
      m.close(); toast(I18N.t('c4.ot.otLogged'),'success'); load();
    };
  };
  await load();
};
})();

</script>
</body></html>
