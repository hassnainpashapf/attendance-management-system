/* ---------------- pure matching math (exposed for QA) ---------------- */
var FACE_THRESHOLD = 0.6;
var MAX_SAMPLES = 3;

function euclid(a, b){
  if (!Array.isArray(a) || !Array.isArray(b) || !a.length || a.length !== b.length) return null;
  var s = 0;
  for (var i = 0; i < a.length; i++){
    var x = a[i], y = b[i];
    if (typeof x !== 'number' || typeof y !== 'number' || !isFinite(x) || !isFinite(y)) return null;
    var d = x - y; s += d * d;
  }
  return Math.sqrt(s);
}
function averageDescriptors(samples){
  if (!Array.isArray(samples) || !samples.length) return null;
  var n = -1, acc = null, count = 0;
  for (var k = 0; k < samples.length; k++){
    var s = samples[k];
    if (!Array.isArray(s) || !s.length) continue;
    if (n < 0){ n = s.length; acc = new Array(n).fill(0); }
    if (s.length !== n) continue;
    var ok = true;
    for (var i = 0; i < n; i++){
      var v = s[i];
      if (typeof v !== 'number' || !isFinite(v)){ ok = false; break; }
      acc[i] += v;
    }
    if (ok) count++;
  }
  if (!count) return null;
  return acc.map(function(v){ return v / count; });
}
function matchScore(dist){
  if (dist === null || dist === undefined || !isFinite(dist)) return null;
  return Math.max(0, Math.min(1, 1 - dist));
}
function verifyFace(live, enrolled, threshold){
  threshold = (threshold === undefined) ? FACE_THRESHOLD : threshold;
  var dist = euclid(live, enrolled);
  if (dist === null) return { faceVerified: null, matchScore: null, distance: null };
  return { faceVerified: dist <= threshold, matchScore: matchScore(dist), distance: dist };
}
function validDescriptor(d){
  return Array.isArray(d) && d.length === 128 &&
    d.every(function(v){ return typeof v === 'number' && isFinite(v); });
}
/* Backward-compatible punch payload extension: empty object when no check ran */
function buildFacePunchFields(v){
  if (!v || v.faceVerified === null || v.faceVerified === undefined) return {};
  return { faceVerified: !!v.faceVerified, matchScore: v.matchScore };
}

window.T1Face = { FACE_THRESHOLD: FACE_THRESHOLD, MAX_SAMPLES: MAX_SAMPLES,
  euclid: euclid, averageDescriptors: averageDescriptors, matchScore: matchScore,
  verifyFace: verifyFace, validDescriptor: validDescriptor,
  buildFacePunchFields: buildFacePunchFields };

/* ---------------- face-api.js lazy loader ---------------- */
var FACE_LIB_URL = 'https:' + '//cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js';
var FACE_MODEL_URL = 'https:' + '//cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
var _libPromise = null;

function loadScriptOnce(src){
  return new Promise(function(resolve, reject){
    var s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = function(){ resolve(); };
    s.onerror = function(){ reject(new Error('Face library failed to load')); };
    document.head.appendChild(s);
  });
}
function ensureFaceLib(){
  if (window.faceapi && window.faceapi.nets && window.faceapi.nets.tinyFaceDetector &&
      window.faceapi.nets.tinyFaceDetector.isLoaded) return Promise.resolve(window.faceapi);
  if (_libPromise) return _libPromise;
  _libPromise = loadScriptOnce(FACE_LIB_URL).then(function(){
    var fa = window.faceapi;
    if (!fa) throw new Error('Face library failed to load');
    return Promise.all([
      fa.nets.tinyFaceDetector.loadFromUri(FACE_MODEL_URL),
      fa.nets.faceLandmark68Net.loadFromUri(FACE_MODEL_URL),
      fa.nets.faceRecognitionNet.loadFromUri(FACE_MODEL_URL)
    ]).then(function(){ return fa; });
  });
  return _libPromise;
}
function descriptorFromVideo(video){
  return ensureFaceLib().then(function(fa){
    return fa.detectSingleFace(video, new fa.TinyFaceDetectorOptions())
      .withFaceLandmarks().withFaceDescriptor();
  }).then(function(det){
    return det ? Array.from(det.descriptor) : null;
  });
}

/* ---------------- punch-time hook (DOM/API interception, no edits to 30_punch.js) ---------------- */
function liveVideoEl(){
  var vids = document.querySelectorAll('video');
  for (var i = 0; i < vids.length; i++){
    var v = vids[i];
    /* Only a genuinely live camera feed counts: this also keeps offline queue
       syncs (no live video at sync time) on the plain punch path. */
    if (v.srcObject && v.videoWidth > 0 && !v.paused) return v;
  }
  return null;
}
function announceFaceResult(v){
  var label = v.faceVerified ? I18N.t('t1.verified') : I18N.t('t1.notVerified');
  var pct = (v.matchScore === null) ? '' : ' · ' + Math.round(v.matchScore * 100) + '%';
  toast(esc(label) + pct, v.faceVerified ? 'success' : 'warn');
  try {
    var hosts = document.querySelectorAll('[id$="-msg"]');
    for (var i = 0; i < hosts.length; i++){
      var d = document.createElement('div');
      d.className = 'mt-2 text-sm rounded-xl px-4 py-2.5 border ' +
        (v.faceVerified ? 'text-emerald-700 bg-emerald-50 border-emerald-200/70'
                        : 'text-red-700 bg-red-50 border-red-200/70');
      d.textContent = label + pct;
      hosts[i].insertBefore(d, hosts[i].firstChild);
    }
  } catch (e) { /* never break the punch page */ }
}
async function punchWithFaceCheck(origCall, args){
  var employeeId = args[0];
  try {
    var video = liveVideoEl();
    if (!video) return origCall.apply(window.API, ['punch'].concat(args));
    var enr = null;
    try { enr = await window.API.call('getFaceEnrollment', employeeId); }
    catch (e) { enr = null; }
    if (!enr || !enr.enrolled || !validDescriptor(enr.descriptor)){
      toast(I18N.t('t1.noEnroll'), 'info');
      return origCall.apply(window.API, ['punch'].concat(args));
    }
    var live = await descriptorFromVideo(video);
    var v = verifyFace(live, enr.descriptor, FACE_THRESHOLD);
    if (v.faceVerified === null){
      toast(I18N.t('t1.needFace'), 'warn');
      return origCall.apply(window.API, ['punch'].concat(args));
    }
    var r = await origCall('punchWithFace', args[0], args[1], args[2], args[3],
                           args[4], args[5], args[6], v.faceVerified, v.matchScore);
    announceFaceResult(v);
    return r;
  } catch (e) {
    /* Any face failure must never block attendance */
    return origCall.apply(window.API, ['punch'].concat(args));
  }
}
(function installPunchHook(){
  if (typeof API === 'undefined' || !API || API.__t1wrapped) return;
  API.__t1wrapped = true;
  var origCall = API.call.bind(API);
  API.call = function(fn){
    var args = Array.prototype.slice.call(arguments, 1);
    if (fn !== 'punch') return origCall.apply(API, [fn].concat(args));
    return punchWithFaceCheck(origCall, args);
  };
})();

        '<div id="' + cid + '-status"></div>' +
        '<div class="text-xs text-slate-400 mt-2">' + esc(I18N.t('t1.reenrollHint')) + '</div>' +
      '</div>' +
      '<div class="bg-white rounded-2xl border border-slate-200/70 shadow-[0_1px_3px_rgba(15,23,42,.04)] p-6 anim-fadeUp">' +

        '<div class="rounded-2xl overflow-hidden bg-slate-900 aspect-[4/3] relative mb-4">' +
          '<video id="' + cid + '-vid" class="w-full h-full object-cover" autoplay playsinline muted></video>' +
          '<canvas id="' + cid + '-cap" class="hidden"></canvas>' +

        '<div class="flex gap-2">' +
          '<button id="' + cid + '-save" class="' + btnP + ' flex-1" disabled>' + esc(I18N.t('t1.saveEnrollment')) + '</button>' +
          '<button id="' + cid + '-reset" class="' + btnD + '">' + esc(I18N.t('t1.reset')) + '</button>' +
        '</div>' +
        '<div id="' + cid + '-msg" class="mt-4"></div>' +
      '</div>' +
    '</div>';

    var $ = function(id){ return document.getElementById(cid + '-' + id); };
    var state = { empId: '', stream: null, samples: [], libReady: false };
    var vid = $('vid'), cap = $('cap');

    /* face-api loads in the background; enrollment needs it, punch works without */
    ensureFaceLib().then(function(){
      state.libReady = true;
      $('libmsg').textContent = '';
    }).catch(function(){
      $('libmsg').textContent = I18N.t('t1.libFailed');
    });

    function refreshStatus(){
      var box = $('status');
      if (!state.empId){ box.innerHTML = ''; return; }
      box.innerHTML = '<div class="text-sm text-slate-400">…</div>';
      API.call('getFaceEnrollment', state.empId).then(function(enr){

        } else {

              esc(I18N.t('t1.notEnrolled')) + '</div>';
        }
      }).catch(function(){ box.innerHTML = ''; });
    }
    function refreshSamples(){
      var box = $('samples');
      var list = state.samples.length ? ' <span class="text-slate-400">(' + state.samples.map(function(_, i){
            return esc(I18N.t('t1.sampleN')) + ' ' + (i + 1);

      box.innerHTML = '<span class="inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-full ' +
        (state.samples.length ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500') + '">' +
        esc(I18N.t('t1.samples')) + ': ' + state.samples.length + ' / ' + MAX_SAMPLES + '</span>' + list;
      $('save').disabled = !(state.empId && state.samples.length);
    }

    var empSel = document.querySelector('[name="faceEmp"]');
    if (empSel) empSel.addEventListener('change', function(){
      state.empId = empSel.value; state.samples = [];
      refreshStatus(); refreshSamples();
    });

    $('camon').onclick = async function(){
      try {
        var stream = await navigator.mediaDevices.getUserMedia(
          { video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });

        $('snap').disabled = false; $('camon').disabled = true;
        $('camon').textContent = I18N.t('t1.cameraOn');
      } catch (e){
        var nv = $('novideo'); nv.textContent = String(e.message || e); nv.style.display = 'flex';

      if (!state.stream) return;
      if (state.samples.length >= MAX_SAMPLES){ toast(I18N.t('t1.maxSamples'), 'warn'); return; }
      $('snap').disabled = true;
      try {
        if (!state.libReady) await ensureFaceLib();
        var vw = vid.videoWidth || 640, vh = vid.videoHeight || 480;
        var scale = Math.min(1, 320 / Math.max(vw, vh));
        cap.width = Math.round(vw * scale); cap.height = Math.round(vh * scale);
        cap.getContext('2d').drawImage(vid, 0, 0, cap.width, cap.height);
        var d = await descriptorFromVideo(cap);
        if (!d || !validDescriptor(d)){ toast(I18N.t('t1.needFace'), 'warn'); return; }
        state.samples.push(d);
        toast(I18N.t('t1.sampleN') + ' ' + state.samples.length + ' / ' + MAX_SAMPLES, 'success');
      } catch (e){
        toast(I18N.t('t1.libFailed'), 'warn');
      } finally {
        refreshSamples();
        $('snap').disabled = false;
      }
    };
    $('save').onclick = async function(){
      var msg = $('msg');
      if (!state.empId || !state.samples.length){ msg.innerHTML = ''; return; }
      var avg = T1Face.averageDescriptors(state.samples);
      if (!validDescriptor(avg)){
        msg.innerHTML = '<div class="text-sm text-red-600">' + esc(I18N.t('t1.minSamples')) + '</div>';
        return;
      }
      $('save').disabled = true; $('save').textContent = I18N.t('t1.saving');
      try {
        await API.call('enrollFace', state.empId, avg);
        state.samples = [];
        msg.innerHTML = '<div class="text-sm text-emerald-700 bg-emerald-50 border border-emerald-200/70 rounded-xl px-4 py-3">' +
          esc(I18N.t('t1.saved')) + '</div>';
        toast(I18N.t('t1.saved'), 'success');
        refreshStatus();
      } catch (e){
        msg.innerHTML = '<div class="text-sm text-red-600 bg-red-50 border border-red-200/70 rounded-xl px-4 py-3">' +

        refreshSamples();

      }

      try {
        await API.call('resetFaceEnrollment', state.empId);

        refreshStatus();
      } catch (e){ toast(esc(e.message || e), 'error'); }
    };
    refreshSamples();
  };
}

function t2Avatar(name){
  const init=(String(name||'?').trim().split(/\s+/).map(w=>w[0]).join('')||'?').slice(0,2).toUpperCase();
  return `<span class="w-8 h-8 rounded-full bg-slate-200 text-slate-500 text-[11px] font-bold inline-flex items-center justify-center shrink-0">${esc(init)}</span>`;
}
function t2EmpCell(name, code){
  return `<div class="flex items-center gap-2.5">${t2Avatar(name)}<div class="min-w-0"><div class="font-medium text-slate-700 truncate">${esc(name)}</div><div class="text-xs text-slate-400">${esc(code||'')}</div></div></div>`;
}

const T2_ICO_GEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-4 h-4"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 7.5h7M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 15.5h.01M12 15.5h.01M15.5 15.5h.01M8.5 19h7"/></svg>';

function t2CardHead(ico, title, sub, action){
  return `<div class="flex items-center gap-3 mb-5">
    <span class="w-10 h-10 rounded-xl bg-slate-100 text-slate-500 flex items-center justify-center shrink-0">${ico}</span>
    <div class="min-w-0 flex-1"><h3 class="font-bold text-slate-800 leading-tight">${title}</h3>
    ${sub?`<p class="text-xs text-slate-400 mt-0.5">${sub}</p>`:''}</div>
    ${action||''}
  </div>`;
}

function t2AllowSum(s){
  let t = 0;
  const d = s.allowancesDetail || {};
  Object.keys(d).forEach(k => { t += Number(d[k]) || 0; });
  return t;
}

    const { emps, canEdit } = ctx;
    const cid = uid('sal');
    el.innerHTML = `
      <div class="bg-white rounded-2xl border border-slate-200/70 shadow-[0_1px_3px_rgba(15,23,42,.04)] p-6 mb-5">
        ${t2CardHead(T2_ICO_USERS, t2t('salaryStructures'), t2t('structuresSub'),
          canEdit ? `<button class="${btnS} shrink-0" id="${cid}-add">+ ${t2t('addStructure')}</button>` : '')}
        <div id="${cid}-structs"></div>
      </div>
      ${perm('settings','manage') ? `
      <div class="bg-white rounded-2xl border border-slate-200/70 shadow-[0_1px_3px_rgba(15,23,42,.04)] p-6 mb-5">
        ${t2CardHead(T2_ICO_RULES, t2t('salaryRules'), t2t('salaryRulesSub'))}

        ${t2CardHead(T2_ICO_GEN, t2t('generateTitle'), t2t('generateSub'))}

          ${field(t2t('payrollMonth'), 'genMonth', { type: 'month', value: monthISO() })}

        <div id="${cid}-genResult" class="mt-5"></div>

        <div id="${cid}-runs"></div>
      </div>`;

    const loadStructs = async () => {
      const box = document.getElementById(cid + '-structs');
      const rows = await API.call('listSalaryStructures').catch(() => []);
      box.innerHTML = tableHTML([
        { label: t2t('employee'), get: s => t2EmpCell(s.employeeName, s.employeeCode) },
        { label: t2t('basic'), num: 1, get: s => `<span class="tabular-nums">${fmt(s.basic)}</span>` },
        { label: t2t('allowances'), num: 1, get: s => `<span class="tabular-nums text-emerald-600">+ ${fmt(t2AllowSum(s))}</span>` },
        { label: t2t('effectiveFrom'), get: s => `<span class="text-xs text-slate-500">${fmtDate(s.effectiveFrom)}</span>` },
        { label: '', get: s => canEdit ? `<div class="flex justify-end"><button class="${btnS} !px-3 !py-1.5 !text-xs" data-sedit="${s.id}">${t2t('edit')}</button></div>` : '' },
      ], rows, { empty: t2t('structuresEmpty') });
      box.querySelectorAll('[data-sedit]').forEach(b => b.onclick = () =>
        SalaryUI.structureEditor(rows.find(x => x.id === b.dataset.sedit), emps, loadStructs));
    };

    const loadRules = async () => {
      const box = document.getElementById(cid + '-rules');
      if(!box) return;
      const s = await API.call('getSettings').catch(() => ({}));
      const R = [
        ['absentDeductionPerDay', t2t('absentDeductionPerDay'), s.absentDeductionPerDay || '30'],
        ['lateGraceMinutes', t2t('lateGraceMinutes'), s.lateGraceMinutes || '15'],
        ['latePenaltyMinutes', t2t('latePenaltyMinutes'), s.latePenaltyMinutes || '60'],
        ['overtimeRateMultiplier', t2t('overtimeRateMultiplier'), s.overtimeRateMultiplier || '1.5'],
        ['salaryWorkHoursPerDay', t2t('workHoursPerDay'), s.salaryWorkHoursPerDay || '8'],
      ];
      box.innerHTML = R.map(([k, l, v]) => field(l, k, { type: 'number', value: v, min: 0, step: k === 'overtimeRateMultiplier' ? '0.1' : '1' })).join('');
      document.getElementById(cid + '-saveRules').onclick = async () => {
        const d = collectForm(box);
        await API.call('saveSettings', d);
        toast(t2t('rulesSaved'), 'success');
      };
    };

    const loadRuns = async () => {
      const box = document.getElementById(cid + '-runs');
      const runs = (await API.call('listPayrollRuns').catch(() => [])).filter(r => (r.runType || 'manual') === 'salary');
      box.innerHTML = tableHTML([
        { label: t2t('month'), get: r => `<span class="font-semibold tabular-nums">${esc(r.month)}</span>` },
        { label: t2t('created'), get: r => `<span class="text-xs text-slate-500">${esc(r.createdAt)}</span>` },
        { label: t2t('payslips'), num: 1, get: r => fmtNum(r.slipCount) },
        { label: t2t('totalNet'), num: 1, get: r => `<span class="tabular-nums font-semibold">${fmt(r.totalNet)}</span>` },
        { label: t2t('status'), get: r => badge(r.status === 'finalized' ? 'Finalized' : 'Draft', r.status === 'finalized' ? 'teal' : 'slate') },
        { label: '', get: r => `<div class="flex justify-end"><button class="${btnS} !px-3 !py-1.5 !text-xs" data-vrun="${r.id}">${t2t('viewPayslips')}</button></div>` },
      ], runs, { empty: t2t('runsEmpty') });
      box.querySelectorAll('[data-vrun]').forEach(b => b.onclick = () => SalaryUI.viewSalaryRun(b.dataset.vrun, canEdit));
    };

    const addB = document.getElementById(cid + '-add');
    if(addB) addB.onclick = () => SalaryUI.structureEditor(null, emps, loadStructs);

    const genB = document.getElementById(cid + '-gen');
    if(genB) genB.onclick = async () => {
      const m = formVal(el, 'genMonth');
      if(!m){ toast(t2t('invalidMonth'), 'warn'); return; }
      genB.disabled = true; genB.textContent = t2t('generating');
      try{
        const r = await API.call('generateMonthlySalaries', m);
        const box = document.getElementById(cid + '-genResult');
        box.innerHTML = `
          <h4 class="font-bold text-slate-700 text-sm mb-2">${t2t('results')} — <span class="tabular-nums">${esc(r.month)}</span>
            <span class="text-emerald-600 ml-2">${r.generated.length} ${t2t('generatedOk')}</span>
            ${r.skipped.length ? `<span class="text-amber-600 ml-2">${t2t('skipped')}: ${r.skipped.length}</span>` : ''}</h4>` +
          tableHTML([
            { label: t2t('employee'), get: g => t2EmpCell(g.employeeName, g.employeeCode) },
            { label: t2t('present'), num: 1, get: g => fmtNum(g.daysPresent) },
            { label: t2t('absent'), num: 1, get: g => fmtNum(g.daysAbsent) },
            { label: t2t('lateArrivals'), num: 1, get: g => fmtNum(g.lateCount) },
            { label: t2t('overtimeHours'), num: 1, get: g => fmtNum(g.overtimeHours) },
            { label: t2t('net'), num: 1, get: g => `<span class="tabular-nums font-bold text-teal-700">${fmt(g.net)}</span>` },
          ], r.generated, { empty: t2t('slipsEmpty') }) +
          (r.skipped.length ? `<h4 class="font-bold text-amber-700 text-sm mt-4 mb-2">${t2t('skipped')}</h4>` +
            tableHTML([
              { label: t2t('employee'), get: g => `<span class="font-medium text-slate-700">${esc(g.employeeName)}</span>` },
              { label: 'Reason', get: g => `<span class="text-xs text-amber-700">${esc(g.reason)}</span>` },

        toast(r.generated.length + ' ' + t2t('generatedOk'), 'success');
        loadRuns();
      }catch(e){ toast(e.message, 'error'); }
      genB.disabled = false; genB.textContent = t2t('generate');
    };

    await loadStructs(); await loadRules(); await loadRuns();
  },

  structureEditor(s, emps, onDone){
    const isNew = !s; s = s || { employeeId: '', basic: '', allowancesJson: '', effectiveFrom: todayISO(), payFrequency: 'monthly' };
    const m = modal(isNew ? t2t('addStructure') : t2t('editStructure'), `
      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-2">${field(t2t('employee'), 'employeeId', { type: 'select', value: s.employeeId, req: true,
          options: emps.filter(e => e.active).map(e => ({ value: e.id, label: e.name + ' (' + e.code + ')' })) })}</div>
        ${field(t2t('basicPay'), 'basic', { type: 'number', value: s.basic, min: 1, req: true })}
        ${field(t2t('effectiveFrom'), 'effectiveFrom', { type: 'date', value: s.effectiveFrom || todayISO(), req: true })}
        <div class="col-span-2">${field(t2t('allowancesJson'), 'allowancesJson', { type: 'textarea', value: s.allowancesJson || '', ph: t2t('allowancesJsonPh') })}</div>
        ${field(t2t('payFrequency'), 'payFrequency', { type: 'select', value: s.payFrequency || 'monthly',
          options: [{ value: 'monthly', label: t2t('monthly') }] })}
      </div>
      <div class="flex justify-end gap-2 mt-6"><button class="${btnS}" id="sCancel">${t2t('cancel')}</button><button class="${btnP}" id="sSave">${t2t('save')}</button></div>`);
    m.el.querySelector('#sCancel').onclick = () => m.close();
    m.el.querySelector('#sSave').onclick = async () => {
      const d = collectForm(m.el);
      if(!d.employeeId || !Number(d.basic)){ toast(t2t('fillRequired'), 'warn'); return; }
      try{
        if((d.allowancesJson || '').trim()) JSON.parse(d.allowancesJson);
      }catch(e){ toast('Allowances JSON: ' + e.message, 'error'); return; }
      await API.call('saveSalaryStructure', { ...(isNew ? {} : { id: s.id }), ...d });
      m.close(); toast(t2t('structureSaved'), 'success'); onDone && onDone();
    };
  },

  async viewSalaryRun(runId, canEdit){
    const slips = await API.call('listPayslips', runId);
    const m = modal(t2t('salaryRuns') + ' — ' + (slips[0] ? slips[0].month : ''), `<div id="t2slips"></div>`, { wide: true });
    const box = m.el.querySelector('#t2slips');
    box.innerHTML = tableHTML([
      { label: t2t('employee'), get: p => t2EmpCell(p.employeeName, p.employeeCode) },
      { label: t2t('basic'), num: 1, get: p => `<span class="tabular-nums">${fmt(p.salary)}</span>` },
      { label: t2t('allowances'), num: 1, get: p => `<span class="tabular-nums text-emerald-600">+${fmt(p.allowances)}</span>` },
      { label: t2t('deductions'), num: 1, get: p => `<span class="tabular-nums text-red-500">−${fmt(p.deductions)}</span>` },
      { label: t2t('netPay'), num: 1, get: p => `<span class="tabular-nums font-bold">${fmt(p.net)}</span>` },
      { label: '', get: p => `<div class="flex justify-end"><button class="${btnS} !px-3 !py-1.5 !text-xs" data-slip="${p.employeeId}">${t2t('payslip')}</button></div>` },
    ], slips, { empty: t2t('slipsEmpty') });
    box.querySelectorAll('[data-slip]').forEach(b => b.onclick = async () => {
      const d = await API.call('getSalaryPayslip', runId, b.dataset.slip);
      SalaryUI.payslipModal(d);
    });
  },

  payslipModal(d){
    const b = d.breakdown || {};
    const allowRows = Object.keys(b.allowancesDetail || {}).map(k =>
      `<tr><td class="py-1.5 text-slate-500 pl-4">· ${esc(k)}</td><td class="py-1.5 text-right tabular-nums">${fmt(b.allowancesDetail[k])}</td></tr>`).join('');
    const attRows = [
      [t2t('workDays'), b.workDays], [t2t('present'), b.daysPresent], [t2t('absent'), b.daysAbsent],

        const args = Array.prototype.slice.call(arguments, 1);
        const r = await orig.apply(null, [fn].concat(args));
        try{
          if(!SKIP[fn]){
            if(fn==='punch' && r && r.punch) orig('runAlertChecks', args[0]).catch(function(){});
            else if(fn==='devicePunch' && r && r.punch) orig('runAlertChecks', args[1]).catch(function(){});
            else if(fn==='decideLeave') orig('alertLeaveDecision', args[0]).catch(function(){});
          }
        }catch(e){}
        return r;
      };
      wrapped.__t3 = true;
      window.API.call = wrapped;
      return true;
    };
    if(!apply()){
      const iv = setInterval(()=>{ if(apply()) clearInterval(iv); }, 300);
      setTimeout(()=>clearInterval(iv), 10000);
    }
  }
};

     call in mock mode or offline: failures keep the last known values. */
  async refresh(employeeId){
    const eid = employeeId || T5.myEmployeeId();
    if(!eid) return T5.cache;
    try{
      const g = await API.call('getAutoPunch', eid);
      if(g) T5.cache.autoPunch = !!g.autoPunch;
    }catch(e){}

function injectToggle(){
  try{
    if(!Session.user) return false;
    if(document.getElementById('t5-auto-card')) return true;
    /* punch page marker: 30_punch.js renders a "<cid>-msg" div */
    const msg = document.querySelector('[id$="-msg"]');
    if(!msg) return false;
    const grid = msg.closest('.grid');
    if(!grid || !grid.parentNode) return false;
    const eid = T5.myEmployeeId();
    if(!eid) return false;
    grid.insertAdjacentHTML('afterend', t5CardHTML(true));
    const tgl = document.getElementById('t5-auto-toggle');
    const status = document.getElementById('t5-auto-status');
    if(!tgl || !status) return false;
    const paint = on=>{
      tgl.checked = !!on;
      status.textContent = I18N.t(on ? 't5.isOn' : 't5.isOff');
      status.className = 'mt-3 inline-flex items-center gap-1.5 text-[11px] font-medium rounded-full px-2.5 py-1 ' +
        (on ? 'text-emerald-700 bg-emerald-50 ring-1 ring-emerald-200/60' : 'text-slate-400 bg-slate-100');
    };
    /* load the real toggle state + warm the bridge cache */
    T5.refresh(eid).then(()=>paint(T5.cache.autoPunch)).catch(()=>{});
    tgl.addEventListener('change', async ()=>{
      tgl.disabled = true;
      try{
        const r = await API.call('setAutoPunch', eid, tgl.checked);
        T5.cache.autoPunch = !!(r && r.autoPunch);
        paint(T5.cache.autoPunch);
        toast(I18N.t('t5.saved'), 'success');
      }catch(e){
        paint(!tgl.checked);
        toast((e && e.message) || I18N.t('t5.saveFail'), 'error');
      }
      tgl.disabled = false;
    });
    return true;
  }catch(e){ return false; }
}

/* Hook the punch route lazily: the route renders asynchronously, so retry
   until the marker appears (or give up quietly). */
let t5Timer = null;
function maybeHookT5(){
  if((location.hash || '') !== '#/punch') return;
  let tries = 0;
  if(t5Timer) clearInterval(t5Timer);
  t5Timer = setInterval(()=>{
    tries++;
    let done = false;
    try{ done = injectToggle(); }catch(e){ done = false; }
    if(done || tries > 24) clearInterval(t5Timer);
  }, 250);
}
window.addEventListener('hashchange', maybeHookT5);
maybeHookT5();
})();

  const vHover={id:'vHoverLine',afterDraw(ch){try{const a=ch.tooltip;if(!a||!a.getActiveElements)return;const ae=a.getActiveElements();if(!ae.length)return;const x=ae[0].element.x;const g=ch.ctx;g.save();g.setLineDash([5,5]);g.strokeStyle='#cbd5e1';g.lineWidth=1;g.beginPath();g.moveTo(x,ch.scales.y.top);g.lineTo(x,ch.scales.y.bottom);g.stroke();g.restore();}catch(e){}}};
  c._chart=new Chart(c,{
    type:'line',plugins:[vHover],
    data:{labels:pts.map(p=>fmtDate(p.d).replace(/^0/,'')), datasets:[{
      label:I18N.t('c4.dash.chartPresent'), data:pts.map(p=>Number(p.present)||0),

}

/* 30_punch.js — Check-In / Check-Out with selfie capture, GPS, site geofence
   matching, offline queue with auto-sync, client-side duplicate guard.
   Verola premium styling. */
(function(){
'use strict';

App.nav.push({group:'MAIN', path:'#/punch', label:I18N.t('c4.nav.punch'), labelKey:'c4.nav.punch', icon:'punch', perm:'punch'});

/* Verola tokens (local) */
const vCard='bg-white rounded-2xl border border-slate-200/70 shadow-[0_1px_3px_rgba(15,23,42,.04)] p-6 anim-fadeUp';
function vHead(title, actions){
  return `<div class="flex flex-wrap items-center justify-between gap-3 mb-5 anim-fadeUp"><div><h1 class="font-display text-[26px] font-bold text-slate-900 tracking-tight">${title}</h1><p class="text-sm text-slate-400 mt-1">${I18N.t('c4.punch.sub')}</p></div><div class="flex gap-2 flex-wrap items-center">${actions||''}</div></div>`;
}

const QKEY='ams_queue', LKEY='ams_lastpunch';

function getQueue(){ try{return JSON.parse(localStorage.getItem(QKEY)||'[]');}catch(e){return [];} }
function setQueue(q){ localStorage.setItem(QKEY,JSON.stringify(q)); }
function getLastPunch(){ try{return JSON.parse(localStorage.getItem(LKEY)||'null');}catch(e){return null;} }
function setLastPunch(o){ localStorage.setItem(LKEY,JSON.stringify(o)); }

async function syncQueue(statusEl){
  const q=getQueue();
  if(!q.length){ if(statusEl) statusEl.innerHTML=''; return; }
  if(!navigator.onLine){ if(statusEl) statusEl.innerHTML=badge(I18N.t('c4.punch.offlineQueued').replace('{n}',q.length),'amber'); return; }
  let ok=0, fail=0;
  for(const item of q){
    try{
      await API.call('punch', item.employeeId, item.type, item.lat, item.lng, item.selfie, item.deviceId, 'gps');
      ok++;
    }catch(e){ fail++; }
  }
  setQueue(fail? q.slice(ok) : []);
  if(statusEl) statusEl.innerHTML = fail
    ? badge(I18N.t('c4.punch.stillQueued').replace('{n}',fail),'amber')
    : `<span class="text-emerald-600 text-sm font-medium">${I18N.t('c4.punch.syncedN').replace('{n}',ok)}</span>`;
  toast(I18N.t('c4.punch.syncedN').replace('{n}',ok), ok?'success':'warn');
}

  const u=Session.user||{};

}

        </div>
        <div class="rounded-xl bg-slate-50 border border-slate-200/60 p-3">
          <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1">${I18N.t('c4.punch.fLongitude')}</div>
          <div id="${cid}-lng" class="font-mono text-sm text-slate-700">—</div>
        </div>
      </div>
      <div id="${cid}-siteinfo" class="mb-4"></div>
      <div id="${cid}-map" class="h-52 rounded-xl border border-slate-200/70 overflow-hidden"></div>
    </div>
    <div class="${vCard}">
      <div class="flex items-center gap-2.5 mb-4">
        <span class="w-9 h-9 rounded-xl bg-slate-100 text-slate-500 flex items-center justify-center shrink-0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-4 h-4"><path d="M4 8h3l2 8 3-14 3 10 2-4h3"/></svg>
        </span>
        <h3 class="font-bold text-slate-800 text-[15px]">${I18N.t('c4.punch.step2')}</h3>
      </div>
      <div class="rounded-2xl overflow-hidden bg-slate-900 aspect-[4/3] relative mb-4">
        <video id="${cid}-vid" class="w-full h-full object-cover" autoplay playsinline muted></video>
        <canvas id="${cid}-cap" class="hidden"></canvas>
        <div id="${cid}-novideo" class="absolute inset-0 hidden items-center justify-center text-slate-400 text-sm text-center p-6">${I18N.t('c4.punch.camUnavailable')}</div>
      </div>
      <div class="flex gap-2 mb-5">
        <button id="${cid}-camon" class="${btnS} flex-1">${I18N.t('c4.punch.enableCam')}</button>
        <button id="${cid}-snap" class="${btnS} flex-1" disabled>${I18N.t('c4.punch.captureSelfie')}</button>
      </div>
      <div id="${cid}-shot" class="hidden mb-5 flex items-center gap-3 p-3 rounded-2xl bg-emerald-50/60 border border-emerald-200/60">
        <img id="${cid}-shotimg" class="w-16 h-16 rounded-xl object-cover border border-slate-200" alt="selfie">
        <div class="text-sm"><div class="font-semibold text-emerald-600">${I18N.t('c4.punch.selfieCaptured')}</div><div class="text-slate-400 text-xs">${I18N.t('c4.punch.selfieCompressed')}</div></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <button id="${cid}-in" class="py-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-lg shadow active:scale-[.98] transition disabled:opacity-50">${I18N.t('c4.punch.checkInBtn')}</button>
        <button id="${cid}-out" class="py-4 rounded-xl bg-white border border-slate-200 hover:border-slate-300 hover:bg-slate-50 text-slate-700 font-bold text-lg shadow-sm active:scale-[.98] transition disabled:opacity-50">${I18N.t('c4.punch.checkOutBtn')}</button>
      </div>
      <div id="${cid}-msg" class="mt-4"></div>
    </div>
  </div>`;

  const $=id=>document.getElementById(cid+'-'+id);
  const state={lat:null,lng:null,selfie:null,stream:null,sites:[],empId:me||''};

  /* load sites + map */
  try{
    state.sites=await API.call('listSites');
    const map=buildMap($('map'),[31.5,74.35],11);
    state.sites.filter(s=>s.active).forEach(s=>{
      L.circle([Number(s.lat),Number(s.lng)],{radius:Number(s.radiusM)||150,color:'#0ea5e9',weight:1.5,fillOpacity:.07}).addTo(map)
        .bindPopup(`<b>${esc(s.name)}</b><br>${I18N.t('c4.common.geofenceN').replace('{n}',fmtNum(s.radiusM))}`);
    });
    state.map=map; state.marker=null;
    setTimeout(()=>map.invalidateSize(),150);
  }catch(e){}

  function updateSiteInfo(){
    if(state.lat==null){ $('siteinfo').innerHTML=''; return; }
    let best=null,bestD=Infinity;
    (state.sites||[]).filter(s=>s.active).forEach(s=>{
      const d=haversineM(state.lat,state.lng,Number(s.lat),Number(s.lng));
      if(d!=null&&d<bestD){bestD=d;best=s;}
    });
    if(!best){ $('siteinfo').innerHTML=''; return; }
    const ooz=bestD>Number(best.radiusM||150);
    $('siteinfo').innerHTML=`
      <div class="rounded-xl border p-3.5 flex items-center gap-3 ${ooz?'border-red-200 bg-red-50/60':'border-emerald-200 bg-emerald-50/60'}">
        <div class="w-9 h-9 rounded-xl ${ooz?'bg-red-100 text-red-500':'bg-emerald-100 text-emerald-600'} flex items-center justify-center shrink-0">${App.ICONS.sites}</div>
        <div class="min-w-0"><div class="text-sm font-semibold ${ooz?'text-red-700':'text-emerald-800'}">${esc(best.name)}</div>
        <div class="text-xs ${ooz?'text-red-500':'text-emerald-600'}">${I18N.t('c4.punch.mAway').replace('{n}',fmtNum(Math.round(bestD)))} · ${ooz?I18N.t('c4.punch.oozFlag'):I18N.t('c4.punch.insideGeofence')}</div></div>
      </div>`;
  }

  /* geolocation */
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      state.lat=pos.coords.latitude; state.lng=pos.coords.longitude;
      $('lat').textContent=state.lat.toFixed(6); $('lng').textContent=state.lng.toFixed(6);
      updateSiteInfo();
      if(state.map){
        state.map.setView([state.lat,state.lng],15);
        state.marker=L.circleMarker([state.lat,state.lng],{radius:8,color:'#0d9488',fillColor:'#0d9488',fillOpacity:.9}).addTo(state.map).bindPopup('Your location').openPopup();
      }
    },err=>{ $('msg').innerHTML=`<div class="text-sm text-amber-600 bg-amber-50 border border-amber-200/70 rounded-xl px-4 py-3">${I18N.t('c4.punch.locUnavailable').replace('{msg}',esc(err.message))}</div>`; },
    {enableHighAccuracy:true, timeout:12000});
  }

  /* camera */
  const vid=$('vid');
  $('camon').onclick=async()=>{
    try{
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:640}, height:{ideal:480}}, audio:false});
      state.stream=stream; vid.srcObject=stream;
      $('snap').disabled=false; $('camon').disabled=true;
      $('camon').textContent=I18N.t('c4.punch.cameraOn');
    }catch(e){
      $('novideo').style.display='flex';
      toast(I18N.t('c4.punch.camNotAvailable').replace('{msg}',e.message),'warn');
    }
  };
  $('snap').onclick=()=>{
    if(!state.stream) return;
    const cap=$('cap');
    const vw=vid.videoWidth||640, vh=vid.videoHeight||480;
    const scale=Math.min(1, 320/Math.max(vw,vh));
    cap.width=Math.round(vw*scale); cap.height=Math.round(vh*scale);
    cap.getContext('2d').drawImage(vid,0,0,cap.width,cap.height);
    state.selfie=cap.toDataURL('image/jpeg',0.6);
    $('shotimg').src=state.selfie; $('shot').classList.remove('hidden'); $('shot').classList.add('flex');
  };

  async function doPunch(type){
    const msg=$('msg');
    const empSel=document.querySelector(`[name="empId"]`);
    const empId=empSel?empSel.value:state.empId;
    if(!empId){ msg.innerHTML=`<div class="text-sm text-red-600 bg-red-50 border border-red-200/70 rounded-xl px-4 py-3">${I18N.t('c4.punch.selectEmp')}</div>`; return; }
    /* client-side duplicate guard: same employee+type within 5 minutes */
    const last=getLastPunch();
    if(last&&last.employeeId===empId&&last.type===type&&(Date.now()-last.at)<5*60*1000){
      msg.innerHTML=`<div class="text-sm text-amber-700 bg-amber-50 border border-amber-200/70 rounded-xl px-4 py-3">${I18N.t('c4.punch.dupBlocked').replace('{type}',type)}</div>`;
      return;
    }
    const btn=type==='in'?$('in'):$('out');
    btn.disabled=true; btn.innerHTML='<span class="spinner"></span>';
    const payload={employeeId:empId, type, lat:state.lat, lng:state.lng, selfie:state.selfie, deviceId:'', source:'gps'};
    const queueIt=()=>{
      const q=getQueue(); q.push({...payload, queuedAt:Date.now()});
      setQueue(q);
      msg.innerHTML=`<div class="text-sm text-amber-700 bg-amber-50 border border-amber-200/70 rounded-xl px-4 py-3">
        ${I18N.t('c4.punch.queuedOffline').replace('{n}',q.length)}</div>`;
      syncQueue($('qstatus'));
      btn.disabled=false; btn.textContent=I18N.t(type==='in'?'c4.punch.checkInBtn':'c4.punch.checkOutBtn');
    };
    if(!navigator.onLine){ queueIt(); return; }
    try{
      const r=await API.call('punch', payload.employeeId, payload.type, payload.lat, payload.lng, payload.selfie, payload.deviceId, payload.source);
      setLastPunch({employeeId:empId, type, at:Date.now()});
      msg.innerHTML=`<div class="text-sm ${r.outOfZone?'text-amber-700 bg-amber-50 border-amber-200/70':'text-emerald-700 bg-emerald-50 border-emerald-200/70'} border rounded-xl px-4 py-3">
        <b>${type==='in'?I18N.t('c4.common.checkedIn'):I18N.t('c4.common.checkedOut')} ✓</b> at ${esc(r.punch.time)} · ${esc((r.site||{}).name||I18N.t('c4.punch.noSiteMatched'))} · ${I18N.t('c4.punch.mAway').replace('{n}',fmtNum(r.distanceM??0))}
        ${r.outOfZone?I18N.t('c4.punch.flaggedOoz'):''}</div>`;
      toast(I18N.t('c4.punch.recordedToast').replace('{s}',type==='in'?I18N.t('c4.common.checkedIn'):I18N.t('c4.common.checkedOut')),'success');
    }catch(e){
      /* offline or server error → queue */
      const q=getQueue(); q.push({...payload, queuedAt:Date.now()});
      setQueue(q);
      msg.innerHTML=`<div class="text-sm text-amber-700 bg-amber-50 border border-amber-200/70 rounded-xl px-4 py-3">
        ${navigator.onLine?I18N.t('c4.punch.serverBusy'):I18N.t('c4.punch.youOffline')} — ${I18N.t('c4.punch.queuedAuto').replace('{n}',q.length)}</div>`;
      syncQueue($('qstatus'));
    }
    btn.disabled=false; btn.textContent=I18N.t(type==='in'?'c4.punch.checkInBtn':'c4.punch.checkOutBtn');
  }
  $('in').onclick=()=>doPunch('in');
  $('out').onclick=()=>doPunch('out');

  /* offline queue status + auto-sync */
  const qs=$('qstatus');
  const q0=getQueue();
  if(q0.length) qs.innerHTML=badge(I18N.t('c4.punch.queuedN').replace('{n}',q0.length),'amber');
  syncQueue(qs);
  window.addEventListener('online',()=>syncQueue(qs));
};
})();


/* ===== 40_employees.js ===== */
/* 40_employees.js — employee table, add/edit modal, device bind/unbind,
   CSV import, departments tab. Verola premium styling (pixel-perfect). */
(function(){
'use strict';

App.nav.push({group:'WORKFORCE', path:'#/employees', label:I18N.t('c4.nav.employees'), labelKey:'c4.nav.employees', icon:'employees', perm:'employees'});

/* one-time document click closes any open "..." menus */
if(!window._vactDocBound){ window._vactDocBound=true; document.addEventListener('click', ()=>{ document.querySelectorAll('.vact-menu').forEach(m=>m.remove()); }); }
function closeVactMenus(){ document.querySelectorAll('.vact-menu').forEach(m=>m.remove()); }

const SEARCH_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-4 h-4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';

App.routes['#/employees'] = async (el, params)=>{
  const cid=uid('emp');
  const tab=(params&&params.tab)||'list';
  const canEdit=perm('employees','edit');
  const T=k=>I18N.t(k);
  el.innerHTML=pageHead(T('c4.nav.employees'), T('c4.emp.sub'),
    `${canEdit?`<button class="${btnS}" id="${cid}-import">${T('c4.emp.importCsv')}</button><button class="${btnP}" id="${cid}-add">${T('c4.emp.addEmployee')}</button>`:''}`)+
  `<div class="flex gap-2 mb-5">
    <a href="#/employees" class="px-4 py-2 rounded-xl text-sm font-semibold transition ${tab==='list'?'bg-slate-900 text-white shadow':'bg-white text-slate-500 border border-slate-200 hover:border-slate-300'}">${T('c4.emp.tabEmployees')}</a>
    <a href="#/employees?tab=departments" class="px-4 py-2 rounded-xl text-sm font-semibold transition ${tab==='departments'?'bg-slate-900 text-white shadow':'bg-white text-slate-500 border border-slate-200 hover:border-slate-300'}">${T('c4.emp.tabDepartments')}</a>
  </div>
  <div id="${cid}-filters"></div>
  <div id="${cid}-body"></div>`;

  const body=document.getElementById(cid+'-body');
  const filtersEl=document.getElementById(cid+'-filters');
  let emps=[], depts=[];
  let q='', statusF='all', deptF='all', page=1, filteredTotal=0;
  const PER=10;

  async function load(){
    emps=await API.call('listEmployees');
    depts=await API.call('listDepartments');
    renderFilters();
    render();
  }

  /* Verola filter row: search + status pills + department pill-select */
  function renderFilters(){
    if(tab!=='list'){ filtersEl.innerHTML=''; return; }
    const pills=[['all',T('c4.emp.allStatus')||'All Status'],['active',T('c4.common.active')],['inactive',T('c4.common.inactive')]];
    filtersEl.innerHTML=`<div class="flex flex-wrap items-center gap-2.5 mb-4 anim-fadeUp">
      <div class="relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">${SEARCH_SVG}</span>
        <input id="${cid}-q" placeholder="${esc(T('c4.emp.searchPh'))}" value="${esc(q)}" class="bg-white border border-slate-200 rounded-xl pl-9 pr-3 py-2.5 text-sm text-slate-700 placeholder:text-slate-400 focus:border-slate-400 focus:outline-none transition w-56">
      </div>
      ${pills.map(([k,l])=>`<button data-sf="${k}" class="px-4 py-2.5 rounded-xl text-sm font-medium transition ${statusF===k?'bg-slate-900 text-white shadow':'bg-white border border-slate-200 text-slate-600 hover:border-slate-300 hover:bg-slate-50'}">${esc(l)}</button>`).join('')}
      <select id="${cid}-deptF" class="px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-sm font-medium text-slate-600 hover:border-slate-300 focus:border-slate-400 focus:outline-none cursor-pointer transition">
        <option value="all">${esc(T('c4.emp.allDepts')||'All Departments')}</option>
        ${depts.map(d=>`<option value="${esc(d.id)}" ${deptF===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}
      </select>
    </div>`;
    const qi=filtersEl.querySelector('#'+cid+'-q');
    qi.addEventListener('input', debounce(()=>{ q=qi.value; page=1; render(); },200));
    filtersEl.querySelectorAll('[data-sf]').forEach(b=>b.onclick=()=>{
      statusF=b.dataset.sf; page=1;
      filtersEl.querySelectorAll('[data-sf]').forEach(x=>{
        const on=x.dataset.sf===statusF;
        x.className=`px-4 py-2.5 rounded-xl text-sm font-medium transition ${on?'bg-slate-900 text-white shadow':'bg-white border border-slate-200 text-slate-600 hover:border-slate-300 hover:bg-slate-50'}`;
      });
      render();
    });
    filtersEl.querySelector('#'+cid+'-deptF').onchange=e=>{ deptF=e.target.value; page=1; render(); };
  }

  function filtered(){
    const ql=q.toLowerCase();
    return emps.filter(e=>
      (statusF==='all' || (statusF==='active'?e.active:!e.active)) &&
      (deptF==='all' || e.departmentId===deptF) &&
      (e.name+' '+e.code+' '+(e.phone||'')).toLowerCase().includes(ql)
    );
  }

  function render(){
    if(tab==='departments'){ renderDepts(); return; }
    const rows=filtered();
    filteredTotal=rows.length;
    const pages=Math.max(1, Math.ceil(filteredTotal/PER));
    if(page>pages) page=pages;
    const slice=rows.slice((page-1)*PER, page*PER);
    body.innerHTML=tableHTML([
      {label:T('c4.emp.colEmployee'), get:e=>`<div class="flex items-center gap-3">${avatar(e.name)}<div><div class="font-semibold text-slate-700">${esc(e.name)}</div><div class="text-xs text-slate-400">${esc(e.code)} · ${esc(e.designation||'—')}</div></div></div>`},
      {label:T('c4.emp.colDepartment'), get:e=>`<span class="text-slate-600">${esc(e.department||'—')}</span>`},
      {label:T('c4.emp.colPhone'), get:e=>`<span class="text-slate-600">${esc(e.phone||'—')}</span>`},
      {label:T('c4.emp.colSalary'), num:1, get:e=>`<span class="tabular-nums font-medium text-slate-700">${fmt(e.salary)}</span>`},
      {label:T('c4.emp.colDevice'), get:e=>e.deviceId?`<span class="font-mono text-xs bg-slate-100 px-2 py-1 rounded-lg text-slate-600">${esc(e.deviceId)}</span>`:'<span class="text-slate-300 text-xs">'+T('c4.emp.notBound')+'</span>'},
      {label:T('c4.common.status'), get:e=>badge(e.active?T('c4.common.active'):T('c4.common.inactive'), e.active?'emerald':'slate')},
      {label:'', get:e=>canEdit?`<div class="flex justify-end">${vActionsMenu().replace('data-vact','data-vact="'+esc(e.id)+'"')}</div>`:''},
    ], slice, {empty:T('c4.emp.emptyEmps'), checkbox:true})+vPaginationHTML(filteredTotal, page, PER);
    /* select-all */
    const allCb=body.querySelector('[data-vcb-all]');
    if(allCb) allCb.onchange=()=>{ body.querySelectorAll('[data-vcb]').forEach(c=>{ c.checked=allCb.checked; }); };
    vPaginateBind(body, p=>{
      if(p==='prev') page=Math.max(1,page-1);
      else if(p==='next') page=Math.min(pages,page+1);
      else if(typeof p==='number') page=p;
      render();
    });
    bindActionMenus();
  }

  /* Verola "..." actions dropdown */
  function bindActionMenus(){
    body.querySelectorAll('[data-vact]').forEach(btn=>{
      btn.onclick=ev=>{
        ev.stopPropagation();
        closeVactMenus();
        const e=emps.find(x=>x.id===btn.dataset.vact);
        if(!e) return;
        const menu=document.createElement('div');
        menu.className='vact-menu fixed z-50 bg-white border border-slate-200 rounded-xl shadow-lg py-1.5 min-w-[150px]';
        menu.innerHTML=`
          <button data-m="edit" class="w-full text-left px-4 py-2 text-sm text-slate-600 hover:bg-slate-50 transition">${T('c4.common.edit')}</button>
          <button data-m="dev" class="w-full text-left px-4 py-2 text-sm text-slate-600 hover:bg-slate-50 transition">${e.deviceId?T('c4.common.unbind'):T('c4.common.bind')}</button>
          <button data-m="del" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition">${T('c4.common.delete')}</button>`;
        document.body.appendChild(menu);
        const r=btn.getBoundingClientRect();
        menu.style.top=Math.min(r.bottom+6, window.innerHeight-150)+'px';
        menu.style.left=Math.max(8, Math.min(r.right-160, window.innerWidth-170))+'px';
        menu.querySelector('[data-m="edit"]').onclick=()=>{ closeVactMenus(); openEditor(e); };
        menu.querySelector('[data-m="dev"]').onclick=()=>{ closeVactMenus(); toggleDevice(e); };
        menu.querySelector('[data-m="del"]').onclick=()=>{ closeVactMenus(); deleteEmp(e); };
      };
    });
  }

  async function deleteEmp(e){
    if(!await confirmDlg(T('c4.emp.delEmpTitle'),T('c4.emp.delEmpMsg'),T('c4.common.delete'))) return;
    await API.call('deleteEmployee',e.id); toast(T('c4.emp.empDeleted'),'success'); load();
  }

  async function toggleDevice(e){
    if(e.deviceId){
      await API.call('unbindDevice',e.id); toast(T('c4.emp.deviceUnbound'),'success'); load();
    }else{
      const m=modal(T('c4.emp.bindTitle'),`<p class="text-sm text-slate-500 mb-4">${T('c4.emp.bindMsg').replace('{name}',esc(e.name))}</p>
        ${field(T('c4.emp.fDeviceId'),'deviceId',{ph:'ZK-1001',req:true})}
        <div class="flex justify-end gap-2 mt-5"><button class="${btnS}" id="dCancel">${T('c4.common.cancel')}</button><button class="${btnP}" id="dSave">${T('c4.common.bind')}</button></div>`);
      m.el.querySelector('#dCancel').onclick=()=>m.close();
      m.el.querySelector('#dSave').onclick=async()=>{
        await API.call('bindDevice',e.id,formVal(m.el,'deviceId')); m.close(); toast(T('c4.emp.deviceBound'),'success'); load();
      };
    }
  }

  function renderDepts(){
    body.innerHTML=(canEdit?`<div class="flex justify-end mb-3"><button class="${btnP}" id="${cid}-addDept">${T('c4.emp.addDept')}</button></div>`:'')+tableHTML([
      {label:T('c4.emp.colDepartment'), get:d=>`<div class="flex items-center gap-3">${avatar(d.name)}<span class="font-semibold text-slate-700">${esc(d.name)}</span></div>`},
      {label:T('c4.emp.colHeadcount'), num:1, get:d=>fmtNum(d.headcount)},
      {label:'', get:d=>canEdit?`<div class="flex gap-1 justify-end"><button class="${btnS} !px-3 !py-1.5 !text-xs" data-ed="${d.id}">${T('c4.common.edit')}</button><button class="${btnS} !px-3 !py-1.5 !text-xs !text-red-600" data-del="${d.id}">${T('c4.common.delete')}</button></div>`:''},
    ], depts, {empty:T('c4.emp.emptyDepts')});
    if(!canEdit) return;
    const addD=document.getElementById(cid+'-addDept');
    if(addD) addD.onclick=()=>{
      const m=modal(T('c4.emp.addDeptTitle'), `${field(T('c4.emp.deptName'),'name',{req:true})}<div class="flex justify-end gap-2 mt-5"><button class="${btnS}" id="dCancel">${T('c4.common.cancel')}</button><button class="${btnP}" id="dSave">${T('c4.common.save')}</button></div>`);
      m.el.querySelector('#dCancel').onclick=()=>m.close();
      m.el.querySelector('#dSave').onclick=async()=>{ const nm=formVal(m.el,'name'); if(!nm){toast(T('c4.emp.nameRequired'),'warn');return;} await API.call('saveDepartment',{name:nm}); m.close(); toast(T('c4.emp.deptSaved'),'success'); load(); };
    };
    body.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{
      const d=depts.find(x=>x.id===b.dataset.ed);
      const m=modal(T('c4.emp.editDeptTitle'), `${field(T('c4.emp.deptName'),'name',{value:d.name,req:true})}<div class="flex justify-end gap-2 mt-5"><button class="${btnS}" id="dCancel">${T('c4.common.cancel')}</button><button class="${btnP}" id="dSave">${T('c4.common.save')}</button></div>`);
      m.el.querySelector('#dCancel').onclick=()=>m.close();
      m.el.querySelector('#dSave').onclick=async()=>{ await API.call('saveDepartment',{id:d.id,name:formVal(m.el,'name')}); m.close(); toast(T('c4.emp.deptSaved'),'success'); load(); };
    });
    body.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      if(!await confirmDlg(T('c4.emp.delDeptTitle'),T('c4.emp.cannotUndo'),T('c4.common.delete'))) return;
      try{ await API.call('deleteDepartment',b.dataset.del); toast(T('c4.emp.deleted'),'success'); load(); }catch(e2){ toast(e2.message,'error'); }
    });
  }

  function openEditor(e){
    const isNew=!e; e=e||{name:'',code:'',departmentId:'d1',designation:'',phone:'',email:'',salary:0,joinDate:todayISO(),active:true};
    const m=modal(isNew?T('c4.emp.addEmpTitle'):T('c4.emp.editEmpTitle'),`
      <div class="flex items-center gap-4 mb-5 p-4 rounded-2xl bg-slate-50 border border-slate-200/60">
        ${avatar(e.name||'?', 'w-11 h-11 text-sm')}
        <div><div class="font-bold text-slate-800">${isNew?T('c4.emp.addEmpTitle'):esc(e.name)}</div><div class="text-xs text-slate-400">${isNew?T('c4.emp.sub'):esc(e.code||'')}</div></div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        ${field(T('c4.emp.fFullName'),'name',{value:e.name,req:true})}
        ${field(T('c4.emp.fEmpCode'),'code',{value:e.code,ph:'EMP-011'})}
        ${field(T('c4.emp.colDepartment'),'departmentId',{type:'select',value:e.departmentId,options:depts.map(d=>({value:d.id,label:d.name}))})}
        ${field(T('c4.emp.fDesignation'),'designation',{value:e.designation||''})}
        ${field(T('c4.emp.fPhone'),'phone',{value:e.phone||'',ph:'0300-0000000'})}
        ${field(T('c4.emp.fEmail'),'email',{value:e.email||'',type:'email'})}
        ${field(T('c4.emp.fSalary'),'salary',{value:e.salary||0,type:'number',min:0})}
        ${field(T('c4.emp.fJoinDate'),'joinDate',{value:e.joinDate||todayISO(),type:'date'})}
        <div class="col-span-2">${field(T('c4.emp.fActive'),'active',{type:'checkbox',value:e.active})}</div>
      </div>
      <div class="flex justify-end gap-2 mt-6"><button class="${btnS}" id="eCancel">${T('c4.common.cancel')}</button><button class="${btnP}" id="eSave">${T('c4.emp.saveEmployee')}</button></div>`,{wide:true});
    m.el.querySelector('#eCancel').onclick=()=>m.close();
    m.el.querySelector('#eSave').onclick=async()=>{
      const data=collectForm(m.el);
      if(!data.name){ toast(T('c4.emp.nameIsRequired'),'warn'); return; }
      await API.call('saveEmployee',{...(isNew?{}:{id:e.id}),...data});
      m.close(); toast(T('c4.emp.empSaved'),'success'); load();
    };
  }

  const addB=document.getElementById(cid+'-add'); if(addB) addB.onclick=()=>openEditor(null);
  const impB=document.getElementById(cid+'-import');
  if(impB) impB.onclick=()=>{
    const m=modal(T('c4.emp.importTitle'),`
      <p class="text-sm text-slate-500 mb-3">${T('c4.emp.importHelp')}<code class="bg-slate-100 px-1 rounded">name,code,designation,phone,email,salary,joinDate</code></p>
      <input type="file" id="csvFile" accept=".csv" class="text-sm mb-4">
      <div class="flex justify-end gap-2"><button class="${btnS}" id="iCancel">${T('c4.common.cancel')}</button><button class="${btnP}" id="iGo">${T('c4.common.import')}</button></div>`);
    m.el.querySelector('#iCancel').onclick=()=>m.close();
    m.el.querySelector('#iGo').onclick=()=>{
      const f=m.el.querySelector('#csvFile').files[0];
      if(!f){ toast(T('c4.emp.chooseCsv'),'warn'); return; }
      const rd=new FileReader();
      rd.onload=async()=>{
        try{
          const lines=String(rd.result).split(/\r?\n/).filter(l=>l.trim());
          const heads=lines[0].split(',').map(h=>h.trim().toLowerCase());
          const rows=lines.slice(1).map(l=>{ const cells=l.split(','); const o={}; heads.forEach((h2,i)=>o[h2]=(cells[i]||'').trim()); return o; });
          const r=await API.call('importEmployeesCSV',rows);
          m.close(); toast(T('c4.emp.importedN').replace('{n}',r.imported),'success'); load();
        }catch(e2){ toast(e2.message,'error'); }
      };
      rd.readAsText(f);
    };
  };
  await load();
};
})();

</script>
</body></html>
