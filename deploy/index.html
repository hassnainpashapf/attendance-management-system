  const body=document.getElementById(cid+'-body');
  let emps=[], depts=[];
  async function load(){
    emps=await API.call('listEmployees');
    depts=await API.call('listDepartments');
    render();
  }
  function render(){
    const q=(document.getElementById(cid+'-q').value||'').toLowerCase();
    if(tab==='departments'){
      body.innerHTML=(perm('employees','edit')?`<div class="flex justify-end mb-3"><button class="${btnS}" id="${cid}-addDept">+ Department</button></div>`:'')+tableHTML([
        {label:'Department', get:d=>`<span class="font-semibold text-slate-700">${esc(d.name)}</span>`},
        {label:'Headcount', num:1, get:d=>fmtNum(d.headcount)},
        {label:'', get:d=>perm('employees','edit')?`<div class="flex gap-1 justify-end"><button class="${btnS} !px-3 !py-1.5 !text-xs" data-ed="${d.id}">Edit</button><button class="${btnS} !px-3 !py-1.5 !text-xs !text-red-600" data-del="${d.id}">Delete</button></div>`:''},
      ], depts.filter(d=>d.name.toLowerCase().includes(q)), {empty:'No departments yet'});
      if(perm('employees','edit')){
        const addD=document.getElementById(cid+'-addDept');
        if(addD) addD.onclick=()=>{
          const m=modal('Add Department', `${field('Department name','name',{req:true})}<div class="flex justify-end gap-2 mt-5"><button class="${btnS}" id="dCancel">Cancel</button><button class="${btnP}" id="dSave">Save</button></div>`);
          m.el.querySelector('#dCancel').onclick=()=>m.close();
          m.el.querySelector('#dSave').onclick=async()=>{ const nm=formVal(m.el,'name'); if(!nm){toast('Name required','warn');return;} await API.call('saveDepartment',{name:nm}); m.close(); toast('Department saved','success'); load(); };
        };
        body.querySelectorAll('[data-ed]').forEach(b=>b.onclick=async()=>{
          const d=depts.find(x=>x.id===b.dataset.ed);
          const m=modal('Edit Department', `${field('Department name','name',{value:d.name,req:true})}<div class="flex justify-end gap-2 mt-5"><button class="${btnS}" id="dCancel">Cancel</button><button class="${btnP}" id="dSave">Save</button></div>`);
          m.el.querySelector('#dCancel').onclick=()=>m.close();
          m.el.querySelector('#dSave').onclick=async()=>{ await API.call('saveDepartment',{id:d.id,name:formVal(m.el,'name')}); m.close(); toast('Department saved','success'); load(); };
        });
        body.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
          if(!await confirmDlg('Delete department?','This cannot be undone.','Delete')) return;
          try{ await API.call('deleteDepartment',b.dataset.del); toast('Deleted','success'); load(); }catch(e){ toast(e.message,'error'); }
        });
      }
      return;
    }
    const rows=emps.filter(e=>(e.name+' '+e.code+' '+(e.phone||'')).toLowerCase().includes(q));
    body.innerHTML=tableHTML([
      {label:'Employee', get:e=>`<div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl bg-teal-50 text-teal-700 flex items-center justify-center font-bold text-sm">${esc((e.name||'?')[0])}</div><div><div class="font-semibold text-slate-700">${esc(e.name)}</div><div class="text-xs text-slate-400">${esc(e.code)} · ${esc(e.designation||'—')}</div></div></div>`},
      {label:'Department', get:e=>esc(e.department||'—')},
      {label:'Phone', get:e=>esc(e.phone||'—')},
      {label:'Salary', num:1, get:e=>`<span class="tabular-nums">${fmt(e.salary)}</span>`},
      {label:'Device', get:e=>e.deviceId?`<span class="font-mono text-xs bg-slate-100 px-2 py-1 rounded-lg">${esc(e.deviceId)}</span>`:'<span class="text-slate-300 text-xs">not bound</span>'},
      {label:'Status', get:e=>e.active?badge('Active','emerald'):badge('Inactive','slate')},
      {label:'', get:e=>perm('employees','edit')?`<div class="flex gap-1 justify-end">
        <button class="${btnS} !px-3 !py-1.5 !text-xs" data-edit="${e.id}">Edit</button>
        <button class="${btnS} !px-3 !py-1.5 !text-xs" data-dev="${e.id}">${e.deviceId?'Unbind':'Bind'}</button>
        <button class="${btnS} !px-3 !py-1.5 !text-xs !text-red-600" data-del="${e.id}">Delete</button></div>`:''},
    ], rows, {empty:'No employees found'});
    bindRow();
  }
  function bindRow(){
    body.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(emps.find(e=>e.id===b.dataset.edit)));
    body.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      if(!await confirmDlg('Delete employee?','Their attendance history stays, but the profile is removed.','Delete')) return;
      await API.call('deleteEmployee',b.dataset.del); toast('Employee deleted','success'); load();
    });
    body.querySelectorAll('[data-dev]').forEach(b=>b.onclick=async()=>{
      const e=emps.find(x=>x.id===b.dataset.dev);
      if(e.deviceId){
        await API.call('unbindDevice',e.id); toast('Device unbound','success'); load();
      }else{
        const m=modal('Bind device',`<p class="text-sm text-slate-500 mb-4">Bind a biometric / ZKTeco device ID to <b>${esc(e.name)}</b>. Punches from any other device will be rejected.</p>
          ${field('Device ID','deviceId',{ph:'ZK-1001',req:true})}
          <div class="flex justify-end gap-2 mt-5"><button class="${btnS}" id="dCancel">Cancel</button><button class="${btnP}" id="dSave">Bind</button></div>`);
        m.el.querySelector('#dCancel').onclick=()=>m.close();
        m.el.querySelector('#dSave').onclick=async()=>{
          await API.call('bindDevice',e.id,formVal(m.el,'deviceId')); m.close(); toast('Device bound','success'); load();
        };
      }
    });
  }
  function openEditor(e){
    const isNew=!e; e=e||{name:'',code:'',departmentId:'d1',designation:'',phone:'',email:'',salary:0,joinDate:todayISO(),active:true};
    const m=modal(isNew?'Add Employee':'Edit Employee',`
      <div class="grid grid-cols-2 gap-4">
        ${field('Full name','name',{value:e.name,req:true})}
        ${field('Employee code','code',{value:e.code,ph:'EMP-011'})}
        ${field('Department','departmentId',{type:'select',value:e.departmentId,options:depts.map(d=>({value:d.id,label:d.name}))})}
        ${field('Designation','designation',{value:e.designation||''})}
        ${field('Phone','phone',{value:e.phone||'',ph:'0300-0000000'})}
        ${field('Email','email',{value:e.email||'',type:'email'})}
        ${field('Monthly salary (Rs)','salary',{value:e.salary||0,type:'number',min:0})}
        ${field('Joining date','joinDate',{value:e.joinDate||todayISO(),type:'date'})}
        <div class="col-span-2">${field('Active','active',{type:'checkbox',value:e.active})}</div>
      </div>
      <div class="flex justify-end gap-2 mt-6"><button class="${btnS}" id="eCancel">Cancel</button><button class="${btnP}" id="eSave">Save employee</button></div>`,{wide:true});
    m.el.querySelector('#eCancel').onclick=()=>m.close();
    m.el.querySelector('#eSave').onclick=async()=>{
      const data=collectForm(m.el);
      if(!data.name){ toast('Name is required','warn'); return; }
      await API.call('saveEmployee',{...(isNew?{}:{id:e.id}),...data});
      m.close(); toast('Employee saved','success'); load();
    };
  }
  const addB=document.getElementById(cid+'-add'); if(addB) addB.onclick=()=>openEditor(null);
  const impB=document.getElementById(cid+'-import');
  if(impB) impB.onclick=()=>{
    const m=modal('Import employees (CSV)',`
      <p class="text-sm text-slate-500 mb-3">Upload a CSV with headers: <code class="bg-slate-100 px-1 rounded">name,code,designation,phone,email,salary,joinDate</code></p>
      <input type="file" id="csvFile" accept=".csv" class="text-sm mb-4">
      <div class="flex justify-end gap-2"><button class="${btnS}" id="iCancel">Cancel</button><button class="${btnP}" id="iGo">Import</button></div>`);
    m.el.querySelector('#iCancel').onclick=()=>m.close();
    m.el.querySelector('#iGo').onclick=()=>{
      const f=m.el.querySelector('#csvFile').files[0];
      if(!f){ toast('Choose a CSV file','warn'); return; }
      const rd=new FileReader();
      rd.onload=async()=>{
        try{
          const lines=String(rd.result).split(/\r?\n/).filter(l=>l.trim());
          const heads=lines[0].split(',').map(h=>h.trim().toLowerCase());
          const rows=lines.slice(1).map(l=>{ const cells=l.split(','); const o={}; heads.forEach((h2,i)=>o[h2]=(cells[i]||'').trim()); return o; });
          const r=await API.call('importEmployeesCSV',rows);
          m.close(); toast(r.imported+' employee(s) imported','success'); load();
        }catch(e2){ toast(e2.message,'error'); }
      };
      rd.readAsText(f);
    };
  };
  document.getElementById(cid+'-q').addEventListener('input',debounce(render,200));
  await load();
};
})();

        ${field('Latitude','lat',{value:s.lat,type:'number',step:'0.000001',req:true})}
        ${field('Longitude','lng',{value:s.lng,type:'number',step:'0.000001',req:true})}
        <div class="col-span-2"><label class="block"><span class="block text-xs font-semibold text-slate-500 mb-1.5 tracking-wide">GEOFENCE RADIUS · <span id="radVal" class="text-teal-600">${fmtNum(s.radiusM)} m</span></span>
          <input type="range" name="radiusM" min="50" max="1000" step="10" value="${s.radiusM}" class="w-full accent-teal-600"></label></div>
        <div class="col-span-2">${field('Active','active',{type:'checkbox',value:s.active})}</div>
      </div>
      <div id="mapPick" class="h-64 border border-slate-200/70 mb-2"></div>
      <p class="text-xs text-slate-400 mb-4">Click anywhere on the map to move the site pin. Drag the slider to resize the geofence.</p>
      <div class="flex justify-end gap-2"><button class="${btnS}" id="sCancel">Cancel</button><button class="${btnP}" id="sSave">Save site</button></div>`,{wide:true});
    const mapEl=m.el.querySelector('#mapPick');
    const map=buildMap(mapEl,[Number(s.lat),Number(s.lng)],14);
    let marker=null, circle=null;
    const radInput=m.el.querySelector('[name="radiusM"]');
    const radVal=m.el.querySelector('#radVal');
    radInput.addEventListener('input',()=>{ radVal.textContent=fmtNum(radInput.value)+' m'; if(circle) circle.setRadius(Number(radInput.value)); });
    if(map){
      marker=L.marker([Number(s.lat),Number(s.lng)],{draggable:true}).addTo(map);
      circle=L.circle([Number(s.lat),Number(s.lng)],{radius:Number(s.radiusM),color:'#0d9488',weight:2,fillOpacity:.08}).addTo(map);
      marker.on('dragend',sync);
      map.on('click',e=>{ marker.setLatLng(e.latlng); sync(); });
      setTimeout(()=>map.invalidateSize(),150);
    }
    function sync(){
      if(!marker) return;
      const lat=marker.getLatLng().lat, lng=marker.getLatLng().lng;
      m.el.querySelector('[name="lat"]').value=lat.toFixed(6);
      m.el.querySelector('[name="lng"]').value=lng.toFixed(6);
      if(circle) circle.setLatLng([lat,lng]);
    }
    m.el.querySelector('#sCancel').onclick=()=>m.close();
    m.el.querySelector('#sSave').onclick=async()=>{
      const data=collectForm(m.el);
      if(!data.name){ toast('Site name required','warn'); return; }
      data.radiusM=Number(data.radiusM)||150;
      await API.call('saveSite',{...(isNew?{}:{id:s.id}),...data});
      m.close(); toast('Site saved','success'); load();
    };
  }

  function openAssign(siteId){
    const s=sites.find(x=>x.id===siteId);
    const assigned=s.employeeIds||(window.MockDB?MockDB.siteEmployees:[]).filter(x=>x.siteId===siteId).map(x=>x.employeeId);
    const m=modal('Assign staff — '+s.name,`
      <div class="max-h-80 overflow-y-auto space-y-1 mb-5">
        ${emps.filter(e=>e.active).map(e=>`<label class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-50 cursor-pointer">
          <input type="checkbox" name="emp" value="${e.id}" ${assigned.includes(e.id)?'checked':''} class="w-4 h-4 rounded accent-teal-600">
          <span class="text-sm font-medium text-slate-700">${esc(e.name)}</span><span class="text-xs text-slate-400 ml-auto">${esc(e.code)}</span></label>`).join('')}
      </div>
      <div class="flex justify-end gap-2"><button class="${btnS}" id="aCancel">Cancel</button><button class="${btnP}" id="aSave">Save assignments</button></div>`);
    m.el.querySelector('#aCancel').onclick=()=>m.close();
    m.el.querySelector('#aSave').onclick=async()=>{
      const ids=[...m.el.querySelectorAll('[name="emp"]:checked')].map(x=>x.value);
      await API.call('assignSiteEmployees',siteId,ids);
      m.close(); toast(ids.length+' employee(s) assigned','success'); load();
    };
  }

  const addB=document.getElementById(cid+'-add'); if(addB) addB.onclick=()=>openEditor(null);
  await load();
};
})();


/* ===== 60_shifts.js ===== */
/* 60_shifts.js — shifts CRUD + roster grid by date. */
(function(){
'use strict';

App.nav.push({group:'WORKFORCE', path:'#/shifts', label:'Shifts & Roster', icon:'shifts', perm:'shifts'});

App.routes['#/shifts'] = async (el)=>{
  const cid=uid('shift');
  const canEdit=perm('shifts','edit');
  el.innerHTML=pageHead('Shifts & Roster','Work hours and daily assignments',
    `${canEdit?`<button class="${btnP}" id="${cid}-add">+ Add Shift</button>`:''}`)+`
  <div class="grid grid-cols-1 xl:grid-cols-3 gap-4">
    <div class="bg-white rounded-2xl border border-slate-200/70 shadow-[0_1px_3px_rgba(15,23,42,.05)] p-6">
      <h3 class="font-display font-bold text-slate-800 mb-4">Shift templates</h3>
      <div id="${cid}-shifts"></div>
    </div>
    <div class="xl:col-span-2 bg-white rounded-2xl border border-slate-200/70 shadow-[0_1px_3px_rgba(15,23,42,.05)] p-6">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h3 class="font-display font-bold text-slate-800">Daily roster</h3>
        <div class="flex gap-2 items-center">
          <input type="date" id="${cid}-date" value="${todayISO()}" class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-teal-500/40 focus:outline-none">
          ${canEdit?`<button class="${btnS}" id="${cid}-assign">Assign</button>`:''}
        </div>
      </div>
      <div id="${cid}-roster"></div>
    </div>
  </div>`;
  const shiftsEl=document.getElementById(cid+'-shifts');
  const rosterEl=document.getElementById(cid+'-roster');
  const dateEl=document.getElementById(cid+'-date');
  let shifts=[], rosters=[], emps=[], sites=[];

  async function loadShifts(){
    shifts=await API.call('listShifts');
    shiftsEl.innerHTML=shifts.map(s=>`
      <div class="rounded-2xl border border-slate-200/70 p-4 mb-3 flex items-center gap-3 hover:border-teal-300 transition">
        <div class="w-11 h-11 rounded-xl bg-teal-50 text-teal-600 flex items-center justify-center shrink-0">${App.ICONS.shifts}</div>
        <div class="flex-1 min-w-0"><div class="font-semibold text-slate-700 text-sm">${esc(s.name)}</div>
          <div class="text-xs text-slate-400 tabular-nums">${esc(s.startTime)} – ${esc(s.endTime)} · grace ${s.graceMin} min</div></div>
        ${canEdit?`<div class="flex gap-1"><button class="${btnS} !px-2.5 !py-1.5 !text-xs" data-se="${s.id}">Edit</button><button class="${btnS} !px-2.5 !py-1.5 !text-xs !text-red-600" data-sd="${s.id}">✕</button></div>`:''}
      </div>`).join('')||'<p class="text-sm text-slate-400">No shifts defined.</p>';
    shiftsEl.querySelectorAll('[data-se]').forEach(b=>b.onclick=()=>openShiftEditor(shifts.find(s=>s.id===b.dataset.se)));
    shiftsEl.querySelectorAll('[data-sd]').forEach(b=>b.onclick=async()=>{
      if(!await confirmDlg('Delete shift?','Roster entries using it stay as-is.','Delete')) return;
      await API.call('deleteShift',b.dataset.sd); toast('Shift deleted','success'); loadShifts();
    });
  }
  async function loadRoster(){
    rosters=await API.call('listRosters',dateEl.value);
    emps=await API.call('listEmployees');
    sites=await API.call('listSites');
    rosterEl.innerHTML=tableHTML([
      {label:'Employee', get:r=>`<span class="font-medium text-slate-700">${esc(r.employeeName||'—')}</span>`},
      {label:'Shift', get:r=>esc(r.shiftName||'—')},
      {label:'Site', get:r=>esc(r.siteName||'—')},
      {label:'', get:r=>canEdit?`<div class="flex gap-1 justify-end"><button class="${btnS} !px-3 !py-1.5 !text-xs !text-red-600" data-rd="${r.id}">Remove</button></div>`:''},
    ], rosters, {empty:'Nobody rostered for this date yet.'});
    rosterEl.querySelectorAll('[data-rd]').forEach(b=>b.onclick=async()=>{
      await API.call('deleteRoster',b.dataset.rd); toast('Removed','success'); loadRoster();
    });
  }
  function openShiftEditor(s){
    const isNew=!s; s=s||{name:'',startTime:'08:00',endTime:'17:00',graceMin:15};
    const m=modal(isNew?'Add Shift':'Edit Shift',`
      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-2">${field('Shift name','name',{value:s.name,req:true})}</div>
        ${field('Start time','startTime',{value:s.startTime,type:'time',req:true})}
        ${field('End time','endTime',{value:s.endTime,type:'time',req:true})}
        <div class="col-span-2">${field('Grace period (minutes)','graceMin',{value:s.graceMin,type:'number',min:0})}</div>
      </div>
      <div class="flex justify-end gap-2 mt-6"><button class="${btnS}" id="sCancel">Cancel</button><button class="${btnP}" id="sSave">Save shift</button></div>`);
    m.el.querySelector('#sCancel').onclick=()=>m.close();
    m.el.querySelector('#sSave').onclick=async()=>{
      const data=collectForm(m.el);
      if(!data.name){ toast('Name required','warn'); return; }
      await API.call('saveShift',{...(isNew?{}:{id:s.id}),...data});
      m.close(); toast('Shift saved','success'); loadShifts();
    };
  }
  const addB=document.getElementById(cid+'-add'); if(addB) addB.onclick=()=>openShiftEditor(null);
  dateEl.onchange=loadRoster;
  const asB=document.getElementById(cid+'-assign');
  if(asB) asB.onclick=()=>{
    const m=modal('Assign roster — '+fmtDate(dateEl.value),`
      <div class="grid grid-cols-1 gap-4 mb-4">
        ${field('Employee','employeeId',{type:'select',options:emps.filter(e=>e.active).map(e=>({value:e.id,label:e.name+' ('+e.code+')'}))})}
        ${field('Shift','shiftId',{type:'select',options:shifts.map(s=>({value:s.id,label:s.name+' ('+s.startTime+'–'+s.endTime+')'}))})}
        ${field('Site','siteId',{type:'select',options:[{value:'',label:'— No site —'}].concat(sites.filter(s=>s.active).map(s=>({value:s.id,label:s.name})))})}
      </div>
      <div class="flex justify-end gap-2"><button class="${btnS}" id="rCancel">Cancel</button><button class="${btnP}" id="rSave">Assign</button></div>`);
    m.el.querySelector('#rCancel').onclick=()=>m.close();
    m.el.querySelector('#rSave').onclick=async()=>{
      await API.call('saveRoster',{date:dateEl.value,...collectForm(m.el)});
      m.close(); toast('Roster assigned','success'); loadRoster();
    };
  };
  await loadShifts(); await loadRoster();
};
})();


/* ===== 70_attendance.js ===== */
/* 70_attendance.js — attendance log with filters, live map, bulk-mark modal,
   delete punch, corrections tab with approve/reject. */
(function(){
'use strict';

App.nav.push({group:'MAIN', path:'#/attendance', label:'Attendance', icon:'attendance', perm:'attendance'});

App.routes['#/attendance'] = async (el, params)=>{
  const cid=uid('att');
  const tab=(params&&params.tab)||'log';
  const canEdit=perm('attendance','edit');
  el.innerHTML=pageHead('Attendance','Punch log, live map and corrections',
    `${canEdit?`<button class="${btnP}" id="${cid}-bulk">Bulk Mark</button>`:''}`)+`
  <div class="flex gap-2 mb-5">
    ${[['log','Punch Log'],['map','Live Map'],['corrections','Corrections']].map(([k,l])=>
      `<a href="#/attendance${k==='log'?'':'?tab='+k}" class="px-4 py-2 rounded-xl text-sm font-semibold ${tab===k?'bg-teal-600 text-white shadow':'bg-white text-slate-500 border border-slate-200'}">${l}</a>`).join('')}
  </div>
  <div id="${cid}-body"></div>`;
  const body=document.getElementById(cid+'-body');
  const bulkB=document.getElementById(cid+'-bulk');

  if(tab==='map'){
    body.innerHTML=`<div class="bg-white rounded-2xl border border-slate-200/70 shadow-[0_1px_3px_rgba(15,23,42,.05)] p-6">
      <div class="flex items-center justify-between mb-4"><h3 class="font-display font-bold text-slate-800">Live map — today's punches</h3>
      <button class="${btnS}" id="${cid}-refresh">Refresh</button></div>
      <div id="${cid}-livemap" class="h-[480px] border border-slate-200/70"></div></div>`;
    const draw=async()=>{
      const mapEl=document.getElementById(cid+'-livemap'); if(!mapEl) return;
      mapEl.innerHTML='';
      const map=buildMap(mapEl,[31.5,74.35],11);
      if(!map) return;
      const pts=await API.call('getLiveMap');
      (pts||[]).forEach(p=>{
        const m=L.circleMarker([p.lat,p.lng],{radius:7,color:p.outOfZone?'#ef4444':'#0d9488',fillColor:p.outOfZone?'#ef4444':'#0d9488',fillOpacity:.9,weight:2})
          .addTo(map).bindPopup(`<b>${esc(p.employeeName)}</b><br>${p.type==='in'?'Checked in':'Checked out'} · ${esc(p.time)}<br>${esc(p.siteName)}${p.outOfZone?'<br><b style="color:#ef4444">Out of zone</b>':''}${p.selfie?'<br>📷 selfie attached':''}`);
      });
      const sites=await API.call('listSites');
      (sites||[]).filter(s=>s.active).forEach(s=>{
        L.circle([Number(s.lat),Number(s.lng)],{radius:Number(s.radiusM)||150,color:'#0ea5e9',weight:1.5,fillOpacity:.05}).addTo(map)
          .bindPopup(`<b>${esc(s.name)}</b><br>Geofence ${fmtNum(s.radiusM)} m`);
      });
      setTimeout(()=>map.invalidateSize(),150);
      const rf=document.getElementById(cid+'-refresh'); if(rf) rf.onclick=draw;
    };
    await draw();
    return;
  }

  if(tab==='corrections'){
    const rows=await API.call('listCorrections');
    body.innerHTML=tableHTML([
      {label:'Employee', get:c=>`<span class="font-medium text-slate-700">${esc(c.employeeName)}</span>`},
      {label:'Punch', get:c=>`${esc(c.punchDate)} · ${c.punchType==='in'?'Check-in':'Check-out'} ${esc(c.punchTime)}`},
      {label:'Request', get:c=>`<span class="text-slate-600">${esc(c.note)}</span>`},
      {label:'Status', get:c=>c.status==='pending'?badge('Pending','amber'):c.status==='approved'?badge('Approved','emerald'):badge('Rejected','red')},
      {label:'', get:c=>c.status==='pending'&&canEdit?`<div class="flex gap-1 justify-end">
        <button class="${btnS} !px-3 !py-1.5 !text-xs !text-emerald-700" data-ok="${c.id}">Approve</button>
        <button class="${btnS} !px-3 !py-1.5 !text-xs !text-red-600" data-no="${c.id}">Reject</button></div>`:`<span class="text-xs text-slate-400">${esc(c.decidedBy||'')}</span>`},
    ], rows, {empty:'No correction requests.'});
    body.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{ await API.call('decideCorrection',b.dataset.ok,'approved'); toast('Correction approved','success'); App.route(); });
    body.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{ await API.call('decideCorrection',b.dataset.no,'rejected'); toast('Correction rejected','success'); App.route(); });
    return;
  }

  /* punch log */
  const emps=await API.call('listEmployees').catch(()=>[]);
  const sites=await API.call('listSites').catch(()=>[]);
  body.innerHTML=`
    <div class="bg-white rounded-2xl border border-slate-200/70 p-4 mb-4 flex flex-wrap gap-3 items-end anim-fadeUp">
      ${field('From','from',{type:'date',value:addDays(todayISO(),-7)})}
      ${field('To','to',{type:'date',value:todayISO()})}
      ${field('Employee','employeeId',{type:'select',options:[{value:'',label:'All employees'}].concat(emps.filter(e=>e.active).map(e=>({value:e.id,label:e.name})))})}
      ${field('Site','siteId',{type:'select',options:[{value:'',label:'All sites'}].concat(sites.map(s=>({value:s.id,label:s.name})))})}
      <label class="flex items-center gap-2 text-sm cursor-pointer pb-2.5"><input type="checkbox" id="${cid}-ooz" class="w-4 h-4 rounded accent-teal-600"><span class="font-medium text-slate-600">Out-of-zone only</span></label>
      <button class="${btnP}" id="${cid}-go">Apply</button>
      <button class="${btnS}" id="${cid}-csv">Export CSV</button>
    </div>
    <div id="${cid}-rows"></div>`;
  const rowsEl=document.getElementById(cid+'-rows');
  async function load(){
    const f={
      from:formVal(body,'from'), to:formVal(body,'to'),
      employeeId:formVal(body,'employeeId'), siteId:formVal(body,'siteId'),
      outOfZone:document.getElementById(cid+'-ooz').checked||'',

      {label:'Date', get:p=>`<span class="tabular-nums">${fmtDate(p.date)}</span>`},
      {label:'Employee', get:p=>`<div><div class="font-medium text-slate-700">${esc(p.employeeName)}</div><div class="text-xs text-slate-400">${esc(p.employeeCode||'')}</div></div>`},
      {label:'Type', get:p=>p.type==='in'?badge('Check-in','emerald'):badge('Check-out','slate')},
      {label:'Time', get:p=>`<span class="tabular-nums font-medium">${esc(p.time)}</span>`},
      {label:'Site', get:p=>esc(p.siteName||'—')},
      {label:'Distance', num:1, get:p=>p.distanceM!=null?`<span class="tabular-nums">${fmtNum(p.distanceM)} m</span>`:'<span class="text-slate-300">—</span>'},
      {label:'Zone', get:p=>p.outOfZone?badge('Out of zone','red'):badge('In zone','teal')},
      {label:'Source', get:p=>`<span class="text-xs text-slate-400">${esc(p.source||'')}</span>`},
      {label:'', get:p=>`<div class="flex gap-1 justify-end">

    ], rows, {empty:'No punches match these filters.'});
    rowsEl.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      if(!await confirmDlg('Delete punch?','This cannot be undone.','Delete')) return;
      await API.call('deletePunch',b.dataset.del); toast('Punch deleted','success'); load();
    });
    rowsEl.querySelectorAll('[data-corr]').forEach(b=>b.onclick=()=>{
      const m=modal('Request correction',`${field('What should be corrected?','note',{type:'textarea',ph:'e.g. Wrong check-out time — actual was 17:05',req:true})}
        <div class="flex justify-end gap-2 mt-5"><button class="${btnS}" id="cCancel">Cancel</button><button class="${btnP}" id="cSend">Send request</button></div>`);
      m.el.querySelector('#cCancel').onclick=()=>m.close();
      m.el.querySelector('#cSend').onclick=async()=>{
        const note=formVal(m.el,'note'); if(!note){toast('Describe the correction','warn');return;}
        await API.call('requestCorrection',b.dataset.corr,note); m.close(); toast('Correction requested','success');
      };
    });
    rowsEl.querySelectorAll('[data-img]').forEach(b=>b.onclick=async()=>{
      const all=await API.call('listAttendance',{from:formVal(body,'from'),to:formVal(body,'to')});
      const p=all.find(x=>x.id===b.dataset.img);
      if(p&&p.selfie) modal('Selfie — '+p.employeeName,`<img src="${p.selfie}" class="rounded-2xl w-full" alt="selfie"><p class="text-xs text-slate-400 mt-3">${fmtDate(p.date)} · ${esc(p.time)} · ${esc(p.siteName||'')}</p>`);
      else toast('No selfie stored for this punch','warn');
    });
  }
  document.getElementById(cid+'-go').onclick=load;
  document.getElementById(cid+'-csv').onclick=async()=>{
    const r=await API.call('exportCSV','attendance',{from:formVal(body,'from'),to:formVal(body,'to')});
    downloadCSV(r.filename,r.csv); toast('CSV downloaded','success');
  };
  await load();

  if(bulkB) bulkB.onclick=async()=>{
    const m=modal('Bulk mark attendance',`
      <div class="grid grid-cols-2 gap-4 mb-4">
        ${field('Date','date',{type:'date',value:todayISO(),req:true})}
        ${field('Type','type',{type:'select',options:[{value:'in',label:'Check-in'},{value:'out',label:'Check-out'}]})}
      </div>
      ${field('Note','note',{ph:'Optional note recorded on each punch'})}
      <div class="max-h-64 overflow-y-auto border border-slate-200/70 rounded-2xl mt-4 mb-4 divide-y divide-slate-50">
        ${emps.filter(e=>e.active).map(e=>`<label class="flex items-center gap-3 px-4 py-2.5 hover:bg-slate-50 cursor-pointer">
          <input type="checkbox" name="bemp" value="${e.id}" class="w-4 h-4 rounded accent-teal-600">
          <span class="text-sm font-medium text-slate-700">${esc(e.name)}</span><span class="text-xs text-slate-400 ml-auto">${esc(e.code)}</span></label>`).join('')}
      </div>
      <div class="flex justify-end gap-2"><button class="${btnS}" id="bCancel">Cancel</button><button class="${btnP}" id="bGo">Mark selected</button></div>`);
    m.el.querySelector('#bCancel').onclick=()=>m.close();
    m.el.querySelector('#bGo').onclick=async()=>{
      const ids=[...m.el.querySelectorAll('[name="bemp"]:checked')].map(x=>x.value);
      if(!ids.length){ toast('Select at least one employee','warn'); return; }
      const r=await API.call('bulkMark',formVal(m.el,'date'),ids,formVal(m.el,'type'),formVal(m.el,'note'));
      m.close(); toast(r.count+' punch(es) marked','success'); load();
    };
  };
};
})();

  if(tab==='types'){
    body.innerHTML=tableHTML([
      {label:'Type', get:t=>`<span class="font-semibold text-slate-700">${esc(t.name)}</span>`},
      {label:'Annual quota', num:1, get:t=>t.quota?fmtNum(t.quota)+' days':'—'},
      {label:'Paid', get:t=>t.paid?badge('Paid','emerald'):badge('Unpaid','slate')},
      {label:'', get:t=>canEdit?`<div class="flex gap-1 justify-end"><button class="${btnS} !px-3 !py-1.5 !text-xs" data-te="${t.id}">Edit</button><button class="${btnS} !px-3 !py-1.5 !text-xs !text-red-600" data-td="${t.id}">Delete</button></div>`:''},
    ], types, {empty:'No leave types yet.'});
    body.querySelectorAll('[data-te]').forEach(b=>b.onclick=()=>typeEditor(types.find(t=>t.id===b.dataset.te)));
    body.querySelectorAll('[data-td]').forEach(b=>b.onclick=async()=>{
      if(!await confirmDlg('Delete leave type?','Existing requests keep their type name.','Delete')) return;
      await API.call('deleteLeaveType',b.dataset.td); toast('Deleted','success'); App.route();
    });
    const tb=document.getElementById(cid+'-type'); if(tb) tb.onclick=()=>typeEditor(null);
  }
  else if(tab==='balances'){
    const rows=await API.call('getLeaveBalances',new Date().getFullYear());
    body.innerHTML=tableHTML([
      {label:'Employee', get:r=>`<div><div class="font-medium text-slate-700">${esc(r.employeeName)}</div><div class="text-xs text-slate-400">${esc(r.employeeCode)}</div></div>`},
      ...types.map(t=>({label:t.name, get:r=>{ const x=(r.types||[]).find(y=>y.typeId===t.id)||{used:0,quota:t.quota,left:t.quota};
        return `<div class="text-center"><div class="text-sm font-semibold tabular-nums ${x.left<=2&&x.quota?'text-amber-600':'text-slate-700'}">${x.left}<span class="text-slate-400 font-normal">/${x.quota||'∞'}</span></div><div class="text-[10px] text-slate-400">left</div></div>`;}})),
    ], rows, {empty:'No employees.'});
  }
  else if(tab==='holidays'){
    const rows=await API.call('listHolidays');
    body.innerHTML=tableHTML([
      {label:'Date', get:h=>`<span class="tabular-nums font-medium">${fmtDate(h.date)}</span>`},
      {label:'Holiday', get:h=>`<span class="font-medium text-slate-700">${esc(h.name)}</span>`},
      {label:'', get:h=>canEdit?`<div class="flex justify-end"><button class="${btnS} !px-3 !py-1.5 !text-xs !text-red-600" data-hd="${h.id}">Delete</button></div>`:''},
    ], rows, {empty:'No holidays defined.'});
    body.querySelectorAll('[data-hd]').forEach(b=>b.onclick=async()=>{
      await API.call('deleteHoliday',b.dataset.hd); toast('Holiday removed','success'); App.route();
    });
    const hb=document.getElementById(cid+'-holiday');
    if(hb) hb.onclick=()=>{
      const m=modal('Add Holiday',`${field('Date','date',{type:'date',value:todayISO(),req:true})}${field('Name','name',{req:true,ph:'e.g. Eid ul-Fitr'})}
        <div class="flex justify-end gap-2 mt-5"><button class="${btnS}" id="hCancel">Cancel</button><button class="${btnP}" id="hSave">Save</button></div>`);
      m.el.querySelector('#hCancel').onclick=()=>m.close();
      m.el.querySelector('#hSave').onclick=async()=>{
        if(!formVal(m.el,'date')||!formVal(m.el,'name')){toast('Date and name required','warn');return;}
        await API.call('saveHoliday',collectForm(m.el)); m.close(); toast('Holiday added','success'); App.route();
      };
    };
  }
  else{
    const rows=await API.call('listLeaveRequests');
    body.innerHTML=tableHTML([
      {label:'Employee', get:r=>`<span class="font-medium text-slate-700">${esc(r.employeeName)}</span>`},
      {label:'Type', get:r=>esc(r.typeName)},
      {label:'From', get:r=>fmtDate(r.from)},
      {label:'To', get:r=>fmtDate(r.to)},
      {label:'Days', num:1, get:r=>fmtNum(r.days)},
      {label:'Reason', get:r=>`<span class="text-slate-500 text-xs">${esc(r.reason||'—')}</span>`},
      {label:'Status', get:r=>r.status==='pending'?badge('Pending','amber'):r.status==='approved'?badge('Approved','emerald'):badge('Rejected','red')},
      {label:'', get:r=>r.status==='pending'&&canEdit?`<div class="flex gap-1 justify-end">
        <button class="${btnS} !px-3 !py-1.5 !text-xs !text-emerald-700" data-ok="${r.id}">Approve</button>
        <button class="${btnS} !px-3 !py-1.5 !text-xs !text-red-600" data-no="${r.id}">Reject</button></div>`:`<span class="text-xs text-slate-400">${esc(r.decidedBy||'')}</span>`},
    ], rows, {empty:'No leave requests.'});
    body.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{ await API.call('decideLeave',b.dataset.ok,'approved'); toast('Leave approved','success'); App.route(); });
    body.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{ await API.call('decideLeave',b.dataset.no,'rejected'); toast('Leave rejected','success'); App.route(); });
  }

  function typeEditor(t){
    const isNew=!t; t=t||{name:'',quota:0,paid:true};
    const m=modal(isNew?'Add Leave Type':'Edit Leave Type',`
      ${field('Type name','name',{value:t.name,req:true})}
      <div class="grid grid-cols-2 gap-4 mt-4">
        ${field('Annual quota (days)','quota',{value:t.quota,type:'number',min:0})}
        <div class="flex items-end pb-2.5">${field('Paid leave','paid',{type:'checkbox',value:t.paid})}</div>
      </div>
      <div class="flex justify-end gap-2 mt-6"><button class="${btnS}" id="tCancel">Cancel</button><button class="${btnP}" id="tSave">Save</button></div>`);
    m.el.querySelector('#tCancel').onclick=()=>m.close();
    m.el.querySelector('#tSave').onclick=async()=>{
      const data=collectForm(m.el); if(!data.name){toast('Name required','warn');return;}
      await API.call('saveLeaveType',{...(isNew?{}:{id:t.id}),...data}); m.close(); toast('Leave type saved','success'); App.route();
    };
  }

  document.getElementById(cid+'-req').onclick=()=>{
    const m=modal('Request Leave',`
      <div class="grid grid-cols-2 gap-4">
        ${field('Employee','employeeId',{type:'select',options:emps.filter(e=>e.active).map(e=>({value:e.id,label:e.name}))})}
        ${field('Leave type','typeId',{type:'select',options:types.map(t=>({value:t.id,label:t.name+' ('+t.quota+'d/yr)'}))})}
        ${field('From','from',{type:'date',value:todayISO(),req:true})}
        ${field('To','to',{type:'date',value:todayISO(),req:true})}
        <div class="col-span-2">${field('Reason','reason',{type:'textarea',ph:'Brief reason for leave'})}</div>
      </div>
      <div class="flex justify-end gap-2 mt-6"><button class="${btnS}" id="lCancel">Cancel</button><button class="${btnP}" id="lSend">Submit request</button></div>`);
    m.el.querySelector('#lCancel').onclick=()=>m.close();
    m.el.querySelector('#lSend').onclick=async()=>{
      const d=collectForm(m.el);
      if(!d.from||!d.to){toast('Dates required','warn');return;}
      await API.call('requestLeave',d.employeeId,d.typeId,d.from,d.to,d.reason);
      m.close(); toast('Leave request submitted','success'); App.route();
    };
  };
};
})();


/* ===== 90_overtime.js ===== */
/* 90_overtime.js — overtime request list with approve/revoke. */
(function(){
'use strict';

App.nav.push({group:'PEOPLE', path:'#/overtime', label:'Overtime', icon:'overtime', perm:'overtime'});

App.routes['#/overtime'] = async (el)=>{
  const cid=uid('ot');
  const canEdit=perm('overtime','edit');
  el.innerHTML=pageHead('Overtime','Extra hours worked beyond shift',
    `<button class="${btnP}" id="${cid}-add">+ Log Overtime</button>`)+
  `<div class="flex gap-2 mb-5">
    <select id="${cid}-f" class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-teal-500/40 focus:outline-none">
      <option value="">All statuses</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option>
    </select>
  </div><div id="${cid}-body"></div>`;
  const body=document.getElementById(cid+'-body');
  const fEl=document.getElementById(cid+'-f');
  const emps=await API.call('listEmployees').catch(()=>[]);

  async function load(){
    const rows=await API.call('listOvertime',fEl.value||'');
    const totalHrs=rows.reduce((a,r)=>a+Number(r.hours||0),0);
    const totalAmt=rows.filter(r=>r.status==='approved').reduce((a,r)=>a+Number(r.amount||0),0);
    body.innerHTML=`
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-5">
        ${statCard('Requests',fmtNum(rows.length),'In this view','violet',App.ICONS.overtime,rows.length)}
        ${statCard('Hours logged',fmtNum(totalHrs),'Total hours','blue',App.ICONS.shifts,totalHrs)}
        ${statCard('Approved payout',fmt(totalAmt),'Approved only','emerald',App.ICONS.payroll,Math.round(totalAmt),'Rs ')}
        ${statCard('Pending',fmtNum(rows.filter(r=>r.status==='pending').length),'Awaiting decision','amber',App.ICONS.leave,rows.filter(r=>r.status==='pending').length)}
      </div>`+tableHTML([
      {label:'Date', get:r=>`<span class="tabular-nums">${fmtDate(r.date)}</span>`},
      {label:'Employee', get:r=>`<span class="font-medium text-slate-700">${esc(r.employeeName)}</span>`},
      {label:'Hours', num:1, get:r=>`<span class="tabular-nums font-semibold">${r.hours}</span>`},
      {label:'Rate', num:1, get:r=>`<span class="tabular-nums">${fmt(r.rate)}/hr</span>`},
      {label:'Amount', num:1, get:r=>`<span class="tabular-nums font-semibold text-slate-800">${fmt(r.amount)}</span>`},
      {label:'Reason', get:r=>`<span class="text-slate-500 text-xs">${esc(r.reason||'—')}</span>`},
      {label:'Status', get:r=>r.status==='pending'?badge('Pending','amber'):r.status==='approved'?badge('Approved','emerald'):badge('Rejected','red')},
      {label:'', get:r=>r.status==='pending'&&canEdit?`<div class="flex gap-1 justify-end">
        <button class="${btnS} !px-3 !py-1.5 !text-xs !text-emerald-700" data-ok="${r.id}">Approve</button>
        <button class="${btnS} !px-3 !py-1.5 !text-xs !text-red-600" data-no="${r.id}">Reject</button></div>`
        :(r.status==='approved'&&canEdit?`<div class="flex justify-end"><button class="${btnS} !px-3 !py-1.5 !text-xs" data-revoke="${r.id}">Revoke</button></div>`:`<span class="text-xs text-slate-400">${esc(r.approvedBy||'')}</span>`)},
    ], rows, {empty:'No overtime records.'});
    body.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{ await API.call('decideOvertime',b.dataset.ok,'approved'); toast('Overtime approved','success'); load(); });
    body.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{ await API.call('decideOvertime',b.dataset.no,'rejected'); toast('Overtime rejected','success'); load(); });
    body.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=async()=>{ await API.call('decideOvertime',b.dataset.revoke,'rejected'); toast('Approval revoked','success'); load(); });
  }
  fEl.onchange=load;
  document.getElementById(cid+'-add').onclick=()=>{
    const m=modal('Log Overtime',`
      <div class="grid grid-cols-2 gap-4">
        ${field('Employee','employeeId',{type:'select',options:emps.filter(e=>e.active).map(e=>({value:e.id,label:e.name}))})}
        ${field('Date','date',{type:'date',value:todayISO(),req:true})}
        ${field('Hours','hours',{type:'number',value:2,min:0.5,step:0.5,req:true})}
        ${field('Rate (Rs/hr)','rate',{type:'number',value:250,min:0,req:true})}
        <div class="col-span-2">${field('Reason','reason',{type:'textarea',ph:'Why was overtime needed?'})}</div>
      </div>
      <div class="flex justify-end gap-2 mt-6"><button class="${btnS}" id="oCancel">Cancel</button><button class="${btnP}" id="oSave">Save</button></div>`);
    m.el.querySelector('#oCancel').onclick=()=>m.close();
    m.el.querySelector('#oSave').onclick=async()=>{
      const d=collectForm(m.el);
      await API.call('requestOvertime',d.employeeId,d.date,d.hours,d.rate,d.reason);
      m.close(); toast('Overtime logged','success'); load();
    };
  };
  await load();
};
})();

</script>
</body>
</html>
