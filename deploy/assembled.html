<style>
  body{font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .font-display{font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;}
  ::selection{background:#99f6e4;color:#134e4a;}
  @keyframes fadeUp{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes scaleIn{from{transform:scale(.96) translateY(8px);opacity:0}to{transform:none;opacity:1}}
  @keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
  @keyframes shimmer{from{background-position:-400px 0}to{background-position:400px 0}}
  @keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.15)}}
  @keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.4}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .anim-fadeUp{animation:fadeUp .35s cubic-bezier(.21,.9,.35,1) both}
  .anim-fadeIn{animation:fadeIn .25s ease both}
  .anim-scaleIn{animation:scaleIn .22s cubic-bezier(.21,.9,.35,1) both}
  .shimmer{background:linear-gradient(90deg,#f1f5f9 25%,#e8eef4 50%,#f1f5f9 75%);background-size:800px 100%;animation:shimmer 1.3s infinite linear}
  .blob{animation:drift 9s ease-in-out infinite}
  .pulse-dot{animation:pulseDot 1.6s ease-in-out infinite}
  .spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
  kbd.k{font-family:'Inter',sans-serif;font-size:10px;background:#f1f5f9;border:1px solid #e2e8f0;border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:#64748b;font-weight:600}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#94a3b8;border:2px solid transparent;background-clip:content-box}
  input[type=number]{-moz-appearance:textfield}
  input[type=number]::-webkit-inner-spin-button{opacity:1}
  .card-hover{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
  .card-hover:hover{transform:translateY(-2px);box-shadow:0 12px 24px -12px rgba(15,23,42,.18)}
  .login-pattern{background-image:radial-gradient(rgba(255,255,255,.14) 1.5px,transparent 1.5px);background-size:22px 22px}
  .leaflet-container{font-family:'Plus Jakarta Sans',sans-serif;z-index:0;border-radius:1rem;}
  .leaflet-pane{z-index:2!important;}
  .leaflet-top,.leaflet-bottom{z-index:3!important;}
  @media print{ aside,header,#toasts{display:none!important} }
</style>

/* ===== header language toggle: injected at runtime (11_layout.js untouched) ===== */
function i18nPaintToggle(){
  var wrap=document.getElementById('i18nToggle');
  if(!wrap) return;
  var btns=wrap.querySelectorAll('button');
  for(var i=0;i<btns.length;i++){
    var b=btns[i], on=b.getAttribute('data-lang')===I18N.lang;
    b.className='px-2.5 py-1.5 transition-colors '+(on?'bg-teal-600 text-white':'text-slate-500 hover:bg-slate-100');
    b.setAttribute('aria-pressed',on?'true':'false');
  }
}
function i18nMakeBtn(langCode,label){
  var b=document.createElement('button');
  b.type='button'; b.textContent=label;
  b.setAttribute('data-lang',langCode);
  b.title=(langCode==='ur'?'زبان':'Language');
  b.onclick=function(){ I18N.setLang(langCode); };
  return b;
}
function i18nMountToggle(){
  if(document.getElementById('i18nToggle')){ i18nPaintToggle(); return; }
  var hdr=document.querySelector('header');
  if(!hdr) return;
  var wrap=document.createElement('div');
  wrap.id='i18nToggle';
  wrap.className='flex items-center rounded-xl border border-slate-200 overflow-hidden text-xs font-bold shrink-0 bg-white';
  wrap.setAttribute('role','group');
  wrap.setAttribute('aria-label','Language');
  wrap.appendChild(i18nMakeBtn('en','EN'));
  wrap.appendChild(i18nMakeBtn('ur','اردو'));
  var av=document.getElementById('avatarBtn');
  var anchor=av?av.parentElement:null;
  if(anchor&&anchor.parentElement===hdr) hdr.insertBefore(wrap,anchor);
  else hdr.appendChild(wrap);
  i18nPaintToggle();
}
/* refresh header chrome strings after a language switch (shellHTML runs once) */
function i18nRefreshChrome(){
  var pb=document.getElementById('punchBtn');
  if(pb){ for(var i=0;i<pb.childNodes.length;i++){ var n=pb.childNodes[i]; if(n.nodeType===3&&n.nodeValue.trim()) n.nodeValue=I18N.t('c4.layout.punchInOut'); } }
  var ft=document.querySelector('footer');
  if(ft) ft.textContent=I18N.t('c4.layout.footer');
  var si=document.getElementById('stopImp');
  if(si){
    si.textContent=I18N.t('c4.layout.stopImpersonation');
    var sp=si.previousElementSibling;
    if(sp){ var nm=(window.Session&&window.Session.user&&window.Session.user.name)||''; sp.textContent=I18N.t('c4.layout.impersonating').replace('{name}',nm); }
  }
  var lo=document.getElementById('logout');
  if(lo){ lo.title=I18N.t('c4.layout.signOut'); lo.setAttribute('aria-label',I18N.t('c4.layout.signOut')); }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',i18nMountToggle);
else i18nMountToggle();
/* shellHTML rebuilds <body> on login/logout/boot — re-mount when a header appears */
if(window.MutationObserver){
  try{
    new MutationObserver(function(){ i18nMountToggle(); }).observe(document.documentElement,{childList:true,subtree:true});
  }catch(e){}
}

/* ===== central re-render hook consumed by I18N.setLang =====
   Uses the app's central router when present; otherwise re-triggers the
   current hash route so every view (nav via labelKey, page chrome) re-renders
   in the new language. */
window.rerenderAll=function(){
  i18nPaintToggle();
  try{ i18nRefreshChrome(); }catch(e){}
  if(window.App&&typeof window.App.route==='function'){ window.App.route(); return; }
  var cur=location.hash||'#/dashboard';
  location.hash='#/i18n-'+Date.now();
  location.hash=cur;
};
})();

(function(){
'use strict';
const G = window;
/* GAS HtmlService strips double-slash to end-of-line inside served scripts,
   so a URL must never contain a literal double-slash inside a JS string.
   Build HTTPS by concatenation only. */
G.HTTPS = 'https:' + '/' + '/';

/* ---------- element builder ---------- */
function h(tag, attrs, ...children){
  const el = document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v = attrs[k];
    if(v==null) continue;
    if(k==='class') el.className=v;
    else if(k==='html') el.innerHTML=v;
    else if(k.startsWith('on')&&typeof v==='function') el.addEventListener(k.slice(2),v);
    else if(k==='value') el.value=v;
    else el.setAttribute(k,v);
  }
  for(const c of children.flat(9)){
    if(c==null||c===false) continue;
    el.append(c.nodeType?c:document.createTextNode(String(c)));
  }
  return el;
}
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- formatting ---------- */
function fmt(n){ n=Number(n)||0; return 'Rs '+n.toLocaleString('en-PK',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtNum(n){ return (Number(n)||0).toLocaleString('en-PK'); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?String(iso):d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtTime(t){ if(!t) return '—'; const s=String(t).slice(0,5); return s; }
function fmtDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?String(iso):d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function monthISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function addDays(iso,n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysUntil(iso){ if(!iso) return 99999; return Math.ceil((new Date(iso+'T00:00:00')-Date.now())/86400000); }

/* ---------- geo ---------- */
function haversineM(lat1,lon1,lat2,lon2){
  if(lat1==null||lon1==null||lat2==null||lon2==null) return null;
  const R=6371000, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

/* ---------- toast ---------- */
function toast(msg,type='info'){
  let wrap=document.getElementById('toasts');
  if(!wrap){ wrap=h('div',{id:'toasts',class:'fixed top-4 right-4 z-[9999] space-y-2'}); document.body.append(wrap); }
  const dot={info:'bg-slate-400',success:'bg-emerald-500',error:'bg-red-500',warn:'bg-amber-500'};
  const t=h('div',{class:'bg-white text-slate-800 pl-3 pr-4 py-3 rounded-xl shadow-xl border border-slate-200/80 text-sm max-w-sm flex items-center gap-2.5 anim-slideIn'},
    h('span',{class:`w-2 h-2 rounded-full shrink-0 ${dot[type]||dot.info}`}), h('span',{html:msg}));
  t.style.animation='slideIn .25s ease';
  wrap.append(t); setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),320);},3200);
}

/* ---------- modal ---------- */
function modal(title, bodyHTML, opts={}){
  const ov=h('div',{class:'fixed inset-0 z-[9000] bg-slate-900/50 backdrop-blur-[2px] flex items-center justify-center p-4 anim-fadeIn'});
  const box=h('div',{class:`bg-white rounded-2xl shadow-2xl w-full ${opts.wide?'max-w-4xl':'max-w-lg'} max-h-[92vh] flex flex-col anim-scaleIn`});
  const head=h('div',{class:'flex items-center justify-between px-6 py-4 border-b border-slate-100'},
    h('h3',{class:'font-display font-bold text-lg text-slate-800'},title),
    h('button',{class:'w-8 h-8 rounded-full text-slate-400 hover:text-slate-700 hover:bg-slate-100 flex items-center justify-center text-xl leading-none',onclick:()=>close()},'×'));
  const body=h('div',{class:'p-6 overflow-y-auto',html:bodyHTML});
  box.append(head,body); ov.append(box); document.body.append(ov);
  function close(){ ov.remove(); document.removeEventListener('keydown',onKey); }
  function onKey(e){ if(e.key==='Escape') close(); }
  document.addEventListener('keydown',onKey);
  ov.addEventListener('mousedown',e=>{ if(e.target===ov) close(); });
  return {el:body, box, close};
}

function animateCounters(root){
  (root||document).querySelectorAll('[data-countup]').forEach(el=>{
    const target=parseFloat(el.dataset.countup), prefix=el.dataset.prefix||'';

    const t0=performance.now(), dur=900;
    (function tick(t){ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);

  });

function toCSV(rows){
  if(!rows.length) return '';

/* Leaflet map helper: builds a map with the OSM tile layer (URL concatenated
   to avoid a literal double-slash in the served script). */
function buildMap(el, center, zoom){
  if(typeof L==='undefined'){
    el.innerHTML='<div class="h-full min-h-[200px] flex items-center justify-center text-sm text-slate-400 text-center p-6">'+I18N.t('c4.utils.mapUnavailable')+'</div>';

  }
  const map=L.map(el,{scrollWheelZoom:true}).setView(center,zoom||14);
  L.tileLayer('https:'+'//tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'Map data © OpenStreetMap contributors', maxZoom:19
  }).addTo(map);
  return map;
}

/* ===== 01_api.js ===== */
/* 01_api.js — API.call(fnName, ...args) → Promise.
   Uses google.script.run.__api when deployed in Apps Script, else the local MockAPI. */
(function(){
'use strict';

const isGAS = !!(window.google && google.script && google.script.run);

const API = {
  isGAS,
  call(fn, ...args){
    if(isGAS){
      // All server calls go through the __api dispatcher, which validates the
      // login token (CacheService) and routes to the matching API function.
      const userJson = JSON.stringify(Session.user||null);
      const argsJson = JSON.stringify(args);
      return new Promise((resolve,reject)=>{
        google.script.run
          .withSuccessHandler(r=>resolve(r))
          .withFailureHandler(e=>reject(new Error((e&&e.message)||I18N.t('c4.api.serverFailed'))))
          .__api(fn, userJson, argsJson);
      });
    }
    // local mock path
    return new Promise((resolve,reject)=>{
      setTimeout(()=>{
        try{
          const f = MockAPI[fn];
          if(typeof f!=='function') throw new Error('Unknown API function: '+fn);
          resolve(f(...args));
        }catch(e){ reject(e instanceof Error?e:new Error(String(e))); }
      }, 30);
    });
  }
};

/* session persisted in localStorage 'ams_session' */
const SKEY='ams_session', BKEY='ams_bootstrap';
const Session = {
  get user(){ try{return JSON.parse(localStorage.getItem(SKEY)||'null');}catch(e){return null;} },
  set user(u){ u?localStorage.setItem(SKEY,JSON.stringify(u)):localStorage.removeItem(SKEY); },
  get bootstrap(){ try{return JSON.parse(localStorage.getItem(BKEY)||'null');}catch(e){return null;} },
  set bootstrap(b){ b?localStorage.setItem(BKEY,JSON.stringify(b)):localStorage.removeItem(BKEY); },
  get savedUser(){ try{return JSON.parse(localStorage.getItem('ams_saved_user')||'null');}catch(e){return null;} },
  set savedUser(u){ u?localStorage.setItem('ams_saved_user',JSON.stringify(u)):localStorage.removeItem('ams_saved_user'); },
  get impersonating(){ return !!this.savedUser; },
  clear(){ localStorage.removeItem(SKEY); localStorage.removeItem(BKEY); localStorage.removeItem('ams_saved_user'); }
};

function perm(module, action='view'){
  const b=Session.bootstrap;
  if(!b||!b.permissions) return false;
  if(b.permissions.all) return true; /* superadmin: real backend returns {all:true} */
  const p=b.permissions[module];
  if(!p) return false;
  return !!p[action];
}

window.API=API; window.Session=Session; window.perm=perm;
})();

/* deterministic pseudo-random for stable demo data */
let _s=42; function rnd(){ _s=(_s*1103515245+12345)%2147483648; return _s/2147483648; }

/* seed attendance for the last 14 days + today */
(function seedAttendance(){
  const emps=DB.employees.filter(e=>e.active);
  const jitter=(base,amt)=>(base+(rnd()-0.5)*amt).toFixed(6);
  for(let d=14; d>=0; d--){
    const date=addDays(todayISO(),-d);
    const dt=new Date(date+'T12:00:00');
    if(dt.getDay()===5) continue; /* Friday off for demo */
    emps.forEach((e,i)=>{
      if(rnd()<0.08) return; /* absent */
      const siteId=(DB.siteEmployees.find(s=>s.employeeId===e.id)||{}).siteId;
      const site=DB.sites.find(s=>s.id===siteId)||DB.sites[0];
      const ooz=rnd()<0.05;
      const lat=ooz?String(Number(site.lat)+0.02):jitter(site.lat,0.0012);
      const lng=ooz?String(Number(site.lng)+0.02):jitter(site.lng,0.0012);
      const dist=ooz?Math.round(1800+rnd()*900):Math.round(10+rnd()*120);
      const inMin=8*60+Math.round((rnd()-0.35)*40);
      const outMin=17*60+Math.round((rnd()-0.5)*50);
      const hhmm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
      DB.attendance.push({id:uid('p'), employeeId:e.id, date, type:'in', time:hhmm(inMin), lat, lng, selfie:null, siteId:site.id, distanceM:dist, outOfZone:ooz, source:rnd()<0.7?'gps':'zkteco', deviceId:e.deviceId||'', syncedAt:date+' '+hhmm(inMin), note:''});
      DB.attendance.push({id:uid('p'), employeeId:e.id, date, type:'out', time:hhmm(outMin), lat, lng, selfie:null, siteId:site.id, distanceM:dist, outOfZone:ooz, source:rnd()<0.7?'gps':'zkteco', deviceId:e.deviceId||'', syncedAt:date+' '+hhmm(outMin), note:''});
    });
  }
  DB.rosters=DB.employees.slice(0,8).map(e=>({id:uid('r'), date:todayISO(), employeeId:e.id, shiftId:'sh1', siteId:(DB.siteEmployees.find(s=>s.employeeId===e.id)||{}).siteId||'s1'}));
})();

/* ---------------- helpers ---------------- */
function empById(id){ return DB.employees.find(e=>e.id===id)||{}; }
function siteById(id){ return DB.sites.find(s=>s.id===id)||{}; }
function nearestSite(lat,lng,empId){
  const assigned=DB.siteEmployees.filter(s=>s.employeeId===empId).map(s=>s.siteId);
  const pool=(assigned.length?DB.sites.filter(s=>assigned.includes(s.id)&&s.active):DB.sites.filter(s=>s.active));
  let best=null,bestD=Infinity;
  pool.forEach(s=>{ const d=haversineM(lat,lng,Number(s.lat),Number(s.lng)); if(d!=null&&d<bestD){bestD=d;best=s;} });
  return {site:best, distanceM:best?Math.round(bestD):null};
}
function dupGuard(employeeId,type){
  const now=Date.now();
  return DB.attendance.find(p=>{
    if(p.employeeId!==employeeId||p.type!==type) return false;
    const t=new Date(p.date+'T'+(p.time||'00:00')+':00').getTime();
    const diff=now-t;
    return diff>=0&&diff<5*60*1000;
  });
}

  /* Overtime */
  listOvertime(status){
    let rows=DB.overtime.slice().sort((a,b)=>b.date.localeCompare(a.date));
    if(status) rows=rows.filter(o=>o.status===status);
    return rows.map(o=>({...o, employeeName:empById(o.employeeId).name, amount:o.hours*o.rate}));
  },
  requestOvertime(employeeId, date, hours, rate, reason){
    const o={id:uid('ot'), employeeId, date, hours:Number(hours), rate:Number(rate), reason:reason||'', status:'pending', approvedBy:''};
    DB.overtime.push(o); return o;
  },
  decideOvertime(id, decision){
    const o=DB.overtime.find(x=>x.id===id); if(!o) throw new Error('Request not found');
    o.status=decision; o.approvedBy=(Session.user||{}).name||'Admin'; return o;
  },

  /* Payroll */
  listPayComponents(){ return DB.payComponents.map(c=>({...c})); },
  savePayComponent(c){
    if(c.id){ const x=DB.payComponents.find(y=>y.id===c.id); Object.assign(x,{name:c.name,kind:c.kind,amount:Number(c.amount)||0,appliesTo:c.appliesTo||'all',approved:!!c.approved}); return x; }
    const x={id:uid('pc'), name:c.name, kind:c.kind, amount:Number(c.amount)||0, appliesTo:c.appliesTo||'all', approved:!!c.approved}; DB.payComponents.push(x); return x;
  },
  deletePayComponent(id){ DB.payComponents=DB.payComponents.filter(c=>c.id!==id); return {ok:true}; },
  runPayroll(month, employeeIds){
    const allows=DB.payComponents.filter(c=>c.kind==='allowance'&&c.approved);
    const deducts=DB.payComponents.filter(c=>c.kind==='deduction'&&c.approved);
    const run={id:uid('pr'), month, createdAt:fmtDateTime(new Date().toISOString()), createdBy:(Session.user||{}).name||'Admin', status:'finalized'};
    DB.payrollRuns.push(run);
    (employeeIds||[]).forEach(eid=>{
      const e=empById(eid); if(!e.id) return;
      const allowances=allows.reduce((a,c)=>a+c.amount,0);
      const deductions=deducts.reduce((a,c)=>a+c.amount,0);
      const adv=DB.advances.find(a=>a.employeeId===eid&&a.status==='open');
      const installment=adv?Math.round(adv.amount/adv.installments):0;
      if(adv){ adv.recovered+=installment; if(adv.recovered>=adv.amount){adv.status='closed';} }
      DB.payslips.push({id:uid('ps'), runId:run.id, employeeId:eid, salary:e.salary, allowances, deductions, advanceRecovery:installment, net:e.salary+allowances-deductions-installment, paid:false});
    });
    return run;
  },
  listPayrollRuns(){ return DB.payrollRuns.slice().sort((a,b)=>b.month.localeCompare(a.month)).map(r=>({...r, slipCount:DB.payslips.filter(p=>p.runId===r.id).length, totalNet:DB.payslips.filter(p=>p.runId===r.id).reduce((a,p)=>a+p.net,0)})); },
  listPayslips(runId){
    const run=DB.payrollRuns.find(r=>r.id===runId)||{};
    return DB.payslips.filter(p=>String(p.runId)===String(runId)).map(p=>{
      const e=empById(p.employeeId);
      return {...p, employeeName:e.name||'?', employeeCode:e.code||'', month:run.month||''};
    }).sort((a,b)=>String(a.employeeName).localeCompare(String(b.employeeName)));
  },
  getPayslip(id){
    const p=DB.payslips.find(x=>x.id===id);
    if(!p) throw new Error('Payslip not found');
    const run=DB.payrollRuns.find(r=>r.id===p.runId)||{};
    const e=empById(p.employeeId);
    return {payslip:{...p}, employee:{...e}, run:{...run}, company:DB.settings.companyName||''};
  },
  markPayslipPaid(id){ const p=DB.payslips.find(x=>x.id===id); if(p) p.paid=true; return {ok:true}; },
  listAdvances(){ return DB.advances.map(a=>({...a, employeeName:empById(a.employeeId).name, balance:a.amount-a.recovered})); },
  grantAdvance(employeeId, amount, installments){
    const a={id:uid('a'), employeeId, date:todayISO(), amount:Number(amount), installments:Number(installments)||1, recovered:0, status:'open'};
    DB.advances.push(a); return a;
  },
  finalSettlement(employeeId){
    const e=empById(employeeId); if(!e.id) throw new Error('Employee not found');
    const advOpen=DB.advances.filter(a=>a.employeeId===employeeId&&a.status==='open');
    const advDue=advOpen.reduce((a,x)=>a+(x.amount-x.recovered),0);
    const pendingOT=DB.overtime.filter(o=>o.employeeId===employeeId&&o.status==='approved').reduce((a,o)=>a+o.hours*o.rate,0);
    const daysWorked=new Date().getDate();
    const proRata=Math.round(e.salary/30*daysWorked);
    return {employee:e, proRataSalary:proRata, pendingOvertime:pendingOT, advanceDue:advDue, netPayable:proRata+pendingOT-advDue, advances:advOpen};
  },
  listContractors(){ return DB.contractors.map(c=>({...c, billed:DB.contractorBills.filter(b=>b.contractorId===c.id).reduce((a,b)=>a+b.amount,0)})); },
  saveContractor(c){
    if(c.id){ const x=DB.contractors.find(y=>y.id===c.id); Object.assign(x,{name:c.name,company:c.company,phone:c.phone,rate:Number(c.rate)||0,active:c.active!==false}); return x; }
    const x={id:uid('ct'), name:c.name, company:c.company||c.name, phone:c.phone||'', rate:Number(c.rate)||0, active:true}; DB.contractors.push(x); return x;
  },
  deleteContractor(id){ DB.contractors=DB.contractors.filter(c=>c.id!==id); return {ok:true}; },
  listContractorBills(){ return DB.contractorBills.map(b=>({...b, contractorName:(DB.contractors.find(c=>c.id===b.contractorId)||{}).name||'—'})).sort((a,b)=>b.month.localeCompare(a.month)); },
  saveContractorBill(b){
    if(b.id){ const x=DB.contractorBills.find(y=>y.id===b.id); Object.assign(x,{contractorId:b.contractorId,month:b.month,amount:Number(b.amount)||0,note:b.note||''}); return x; }
    const x={id:uid('cb'), contractorId:b.contractorId, month:b.month, amount:Number(b.amount)||0, status:'pending', note:b.note||''}; DB.contractorBills.push(x); return x;
  },
  decideContractorBill(id, decision){ const b=DB.contractorBills.find(x=>x.id===id); if(b) b.status=decision; return b||{ok:false}; },
  deleteContractorBill(id){ DB.contractorBills=DB.contractorBills.filter(b=>b.id!==id); return {ok:true}; },

  /* Documents */
  listDocuments(){ return DB.documents.map(d=>({...d, employeeName:empById(d.employeeId).name, daysLeft:daysUntil(d.expiryDate)})); },
  saveDocument(d){
    if(d.id){ const x=DB.documents.find(y=>y.id===d.id); Object.assign(x,{employeeId:d.employeeId,title:d.title,expiryDate:d.expiryDate}); return x; }
    const x={id:uid('d'), employeeId:d.employeeId, title:d.title, expiryDate:d.expiryDate}; DB.documents.push(x); return x;
  },
  deleteDocument(id){ DB.documents=DB.documents.filter(d=>d.id!==id); return {ok:true}; },
  getExpiringDocuments(){ return MockAPI.listDocuments().filter(d=>d.daysLeft<=30).sort((a,b)=>a.daysLeft-b.daysLeft); },

  /* Reports */
  attendanceSummary(from, to){
    return DB.employees.filter(e=>e.active).map(e=>{
      const rows=DB.attendance.filter(p=>p.employeeId===e.id&&p.date>=from&&p.date<=to);
      const days=new Set(rows.map(p=>p.date)).size;
      const late=rows.filter(p=>p.type==='in'&&p.time>'08:15').length;
      const ooz=rows.filter(p=>p.outOfZone).length;
      const totalDays=Math.max(1, Math.round((new Date(to)-new Date(from))/86400000)+1);
      return {employeeId:e.id, employeeName:e.name, employeeCode:e.code, present:days, absent:Math.max(0,totalDays-days), late, outOfZone:ooz, pct:Math.round(days/totalDays*100)};
    });
  },
  exportCSV(kind, filters){
    let rows=[], name=kind+'_'+todayISO()+'.csv';
    if(kind==='attendance') rows=MockAPI.listAttendance(filters||{}).map(p=>({date:p.date, employee:p.employeeName, code:p.employeeCode, type:p.type, time:p.time, site:p.siteName, distance_m:p.distanceM, out_of_zone:p.outOfZone?'yes':'no', source:p.source}));
    else if(kind==='employees') rows=MockAPI.listEmployees().map(e=>({code:e.code, name:e.name, department:e.department, designation:e.designation, phone:e.phone, salary:e.salary, join_date:e.joinDate, active:e.active?'yes':'no'}));
    else if(kind==='payroll'){ const f=filters||{}; rows=DB.payslips.filter(p=>!f.runId||p.runId===f.runId).map(p=>{const e=empById(p.employeeId); return {employee:e.name, code:e.code, salary:p.salary, allowances:p.allowances, deductions:p.deductions, advance_recovery:p.advanceRecovery, net:p.net, paid:p.paid?'yes':'no'};}); }
    else if(kind==='leaves') rows=MockAPI.listLeaveRequests().map(r=>({employee:r.employeeName, type:r.typeName, from:r.from, to:r.to, days:r.days, reason:r.reason, status:r.status}));
    return {filename:name, csv:toCSV(rows)};
  },
  getDashboard(){
    const t=todayISO();
    const today=DB.attendance.filter(p=>p.date===t);
    const inToday=today.filter(p=>p.type==='in');
    const total=DB.employees.filter(e=>e.active).length;
    const present=new Set(inToday.map(p=>p.employeeId)).size;
    const late=inToday.filter(p=>p.time>'08:15').length;
    const ooz=today.filter(p=>p.outOfZone).length;
    const trend=[];
    for(let d=13;d>=0;d--){ const date=addDays(t,-d); trend.push({d:date, present:new Set(DB.attendance.filter(p=>p.date===date&&p.type==='in').map(p=>p.employeeId)).size}); }
    return {
      kpis:{presentToday:present, absentToday:Math.max(0,total-present), lateToday:late, outOfZoneToday:ooz, totalEmployees:total, activeSites:DB.sites.filter(s=>s.active).length, pendingLeaves:DB.leaveRequests.filter(r=>r.status==='pending').length, pendingCorrections:DB.corrections.filter(c=>c.status==='pending').length},
      punchesTrend:trend,
      alerts:{
        expiringDocs:MockAPI.getExpiringDocuments().slice(0,5),
        pendingLeaves:MockAPI.listLeaveRequests('pending').slice(0,5),
        pendingCorrections:MockAPI.listCorrections('pending').slice(0,5),
        outOfZoneToday:today.filter(p=>p.outOfZone).slice(0,5).map(p=>({...p, employeeName:empById(p.employeeId).name})),
      },
      recentPunches:DB.attendance.slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).slice(0,8).map(p=>({...p, employeeName:empById(p.employeeId).name, siteName:siteById(p.siteId).name||'—'})),
    };
  },

  /* Settings */
  getSettings(){ return {...DB.settings}; },
  saveSettings(patch){ Object.assign(DB.settings, patch||{}); return {...DB.settings}; },
  backupNow(){ return {url:HTTPS+'drive.google.com/mock-backup-'+Date.now(), name:'Demo Construction Co — backup '+todayISO()+'.xlsx'}; },
  listRolePermissions(){ return JSON.parse(JSON.stringify(DB.rolePermissions)); },
  saveRolePermissions(matrix){ Object.assign(DB.rolePermissions, matrix||{}); return {ok:true}; },

  /* Phase 2: face check-in */
  enrollFace(employeeId, descriptor){ const rec={employeeId:String(employeeId), descriptorJson:JSON.stringify(descriptor), enrolledAt:todayISO(), updatedAt:todayISO()}; const i=DB.faceEnrollments.findIndex(x=>String(x.employeeId)===String(employeeId)); if(i>=0) DB.faceEnrollments[i]={...DB.faceEnrollments[i], descriptorJson:rec.descriptorJson, updatedAt:rec.updatedAt}; else DB.faceEnrollments.push(rec); return {ok:true}; },
  getFaceEnrollment(employeeId){ return DB.faceEnrollments.find(x=>String(x.employeeId)===String(employeeId))||null; },
  resetFaceEnrollment(employeeId){ DB.faceEnrollments=DB.faceEnrollments.filter(x=>String(x.employeeId)!==String(employeeId)); return {ok:true}; },
  punchWithFace(employeeId, type, lat, lng, selfie, deviceId, faceVerified, matchScore){ const r=MockAPI.punch(employeeId, type, lat, lng, selfie, deviceId); const p=DB.attendance.find(x=>x.id===r.punch.id); if(p){ p.faceVerified=faceVerified; p.matchScore=matchScore; } return {...r, faceVerified, matchScore}; },
  /* Phase 2: auto salary */
  listSalaryStructures(){ return DB.salaryStructures.map(s=>({...s, employeeName:(empById(s.employeeId).name||'?')})); },
  saveSalaryStructure(s){ s=s||{}; if(s.id){ const i=DB.salaryStructures.findIndex(x=>x.id===s.id); if(i>=0) DB.salaryStructures[i]={...DB.salaryStructures[i], ...s}; } else { s.id=uid('ss'); DB.salaryStructures.push({...s}); } return {ok:true, id:s.id}; },
  computeMonthlySalary(employeeId, month){ const e=empById(employeeId); const basic=Number(e.salary||60000); const allowances=10000; return {employeeId, month, basic, allowances, gross:basic+allowances, absentDeduction:0, lateDeduction:0, overtimePay:0, net:basic+allowances, daysPresent:22, daysAbsent:0, lateCount:0, overtimeHours:0}; },
  generateMonthlySalaries(month){ const run={id:uid('r'), month, type:'salary', status:'draft', createdAt:todayISO()}; DB.payrollRuns.push(run); const generated=[], skipped=[]; DB.employees.filter(e=>e.active!==false).forEach(e=>{ const c=MockAPI.computeMonthlySalary(e.id, month); const p={id:uid('ps'), runId:run.id, employeeId:e.id, salary:c.basic, allowances:c.allowances, deductions:c.absentDeduction+c.lateDeduction, advanceRecovery:0, net:c.net, paid:false}; DB.payslips.push(p); generated.push({employeeName:e.name, employeeCode:e.code, daysPresent:c.daysPresent, daysAbsent:c.daysAbsent, lateCount:c.lateCount, overtimeHours:c.overtimeHours, net:c.net}); }); return {ok:true, runId:run.id, month, generated, skipped}; },
  getSalaryPayslip(runId, employeeId){ const p=DB.payslips.find(x=>String(x.runId)===String(runId)&&String(x.employeeId)===String(employeeId)); if(!p) throw new Error('Payslip not found'); return MockAPI.getPayslip(p.id); },
  /* Phase 2: alerts */
  sendAlert(opts){ const o=opts||{}; DB.messageLog.push({id:uid('M'), ts:new Date().toISOString(), tenantId:((Session.user||{}).tenantId||''), channel:o.channel||'whatsapp', to:o.to||'', event:o.event||'manual', body:o.body||'', status:'pending-config', error:''}); return {ok:true, status:'pending-config'}; },
  runAlertChecks(){ return {alerts:[]}; },
  checkAbsences(){ return {checked:0, alerts:[]}; },
  alertLeaveDecision(){ return {ok:true}; },
  listMessageLog(){ return DB.messageLog.slice().reverse(); },
  resendAlert(id){ const m=DB.messageLog.find(x=>x.id===id); if(m) m.status='pending-config'; return {ok:true}; },
  testAlert(){ return {ok:true, status:'pending-config'}; },
  /* Phase 2: geofence auto-punch */
  setAutoPunch(employeeId, on){ const f=DB.employeeFlags.find(x=>String(x.employeeId)===String(employeeId)); if(f) f.autoPunch=!!on; else DB.employeeFlags.push({employeeId:String(employeeId), autoPunch:!!on, updatedAt:todayISO()}); return {ok:true, autoPunch:!!on}; },
  getAutoPunch(employeeId){ const f=DB.employeeFlags.find(x=>String(x.employeeId)===String(employeeId)); return {autoPunch:f?!!f.autoPunch:true}; },
  getAssignedGeofences(){ return DB.sites.filter(s=>s.active!==false).map(s=>({siteId:s.id, name:s.name, lat:Number(s.lat), lng:Number(s.lng), radiusM:Number(s.radiusM||150)})); },
  geofencePunch(employeeId, type, lat, lng, deviceId){ return MockAPI.punch(employeeId, type, lat, lng, '', deviceId, 'geofence-auto'); },
  /* Phase 2: HR rules */
  getRules(){ return DB.rules.map(r=>({...r, source:'rule'})); },
  saveRule(key, value){ const r=DB.rules.find(x=>x.key===key); if(r) r.value=String(value); else DB.rules.push({key, value:String(value), valueType:'string', description:''}); return {ok:true}; },
};

window.MockAPI=MockAPI; window.MockDB=DB;
})();

</script>
<script>

/* ===== 100_payroll.js ===== */
/* 100_payroll.js — payroll runs, payslips (view/print), advances, final
   settlement calculator, contractors + bills, pay components. */
(function(){
'use strict';

App.nav.push({group:'MONEY', path:'#/payroll', label:I18N.t('c4.nav.payroll'), labelKey:'c4.nav.payroll', icon:'payroll', perm:'payroll'});

App.routes['#/payroll'] = async (el, params)=>{
  const cid=uid('pay');
  const tab=(params&&params.tab)||'runs';
  const canEdit=perm('payroll','edit');
  el.innerHTML=pageHead('Payroll','Runs, payslips, advances and contractors',
    `${canEdit?`<button class="${btnS}" id="${cid}-adv">Grant Advance</button><button class="${btnP}" id="${cid}-run">Run Payroll</button>`:''}`)+`
  <div class="flex gap-2 mb-5 flex-wrap">
    ${[['runs','Payroll Runs'],['salaries',I18N.t('t2.salaries')],['advances','Advances'],['settlement','Final Settlement'],['contractors','Contractors'],['components','Pay Components']].map(([k,l])=>
      `<a href="#/payroll${k==='runs'?'':'?tab='+k}" class="px-4 py-2 rounded-xl text-sm font-semibold ${tab===k?'bg-teal-600 text-white shadow':'bg-white text-slate-500 border border-slate-200'}">${l}</a>`).join('')}
  </div>
  <div id="${cid}-body"></div>`;
  const body=document.getElementById(cid+'-body');
  const emps=await API.call('listEmployees').catch(()=>[]);

  if(tab==='advances'){
    const rows=await API.call('listAdvances');
    body.innerHTML=tableHTML([
      {label:'Employee', get:a=>`<span class="font-medium text-slate-700">${esc(a.employeeName)}</span>`},
      {label:'Date', get:a=>fmtDate(a.date)},
      {label:'Amount', num:1, get:a=>`<span class="tabular-nums">${fmt(a.amount)}</span>`},
      {label:'Recovered', num:1, get:a=>`<span class="tabular-nums text-emerald-600">${fmt(a.recovered)}</span>`},
      {label:'Balance', num:1, get:a=>`<span class="tabular-nums font-semibold">${fmt(a.balance)}</span>`},
      {label:'Status', get:a=>a.status==='open'?badge('Open','amber'):badge('Closed','slate')},
    ], rows, {empty:'No advances granted.'});
  }
  else if(tab==='settlement'){
    body.innerHTML=`<div class="bg-white rounded-2xl border border-slate-200/70 shadow-[0_1px_3px_rgba(15,23,42,.05)] p-6 max-w-2xl">
      <h3 class="font-display font-bold text-slate-800 mb-1">Final settlement calculator</h3>
      <p class="text-sm text-slate-400 mb-5">Pro-rata salary for the current month + approved overtime − open advance balances.</p>
      ${field('Employee','employeeId',{type:'select',options:emps.filter(e=>e.active).map(e=>({value:e.id,label:e.name+' ('+e.code+')'}))})}
      <button class="${btnP} mt-4" id="${cid}-calc">Calculate</button>
      <div id="${cid}-result" class="mt-5"></div></div>`;
    document.getElementById(cid+'-calc').onclick=async()=>{
      const eid=formVal(body,'employeeId');
      const r=await API.call('finalSettlement',eid);
      document.getElementById(cid+'-result').innerHTML=`
        <div class="rounded-2xl border border-slate-200/70 overflow-hidden">
          <div class="bg-slate-50 px-5 py-3 border-b border-slate-200/60 font-semibold text-slate-700 text-sm">${esc(r.employee.name)} <span class="text-slate-400 font-normal">· ${esc(r.employee.code)}</span></div>
          <div class="divide-y divide-slate-50 text-sm">
            <div class="flex justify-between px-5 py-3"><span class="text-slate-500">Pro-rata salary (this month)</span><span class="tabular-nums font-medium">+ ${fmt(r.proRataSalary)}</span></div>
            <div class="flex justify-between px-5 py-3"><span class="text-slate-500">Approved overtime pending</span><span class="tabular-nums font-medium">+ ${fmt(r.pendingOvertime)}</span></div>
            <div class="flex justify-between px-5 py-3"><span class="text-slate-500">Open advance balance (${r.advances.length} advance${r.advances.length===1?'':'s'})</span><span class="tabular-nums font-medium text-red-600">− ${fmt(r.advanceDue)}</span></div>
            <div class="flex justify-between px-5 py-3.5 bg-teal-50/60"><span class="font-bold text-slate-800">Net payable</span><span class="tabular-nums font-bold text-teal-700 text-base">${fmt(r.netPayable)}</span></div>
          </div></div>`;
    };
  }
  else if(tab==='contractors'){
    const cts=await API.call('listContractors');
    const bills=await API.call('listContractorBills');
    body.innerHTML=`<div class="flex justify-end mb-3">${canEdit?`<button class="${btnS}" id="${cid}-addCt">+ Contractor</button>`:''}</div>`+
    tableHTML([
      {label:'Contractor', get:c=>`<div><div class="font-semibold text-slate-700">${esc(c.name)}</div><div class="text-xs text-slate-400">${esc(c.phone||'')}</div></div>`},
      {label:'Rate', num:1, get:c=>`<span class="tabular-nums">${fmt(c.rate)}/day</span>`},
      {label:'Billed total', num:1, get:c=>`<span class="tabular-nums font-semibold">${fmt(c.billed)}</span>`},
      {label:'Status', get:c=>c.active?badge('Active','emerald'):badge('Inactive','slate')},
      {label:'', get:c=>canEdit?`<div class="flex gap-1 justify-end"><button class="${btnS} !px-3 !py-1.5 !text-xs" data-bill="${c.id}">+ Bill</button><button class="${btnS} !px-3 !py-1.5 !text-xs" data-cedit="${c.id}">Edit</button></div>`:''},
    ], cts, {empty:'No contractors yet.'})+
    `<h3 class="font-display font-bold text-slate-800 mt-8 mb-3">Contractor bills</h3>`+
    tableHTML([
      {label:'Month', get:b=>`<span class="tabular-nums">${esc(b.month)}</span>`},
      {label:'Contractor', get:b=>`<span class="font-medium text-slate-700">${esc(b.contractorName)}</span>`},
      {label:'Note', get:b=>`<span class="text-xs text-slate-500">${esc(b.note||'—')}</span>`},
      {label:'Amount', num:1, get:b=>`<span class="tabular-nums font-semibold">${fmt(b.amount)}</span>`},
      {label:'Status', get:b=>b.status==='pending'?badge('Pending','amber'):b.status==='approved'?badge('Approved','emerald'):badge('Paid','teal')},
      {label:'', get:b=>canEdit&&b.status==='pending'?`<div class="flex gap-1 justify-end"><button class="${btnS} !px-3 !py-1.5 !text-xs !text-emerald-700" data-bok="${b.id}">Approve</button><button class="${btnS} !px-3 !py-1.5 !text-xs" data-bpaid="${b.id}">Mark paid</button></div>`:''},
    ], bills, {empty:'No bills yet.'});
    const addCt=document.getElementById(cid+'-addCt');
    if(addCt) addCt.onclick=()=>contractorEditor(null);
    body.querySelectorAll('[data-cedit]').forEach(b=>b.onclick=()=>contractorEditor(cts.find(c=>c.id===b.dataset.cedit)));
    body.querySelectorAll('[data-bill]').forEach(b=>b.onclick=()=>{
      const c=cts.find(x=>x.id===b.dataset.bill);
      const m=modal('New bill — '+c.name,`
        ${field('Month','month',{type:'month',value:monthISO(),req:true})}
        <div class="grid grid-cols-2 gap-4 mt-4">${field('Amount (Rs)','amount',{type:'number',min:0,req:true})}</div>
        <div class="mt-4">${field('Note','note',{type:'textarea',ph:'Work description'})}</div>
        <div class="flex justify-end gap-2 mt-6"><button class="${btnS}" id="bCancel">Cancel</button><button class="${btnP}" id="bSave">Save bill</button></div>`);
      m.el.querySelector('#bCancel').onclick=()=>m.close();
      m.el.querySelector('#bSave').onclick=async()=>{
        await API.call('saveContractorBill',{contractorId:c.id,month:formVal(m.el,'month'),amount:formNum(m.el,'amount'),note:formVal(m.el,'note')});
        m.close(); toast('Bill saved','success'); App.route();
      };
    });
    body.querySelectorAll('[data-bok]').forEach(b=>b.onclick=async()=>{ await API.call('decideContractorBill',b.dataset.bok,'approved'); toast('Bill approved','success'); App.route(); });
    body.querySelectorAll('[data-bpaid]').forEach(b=>b.onclick=async()=>{ await API.call('decideContractorBill',b.dataset.bpaid,'paid'); toast('Bill marked paid','success'); App.route(); });
  }
  else if(tab==='components'){
    const rows=await API.call('listPayComponents');
    body.innerHTML=(canEdit?`<div class="flex justify-end mb-3"><button class="${btnS}" id="${cid}-addPc">+ Component</button></div>`:'')+tableHTML([
      {label:'Component', get:c=>`<span class="font-medium text-slate-700">${esc(c.name)}</span>`},
      {label:'Kind', get:c=>c.kind==='allowance'?badge('Allowance','emerald'):badge('Deduction','red')},
      {label:'Amount', num:1, get:c=>`<span class="tabular-nums">${fmt(c.amount)}</span>`},
      {label:'Approved', get:c=>c.approved?badge('Yes','teal'):badge('No','slate')},
      {label:'', get:c=>canEdit?`<div class="flex gap-1 justify-end"><button class="${btnS} !px-3 !py-1.5 !text-xs" data-pcedit="${c.id}">Edit</button><button class="${btnS} !px-3 !py-1.5 !text-xs !text-red-600" data-pcdel="${c.id}">Delete</button></div>`:''},
    ], rows, {empty:'No pay components.'});
    const addPc=document.getElementById(cid+'-addPc');
    if(addPc) addPc.onclick=()=>componentEditor(null);
    body.querySelectorAll('[data-pcedit]').forEach(b=>b.onclick=()=>componentEditor(rows.find(c=>c.id===b.dataset.pcedit)));
    body.querySelectorAll('[data-pcdel]').forEach(b=>b.onclick=async()=>{
      if(!await confirmDlg('Delete component?','It will no longer apply to future payroll runs.','Delete')) return;
      await API.call('deletePayComponent',b.dataset.pcdel); toast('Deleted','success'); App.route();
    });
  }
  else if(tab==='salaries'){
    /* Track 2: auto salary from attendance (src/js/155_salary.js) */
    await SalaryUI.renderSalariesTab(body, { emps, canEdit });
  }
  else{
    /* runs */
    const runs=await API.call('listPayrollRuns');
    body.innerHTML=tableHTML([
      {label:'Month', get:r=>`<span class="font-semibold tabular-nums">${esc(r.month)}</span>`},
      {label:'Created', get:r=>`<span class="text-xs text-slate-500">${esc(r.createdAt)} · ${esc(r.createdBy)}</span>`},
      {label:'Payslips', num:1, get:r=>fmtNum(r.slipCount)},
      {label:'Total net', num:1, get:r=>`<span class="tabular-nums font-semibold">${fmt(r.totalNet)}</span>`},
      {label:'Status', get:r=>badge(r.status==='finalized'?'Finalized':'Draft', r.status==='finalized'?'teal':'slate')},
      {label:'', get:r=>`<div class="flex gap-1 justify-end"><button class="${btnS} !px-3 !py-1.5 !text-xs" data-view="${r.id}">View payslips</button></div>`},
    ], runs, {empty:'No payroll runs yet — run your first payroll.'});
    body.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>viewRun(b.dataset.view));
  }

  async function viewRun(runId){
    const runs=await API.call('listPayrollRuns');
    const run=runs.find(r=>r.id===runId);
    const m=modal('Payroll — '+run.month,`<div id="psBody"></div>`,{wide:true});
    const pb=m.el.querySelector('#psBody');
    /* listPayslips returns flat enriched slips for the run (id, employeeName/Code, salary, allowances, deductions, advanceRecovery, net, paid) */
    const slips=await API.call('listPayslips',runId);
    pb.innerHTML=tableHTML([
      {label:'Employee', get:s=>`<div><div class="font-medium text-slate-700">${esc(s.employeeName)}</div><div class="text-xs text-slate-400">${esc(s.employeeCode)}</div></div>`},
      {label:'Salary', num:1, get:s=>`<span class="tabular-nums">${fmt(s.salary)}</span>`},
      {label:'Allow.', num:1, get:s=>`<span class="tabular-nums text-emerald-600">+${fmtNum(s.allowances)}</span>`},
      {label:'Deduct.', num:1, get:s=>`<span class="tabular-nums text-red-500">−${fmtNum(s.deductions)}</span>`},
      {label:'Advance', num:1, get:s=>`<span class="tabular-nums text-amber-600">−${fmtNum(s.advanceRecovery)}</span>`},
      {label:'Net', num:1, get:s=>`<span class="tabular-nums font-bold">${fmt(s.net)}</span>`},
      {label:'', get:s=>`<div class="flex gap-1 justify-end">
        <button class="${btnS} !px-3 !py-1.5 !text-xs" data-ps="${s.id}">Payslip</button>
        ${!s.paid&&canEdit?`<button class="${btnS} !px-3 !py-1.5 !text-xs !text-emerald-700" data-paid="${s.id}">Mark paid</button>`:s.paid?badge('Paid','teal'):''}</div>`},
    ], slips, {empty:'No payslips in this run.'});
    pb.querySelectorAll('[data-ps]').forEach(b=>b.onclick=async()=>{
      const r=await API.call('getPayslip',b.dataset.ps);
      payslipModal({employeeName:r.employee.name, employeeCode:r.employee.code, month:r.run.month,
        designation:r.employee.designation, department:r.employee.departmentName||r.employee.department,
        salary:r.payslip.salary, allowances:r.payslip.allowances, deductions:r.payslip.deductions,
        advanceRecovery:r.payslip.advanceRecovery, net:r.payslip.net, paid:r.payslip.paid});
    });
    pb.querySelectorAll('[data-paid]').forEach(b=>b.onclick=async()=>{
      await API.call('markPayslipPaid',b.dataset.paid); toast('Marked paid','success'); m.close(); App.route();
    });
  }

  function payslipModal(s){
    const m=modal('Payslip — '+s.employeeName,`
      <div id="psPrint">
        <div class="text-center mb-5">
          <div class="font-display font-bold text-lg text-slate-800">Attendance Management System</div>
          <div class="text-xs text-slate-400">Payslip for ${esc(s.month)} · ${esc(s.employeeName)} (${esc(s.employeeCode)})</div>
          <div class="text-xs text-slate-400">${esc(s.designation||'')} · ${esc(s.department||'')}</div>
        </div>
        <table class="w-full text-sm"><tbody class="divide-y divide-slate-100">
          <tr><td class="py-2 text-slate-500">Basic salary</td><td class="py-2 text-right tabular-nums">${fmt(s.salary)}</td></tr>
          <tr><td class="py-2 text-slate-500">Allowances</td><td class="py-2 text-right tabular-nums text-emerald-600">+ ${fmt(s.allowances)}</td></tr>
          <tr><td class="py-2 text-slate-500">Deductions</td><td class="py-2 text-right tabular-nums text-red-500">− ${fmt(s.deductions)}</td></tr>
          <tr><td class="py-2 text-slate-500">Advance recovery</td><td class="py-2 text-right tabular-nums text-amber-600">− ${fmt(s.advanceRecovery)}</td></tr>
          <tr><td class="py-2.5 font-bold text-slate-800">Net pay</td><td class="py-2.5 text-right tabular-nums font-bold text-teal-700 text-base">${fmt(s.net)}</td></tr>
        </tbody></table>
        <div class="mt-3 text-center">${s.paid?badge('Paid','teal'):badge('Unpaid','amber')}</div>
      </div>
      <div class="flex justify-end gap-2 mt-6"><button class="${btnS}" id="pClose">Close</button><button class="${btnP}" id="pPrint">Print</button></div>`);
    m.el.querySelector('#pClose').onclick=()=>m.close();
    m.el.querySelector('#pPrint').onclick=()=>printHTML(m.el.querySelector('#psPrint').innerHTML,'Payslip '+s.employeeName+' '+s.month);
  }

  function contractorEditor(c){
    const isNew=!c; c=c||{name:'',company:'',phone:'',rate:0,active:true};
    const m=modal(isNew?'Add Contractor':'Edit Contractor',`
      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-2">${field('Contractor / firm name','name',{value:c.name,req:true})}</div>
        ${field('Company','company',{value:c.company||''})}
        ${field('Phone','phone',{value:c.phone||''})}
        ${field('Daily rate (Rs)','rate',{value:c.rate,type:'number',min:0})}
        <div class="flex items-end pb-2.5">${field('Active','active',{type:'checkbox',value:c.active})}</div>
      </div>
      <div class="flex justify-end gap-2 mt-6"><button class="${btnS}" id="cCancel">Cancel</button><button class="${btnP}" id="cSave">Save</button></div>`);
    m.el.querySelector('#cCancel').onclick=()=>m.close();
    m.el.querySelector('#cSave').onclick=async()=>{
      const d=collectForm(m.el); if(!d.name){toast('Name required','warn');return;}
      await API.call('saveContractor',{...(isNew?{}:{id:c.id}),...d}); m.close(); toast('Contractor saved','success'); App.route();
    };
  }

  function componentEditor(c){
    const isNew=!c; c=c||{name:'',kind:'allowance',amount:0,appliesTo:'all',approved:true};
    const m=modal(isNew?'Add Pay Component':'Edit Pay Component',`
      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-2">${field('Component name','name',{value:c.name,req:true})}</div>
        ${field('Kind','kind',{type:'select',value:c.kind,options:[{value:'allowance',label:'Allowance'},{value:'deduction',label:'Deduction'}]})}
        ${field('Amount (Rs)','amount',{value:c.amount,type:'number',min:0})}
        <div class="col-span-2 flex items-end pb-2.5">${field('Approved (applies to payroll runs)','approved',{type:'checkbox',value:c.approved})}</div>
      </div>
      <div class="flex justify-end gap-2 mt-6"><button class="${btnS}" id="cCancel">Cancel</button><button class="${btnP}" id="cSave">Save</button></div>`);
    m.el.querySelector('#cCancel').onclick=()=>m.close();
    m.el.querySelector('#cSave').onclick=async()=>{
      const d=collectForm(m.el); if(!d.name){toast('Name required','warn');return;}
      await API.call('savePayComponent',{...(isNew?{}:{id:c.id}),...d}); m.close(); toast('Component saved','success'); App.route();
    };
  }

  /* header actions */
  const runB=document.getElementById(cid+'-run');
  if(runB) runB.onclick=()=>{
    const m=modal('Run Payroll',`
      ${field('Payroll month','month',{type:'month',value:monthISO(),req:true})}
      <div class="max-h-64 overflow-y-auto border border-slate-200/70 rounded-2xl mt-4 mb-4 divide-y divide-slate-50">
        <label class="flex items-center gap-3 px-4 py-2.5 bg-slate-50 font-semibold text-sm text-slate-600 cursor-pointer">
          <input type="checkbox" id="allEmp" checked class="w-4 h-4 rounded accent-teal-600"> Select all</label>
        ${emps.filter(e=>e.active).map(e=>`<label class="flex items-center gap-3 px-4 py-2.5 hover:bg-slate-50 cursor-pointer">
          <input type="checkbox" name="pemp" value="${e.id}" checked class="w-4 h-4 rounded accent-teal-600">
          <span class="text-sm font-medium text-slate-700">${esc(e.name)}</span><span class="text-xs text-slate-400 ml-auto tabular-nums">${fmt(e.salary)}</span></label>`).join('')}
      </div>
      <div class="flex justify-end gap-2"><button class="${btnS}" id="pCancel">Cancel</button><button class="${btnP}" id="pGo">Run payroll</button></div>`);
    m.el.querySelector('#pCancel').onclick=()=>m.close();
    m.el.querySelector('#allEmp').onchange=e=>m.el.querySelectorAll('[name="pemp"]').forEach(x=>x.checked=e.target.checked);
    m.el.querySelector('#pGo').onclick=async()=>{
      const ids=[...m.el.querySelectorAll('[name="pemp"]:checked')].map(x=>x.value);
      if(!ids.length){ toast('Select at least one employee','warn'); return; }
      const r=await API.call('runPayroll',formVal(m.el,'month'),ids);
      m.close(); toast('Payroll run created for '+r.month,'success'); App.route();
    };
  };
  const advB=document.getElementById(cid+'-adv');
  if(advB) advB.onclick=()=>{
    const m=modal('Grant Advance',`
      <div class="grid grid-cols-1 gap-4">
        ${field('Employee','employeeId',{type:'select',options:emps.filter(e=>e.active).map(e=>({value:e.id,label:e.name}))})}
        ${field('Amount (Rs)','amount',{type:'number',min:1,req:true})}
        ${field('Installments','installments',{type:'number',value:3,min:1})}
      </div>
      <div class="flex justify-end gap-2 mt-6"><button class="${btnS}" id="aCancel">Cancel</button><button class="${btnP}" id="aGo">Grant</button></div>`);
    m.el.querySelector('#aCancel').onclick=()=>m.close();
    m.el.querySelector('#aGo').onclick=async()=>{
      const d=collectForm(m.el);
      if(!d.amount){toast('Amount required','warn');return;}
      await API.call('grantAdvance',d.employeeId,d.amount,d.installments);
      m.close(); toast('Advance granted','success'); location.hash='#/payroll?tab=advances'; App.route();
    };
  };
};
})();

(function(){

const LOGOMARK=`<span class="w-10 h-10 rounded-2xl bg-gradient-to-br from-teal-400 to-emerald-600 flex items-center justify-center text-white shadow-[0_4px_12px_rgba(13,148,136,.4)] shrink-0">

function loginPage(){
  document.body.className='min-h-screen bg-[#f6f8fa]';
  document.body.innerHTML=`
  <div class="min-h-screen flex">
    <div class="hidden lg:flex w-[46%] relative overflow-hidden bg-gradient-to-br from-teal-700 via-teal-800 to-emerald-900 text-white">
      <div class="absolute inset-0 login-pattern opacity-60"></div>

      <div class="blob absolute -top-24 -right-24 w-[28rem] h-[28rem] rounded-full bg-emerald-300/20 blur-3xl" style="animation-delay:-4s"></div>
      <div class="blob absolute top-1/3 left-1/4 w-72 h-72 rounded-full bg-cyan-300/15 blur-3xl" style="animation-delay:-7s"></div>
      <div class="relative z-10 flex flex-col justify-between p-12 w-full">
        <div class="flex items-center gap-3">${LOGOMARK}
          <div><div class="font-display font-bold text-xl">${I18N.t('c4.auth.brand')}</div>
          <div class="text-teal-200/70 text-xs">${I18N.t('c4.auth.tagline')}</div></div>
        </div>
        <div>
          <h2 class="font-display text-4xl font-bold leading-tight mb-4">${I18N.t('c4.auth.heroTitle')}</h2>
          <p class="text-teal-100/70 max-w-sm mb-8">${I18N.t('c4.auth.heroSub')}</p>
          <div class="space-y-3 text-sm">
            ${[I18N.t('c4.auth.feat1'),I18N.t('c4.auth.feat2'),I18N.t('c4.auth.feat3')].map(t=>`
            <div class="flex items-center gap-3"><span class="w-6 h-6 rounded-full bg-white/15 flex items-center justify-center text-teal-100">✓</span><span class="text-teal-50/90">${t}</span></div>`).join('')}
          </div>
        </div>
        <div class="text-teal-200/50 text-xs">${I18N.t('c4.auth.secureNote')}</div>
      </div>
    </div>
    <div class="flex-1 flex items-center justify-center p-6 relative">
      <div class="absolute inset-0 bg-gradient-to-br from-teal-50/60 via-transparent to-emerald-50/40 pointer-events-none"></div>
      <div class="relative w-full max-w-sm anim-fadeUp bg-white/70 backdrop-blur-xl border border-white/60 shadow-[0_20px_60px_-15px_rgba(13,148,136,.25)] rounded-3xl p-8">
        <div class="lg:hidden flex items-center gap-3 mb-8 justify-center">${LOGOMARK}
          <div class="font-display font-bold text-xl text-slate-800">${I18N.t('c4.auth.brand')}</div>
        </div>
        <h1 class="font-display text-3xl font-bold text-slate-800 tracking-tight">${I18N.t('c4.auth.welcomeBack')}</h1>
        <p class="text-sm text-slate-400 mt-1.5 mb-8">${I18N.t('c4.auth.signInSub')}</p>
        <div id="lerr" class="hidden mb-4 text-sm text-red-600 bg-red-50 border border-red-200/70 rounded-xl px-4 py-3"></div>
        <label class="block mb-4"><span class="block text-xs font-semibold text-slate-500 mb-1.5 tracking-wide">${I18N.t('c4.auth.companyCode')}</span>
          <input id="lc" class="bg-white border border-slate-200 rounded-xl px-4 py-3 w-full text-sm uppercase focus:ring-2 focus:ring-teal-500/40 focus:border-teal-500 focus:outline-none transition" placeholder="DEMO"></label>
        <label class="block mb-4"><span class="block text-xs font-semibold text-slate-500 mb-1.5 tracking-wide">${I18N.t('c4.auth.username')}</span>
          <input id="lu" class="bg-white border border-slate-200 rounded-xl px-4 py-3 w-full text-sm focus:ring-2 focus:ring-teal-500/40 focus:border-teal-500 focus:outline-none transition" placeholder="admin"></label>
        <label class="block mb-6"><span class="block text-xs font-semibold text-slate-500 mb-1.5 tracking-wide">${I18N.t('c4.auth.password')}</span>
          <input id="lp" type="password" class="bg-white border border-slate-200 rounded-xl px-4 py-3 w-full text-sm focus:ring-2 focus:ring-teal-500/40 focus:border-teal-500 focus:outline-none transition" placeholder="••••••••"></label>
        <button id="lb" class="w-full py-3 rounded-xl bg-gradient-to-b from-teal-500 to-teal-600 hover:from-teal-600 hover:to-teal-700 text-white font-semibold shadow-[0_4px_14px_rgba(13,148,136,.4)] active:scale-[.99] transition">${I18N.t('c4.auth.signIn')}</button>
        <p class="text-xs text-slate-400 text-center mt-6">${I18N.t('c4.auth.demoAccess')}<span class="font-mono bg-slate-100 px-1.5 py-0.5 rounded">DEMO / admin / admin123</span></p>
        <p class="text-[11px] text-slate-400 text-center mt-2">${I18N.t('c4.auth.superadminNote')}<span class="font-mono bg-slate-100 px-1.5 py-0.5 rounded">ADMIN / superadmin / admin123</span></p>
      </div>
    </div>
  </div>`;
  const go=async()=>{
    const err=document.getElementById('lerr'); err.classList.add('hidden');
    const btn=document.getElementById('lb'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span>';
    try{
      const r=await API.call('login',
        document.getElementById('lc').value.trim(),
        document.getElementById('lu').value.trim(),
        document.getElementById('lp').value);
      if(r&&r.user){ Session.user={...r.user, token:r.token}; }
      Session.bootstrap=await API.call('getBootstrap');
      const role=Session.user.role;
      location.hash = role==='superadmin' ? '#/tenants' : role==='employee' ? '#/punch' : '#/dashboard';
      App.boot();
    }catch(e){ err.textContent=e.message||I18N.t('c4.auth.loginFailed'); err.classList.remove('hidden'); btn.disabled=false; btn.textContent=I18N.t('c4.auth.signIn'); }
  };
  document.getElementById('lb').onclick=go;
  ['lc','lu','lp'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')go();}));
}

window.loginPage=loginPage; App.LOGOMARK=LOGOMARK;
})();


/* ===== 110_documents.js ===== */
/* 110_documents.js — employee documents with expiry alerts and days-left badges. */

  const canEdit=perm('documents','edit');

      <div class="bg-amber-50/70 border border-amber-200/70 rounded-2xl p-5 anim-fadeUp">
        <div class="font-display font-bold text-amber-800 text-sm mb-3">${I18N.t('c4.docs.expiringN').replace('{n}',exp.length)}</div>

          <span class="inline-flex items-center gap-2 bg-white border border-amber-200/70 rounded-xl px-3 py-1.5 text-xs">
            <span class="font-semibold text-slate-700">${esc(d.title)}</span>

      {label:I18N.t('c4.docs.colDocument'), get:d=>`<span class="font-medium text-slate-700">${esc(d.title)}</span>`},
      {label:I18N.t('c4.common.employee'), get:d=>esc(d.employeeName||'—')},
      {label:I18N.t('c4.docs.colExpiry'), get:d=>`<span class="tabular-nums">${fmtDate(d.expiryDate)}</span>`},

      {label:'', get:d=>canEdit?`<div class="flex gap-1 justify-end">

    const isNew=!d; d=d||{employeeId:emps[0]?emps[0].id:'',title:'',expiryDate:todayISO()};

        ${field(I18N.t('c4.docs.fDocTitle'),'title',{value:d.title,req:true,ph:I18N.t('c4.docs.phDocTitle')})}
        ${field(I18N.t('c4.docs.fExpiryDate'),'expiryDate',{value:d.expiryDate,type:'date',req:true})}
      </div>
      <div class="flex justify-end gap-2 mt-6"><button class="${btnS}" id="dCancel">${I18N.t('c4.common.cancel')}</button><button class="${btnP}" id="dSave">${I18N.t('c4.common.save')}</button></div>`);
    m.el.querySelector('#dCancel').onclick=()=>m.close();
    m.el.querySelector('#dSave').onclick=async()=>{
      const data=collectForm(m.el);
      if(!data.title||!data.expiryDate){toast(I18N.t('c4.docs.titleExpiryRequired'),'warn');return;}
      await API.call('saveDocument',{...(isNew?{}:{id:d.id}),...data});
      m.close(); toast(I18N.t('c4.docs.docSaved'),'success'); load();
    };
  }
  const addB=document.getElementById(cid+'-add'); if(addB) addB.onclick=()=>openEditor(null);
  await load();
};

/* route() calls are serialized through a chain so a fast second navigation
   (e.g. boot setting location.hash, which fires hashchange) can never
   interleave with a render already in flight. */
let routeChain=Promise.resolve();
function route(){ routeChain=routeChain.then(_route,_route); return routeChain; }
async function _route(){
  const view=document.getElementById('view'); if(!view) return;
  renderNav();
  const hash=location.hash||'#/dashboard';
  const qIdx=hash.indexOf('?');
  const path=qIdx>0?hash.slice(0,qIdx):hash;
  const params={}; if(qIdx>0) new URLSearchParams(hash.slice(qIdx+1)).forEach((v,k)=>params[k]=v);
  const keys=Object.keys(App.routes).sort((a,b)=>b.length-a.length);
  const key=keys.find(k=>path===k||path.startsWith(k+'/'));
  const crumb=document.getElementById('crumb');
  if(crumb){ const n=App.nav.find(n=>n.path===(key||path)); crumb.textContent=n?(n.labelKey?I18N.t(n.labelKey):n.label):''; }
  view.innerHTML='<div class="space-y-4 anim-fadeIn"><div class="h-9 shimmer rounded-2xl w-1/3"></div><div class="h-72 shimmer rounded-2xl"></div></div>';
  try{
    if(key) await App.routes[key](view, params, path);
    else { view.innerHTML=pageHead(I18N.t('c4.layout.notFound'),'')+'<p class="text-slate-500">'+I18N.t('c4.layout.notFoundMsg')+'</p>'; }
  }catch(e){
    console.error(e);
    view.innerHTML=pageHead(I18N.t('c4.layout.error'),'')+`<div class="bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 text-sm">${esc(e.message||I18N.t('c4.layout.somethingWrong'))}</div>`;
  }
  window.scrollTo(0,0);
}

async function boot(){
  if(!await ensureBootstrap()){ if(location.hash!=='#/login') location.hash='#/login'; loginPage(); return; }
  if(!document.getElementById('view')) shellHTML();
  const hsh=location.hash;
  const role=Session.user.role;
  const landing=role==='superadmin'?'#/tenants':role==='employee'?'#/punch':'#/dashboard';
  if(hsh==='#/login'||!hsh){ location.hash=landing; return; } /* hashchange drives route() */
  route();
}

     <button class="${btnS}" id="${cid}-csv-pay">${I18N.t('c4.rep.csvPay')}</button>
     <button class="${btnS}" id="${cid}-csv-leave">${I18N.t('c4.rep.csvLeave')}</button>`)+`
  <div class="bg-white rounded-2xl border border-slate-200/70 p-4 mb-4 flex flex-wrap gap-3 items-end anim-fadeUp">
    ${field(I18N.t('c4.common.from'),'from',{type:'date',value:addDays(todayISO(),-29)})}
    ${field(I18N.t('c4.common.to'),'to',{type:'date',value:todayISO()})}
    <button class="${btnP}" id="${cid}-go">${I18N.t('c4.common.generate')}</button>
  </div>
  <div id="${cid}-body"></div>`;
  const body=document.getElementById(cid+'-body');

  async function load(){
    const from=formVal(body,'from')||addDays(todayISO(),-29);
    const to=formVal(body,'to')||todayISO();
    const rows=await API.call('attendanceSummary',from,to);
    const avg=rows.length?Math.round(rows.reduce((a,r)=>a+r.pct,0)/rows.length):0;
    const best=rows.slice().sort((a,b)=>b.pct-a.pct).slice(0,5);
    const worst=rows.slice().sort((a,b)=>a.pct-b.pct).slice(0,5);
    body.innerHTML=`
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-5">
        ${statCard(I18N.t('c4.rep.kpiAvg'),avg+'%',I18N.t('c4.rep.kpiAvgSub'),'teal',App.ICONS.reports,avg,'')}
        ${statCard(I18N.t('c4.rep.kpiPresentDays'),fmtNum(rows.reduce((a,r)=>a+r.present,0)),I18N.t('c4.rep.kpiPeriod'),'emerald',App.ICONS.attendance,rows.reduce((a,r)=>a+r.present,0))}
        ${statCard(I18N.t('c4.rep.kpiLate'),fmtNum(rows.reduce((a,r)=>a+r.late,0)),I18N.t('c4.rep.kpiPeriod'),'amber',App.ICONS.shifts,rows.reduce((a,r)=>a+r.late,0))}
        ${statCard(I18N.t('c4.rep.kpiOoz'),fmtNum(rows.reduce((a,r)=>a+r.outOfZone,0)),I18N.t('c4.rep.kpiOozSub'),'red',App.ICONS.sites,rows.reduce((a,r)=>a+r.outOfZone,0))}
      </div>
      <div class="grid grid-cols-1 xl:grid-cols-3 gap-4 mb-5">
        <div class="bg-white rounded-2xl border border-slate-200/70 shadow-[0_1px_3px_rgba(15,23,42,.05)] p-6 xl:col-span-2">
          <h3 class="font-display font-bold text-slate-800 mb-5">${I18N.t('c4.rep.attPctByEmp')}</h3>
          <div class="h-80"><canvas id="${cid}-chart"></canvas></div>
        </div>
        <div class="bg-white rounded-2xl border border-slate-200/70 shadow-[0_1px_3px_rgba(15,23,42,.05)] p-6">
          <h3 class="font-display font-bold text-slate-800 mb-4">${I18N.t('c4.rep.topPerformers')}</h3>
          ${best.map(r=>`<div class="flex items-center justify-between py-2 border-b border-slate-100 last:border-0 text-sm"><span class="font-medium text-slate-700">${esc(r.employeeName)}</span>${badge(r.pct+'%','emerald')}</div>`).join('')||'<p class="text-sm text-slate-400">—</p>'}
          <h3 class="font-display font-bold text-slate-800 mt-6 mb-4">${I18N.t('c4.rep.needsAttention')}</h3>
          ${worst.map(r=>`<div class="flex items-center justify-between py-2 border-b border-slate-100 last:border-0 text-sm"><span class="font-medium text-slate-700">${esc(r.employeeName)}</span>${badge(r.pct+'%',r.pct<70?'red':'amber')}</div>`).join('')||'<p class="text-sm text-slate-400">—</p>'}
        </div>
      </div>`+
      tableHTML([
        {label:I18N.t('c4.common.employee'), get:r=>`<div><div class="font-medium text-slate-700">${esc(r.employeeName)}</div><div class="text-xs text-slate-400">${esc(r.employeeCode)}</div></div>`},
        {label:I18N.t('c4.rep.colPresent'), num:1, get:r=>`<span class="tabular-nums">${fmtNum(r.present)}</span>`},
        {label:I18N.t('c4.rep.colAbsent'), num:1, get:r=>`<span class="tabular-nums ${r.absent?'text-red-500':''}">${fmtNum(r.absent)}</span>`},
        {label:I18N.t('c4.rep.colLate'), num:1, get:r=>`<span class="tabular-nums ${r.late?'text-amber-600':''}">${fmtNum(r.late)}</span>`},
        {label:I18N.t('c4.common.outOfZone'), num:1, get:r=>`<span class="tabular-nums">${fmtNum(r.outOfZone)}</span>`},
        {label:I18N.t('c4.rep.colAttendance'), get:r=>`<div class="flex items-center gap-2"><div class="w-24 h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full rounded-full ${r.pct>=90?'bg-emerald-500':r.pct>=75?'bg-teal-500':r.pct>=60?'bg-amber-500':'bg-red-500'}" style="width:${r.pct}%"></div></div><span class="text-sm font-semibold tabular-nums">${r.pct}%</span></div>`},
      ], rows, {empty:I18N.t('c4.rep.emptyRep')});
    const c=document.getElementById(cid+'-chart');
    if(c&&typeof Chart!=='undefined'){
      const top=rows.slice().sort((a,b)=>b.pct-a.pct).slice(0,15);
      new Chart(c,{type:'bar',
        data:{labels:top.map(r=>r.employeeName.split(' ')[0]),datasets:[{label:I18N.t('c4.rep.chartAttPct'),data:top.map(r=>r.pct),
          backgroundColor:top.map(r=>r.pct>=90?'rgba(16,185,129,.8)':r.pct>=75?'rgba(13,148,136,.8)':r.pct>=60?'rgba(245,158,11,.8)':'rgba(239,68,68,.8)'),
          borderRadius:6,maxBarThickness:30}]},
        options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
          plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,max:100,ticks:{callback:v=>v+'%'}}}}});
    }
    animateCounters(body);
  }
  document.getElementById(cid+'-go').onclick=load;
  const dl=async(kind)=>{ const r=await API.call('exportCSV',kind,{}); downloadCSV(r.filename,r.csv); toast(I18N.t('c4.rep.csvDownloadedKind').replace('{kind}',kind),'success'); };
  document.getElementById(cid+'-csv-att').onclick=()=>dl('attendance');
  document.getElementById(cid+'-csv-emp').onclick=()=>dl('employees');
  document.getElementById(cid+'-csv-pay').onclick=()=>dl('payroll');
  document.getElementById(cid+'-csv-leave').onclick=()=>dl('leaves');
  await load();
};
})();

    <div class="flex items-center justify-between mb-1">

    <div id="${cid}-perms"></div>
    <button class="${btnP} mt-4" id="${cid}-savePerms">Save permissions</button>
  </div>`:''}`;

          return `<td class="px-3 py-2.5 text-center">

          </td>`;}).join('')}
      </tr>`).join('')}
      </tbody></table></div>`;
    document.getElementById(cid+'-savePerms').onclick=async()=>{
      const matrix={};
      pe.querySelectorAll('input[type="checkbox"]').forEach(x=>{
        matrix[x.dataset.r]=matrix[x.dataset.r]||{};
        matrix[x.dataset.r][x.dataset.m]=matrix[x.dataset.r][x.dataset.m]||{};
        matrix[x.dataset.r][x.dataset.m][x.dataset.a]=x.checked?1:0;
      });
      await API.call('saveRolePermissions',matrix);
      toast('Permissions saved — they apply on next sign-in','success');
    };
  }
};
})();

/* ---------------- pure matching math (exposed for QA) ---------------- */
var FACE_THRESHOLD = 0.6;
var MAX_SAMPLES = 3;

function euclid(a, b){
  if (!Array.isArray(a) || !Array.isArray(b) || !a.length || a.length !== b.length) return null;
  var s = 0;
  for (var i = 0; i < a.length; i++){
    var x = a[i], y = b[i];
    if (typeof x !== 'number' || typeof y !== 'number' || !isFinite(x) || !isFinite(y)) return null;
    var d = x - y; s += d * d;
  }
  return Math.sqrt(s);
}
function averageDescriptors(samples){
  if (!Array.isArray(samples) || !samples.length) return null;
  var n = -1, acc = null, count = 0;
  for (var k = 0; k < samples.length; k++){
    var s = samples[k];
    if (!Array.isArray(s) || !s.length) continue;
    if (n < 0){ n = s.length; acc = new Array(n).fill(0); }
    if (s.length !== n) continue;
    var ok = true;
    for (var i = 0; i < n; i++){
      var v = s[i];
      if (typeof v !== 'number' || !isFinite(v)){ ok = false; break; }
      acc[i] += v;
    }
    if (ok) count++;
  }
  if (!count) return null;
  return acc.map(function(v){ return v / count; });
}
function matchScore(dist){
  if (dist === null || dist === undefined || !isFinite(dist)) return null;
  return Math.max(0, Math.min(1, 1 - dist));
}
function verifyFace(live, enrolled, threshold){
  threshold = (threshold === undefined) ? FACE_THRESHOLD : threshold;
  var dist = euclid(live, enrolled);
  if (dist === null) return { faceVerified: null, matchScore: null, distance: null };
  return { faceVerified: dist <= threshold, matchScore: matchScore(dist), distance: dist };
}
function validDescriptor(d){
  return Array.isArray(d) && d.length === 128 &&
    d.every(function(v){ return typeof v === 'number' && isFinite(v); });
}
/* Backward-compatible punch payload extension: empty object when no check ran */
function buildFacePunchFields(v){
  if (!v || v.faceVerified === null || v.faceVerified === undefined) return {};
  return { faceVerified: !!v.faceVerified, matchScore: v.matchScore };
}

window.T1Face = { FACE_THRESHOLD: FACE_THRESHOLD, MAX_SAMPLES: MAX_SAMPLES,
  euclid: euclid, averageDescriptors: averageDescriptors, matchScore: matchScore,
  verifyFace: verifyFace, validDescriptor: validDescriptor,
  buildFacePunchFields: buildFacePunchFields };

var FACE_LIB_URL = 'https:' + '//cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js';
var FACE_MODEL_URL = 'https:' + '//cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
var _libPromise = null;

function loadScriptOnce(src){
  return new Promise(function(resolve, reject){
    var s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = function(){ resolve(); };
    s.onerror = function(){ reject(new Error('Face library failed to load')); };
    document.head.appendChild(s);
  });
}
function ensureFaceLib(){
  if (window.faceapi && window.faceapi.nets && window.faceapi.nets.tinyFaceDetector &&
      window.faceapi.nets.tinyFaceDetector.isLoaded) return Promise.resolve(window.faceapi);
  if (_libPromise) return _libPromise;
  _libPromise = loadScriptOnce(FACE_LIB_URL).then(function(){
    var fa = window.faceapi;
    if (!fa) throw new Error('Face library failed to load');
    return Promise.all([

const t2t = k => I18N.t('t2.' + k);

function t2AllowSum(s){
  let t = 0;
  const d = s.allowancesDetail || {};
  Object.keys(d).forEach(k => { t += Number(d[k]) || 0; });
  return t;
}

        <p class="text-xs text-slate-400 mb-4">${t2t('generateSub')}</p>

      const box = document.getElementById(cid + '-structs');
      const rows = await API.call('listSalaryStructures').catch(() => []);
      box.innerHTML = tableHTML([
        { label: t2t('employee'), get: s => `<div><div class="font-medium text-slate-700">${esc(s.employeeName)}</div><div class="text-xs text-slate-400">${esc(s.employeeCode)}</div></div>` },
        { label: t2t('basic'), num: 1, get: s => `<span class="tabular-nums">${fmt(s.basic)}</span>` },
        { label: t2t('allowances'), num: 1, get: s => `<span class="tabular-nums text-emerald-600">+ ${fmt(t2AllowSum(s))}</span>` },
        { label: t2t('effectiveFrom'), get: s => `<span class="text-xs text-slate-500">${fmtDate(s.effectiveFrom)}</span>` },
        { label: '', get: s => canEdit ? `<div class="flex justify-end"><button class="${btnS} !px-3 !py-1.5 !text-xs" data-sedit="${s.id}">${t2t('edit')}</button></div>` : '' },
      ], rows, { empty: t2t('structuresEmpty') });
      box.querySelectorAll('[data-sedit]').forEach(b => b.onclick = () =>
        SalaryUI.structureEditor(rows.find(x => x.id === b.dataset.sedit), emps, loadStructs));
    };

    const loadRules = async () => {
      const box = document.getElementById(cid + '-rules');
      if(!box) return;
      const s = await API.call('getSettings').catch(() => ({}));
      const R = [
        ['absentDeductionPerDay', t2t('absentDeductionPerDay'), s.absentDeductionPerDay || '30'],
        ['lateGraceMinutes', t2t('lateGraceMinutes'), s.lateGraceMinutes || '15'],
        ['latePenaltyMinutes', t2t('latePenaltyMinutes'), s.latePenaltyMinutes || '60'],

        ['salaryWorkHoursPerDay', t2t('workHoursPerDay'), s.salaryWorkHoursPerDay || '8'],
      ];
      box.innerHTML = R.map(([k, l, v]) => field(l, k, { type: 'number', value: v, min: 0, step: k === 'overtimeRateMultiplier' ? '0.1' : '1' })).join('');
      document.getElementById(cid + '-saveRules').onclick = async () => {
        const d = collectForm(box);
        await API.call('saveSettings', d);
        toast(t2t('rulesSaved'), 'success');
      };
    };

    const loadRuns = async () => {
      const box = document.getElementById(cid + '-runs');
      const runs = (await API.call('listPayrollRuns').catch(() => [])).filter(r => (r.runType || 'manual') === 'salary');
      box.innerHTML = tableHTML([
        { label: t2t('month'), get: r => `<span class="font-semibold tabular-nums">${esc(r.month)}</span>` },
        { label: t2t('created'), get: r => `<span class="text-xs text-slate-500">${esc(r.createdAt)}</span>` },
        { label: t2t('payslips'), num: 1, get: r => fmtNum(r.slipCount) },

    if(genB) genB.onclick = async () => {
      const m = formVal(el, 'genMonth');
      if(!m){ toast(t2t('invalidMonth'), 'warn'); return; }
      genB.disabled = true; genB.textContent = t2t('generating');
      try{
        const r = await API.call('generateMonthlySalaries', m);
        const box = document.getElementById(cid + '-genResult');
        box.innerHTML = `
          <h4 class="font-bold text-slate-700 text-sm mb-2">${t2t('results')} — <span class="tabular-nums">${esc(r.month)}</span>
            <span class="text-emerald-600 ml-2">${r.generated.length} ${t2t('generatedOk')}</span>

          tableHTML([
            { label: t2t('employee'), get: g => `<div><div class="font-medium text-slate-700">${esc(g.employeeName)}</div><div class="text-xs text-slate-400">${esc(g.employeeCode)}</div></div>` },
            { label: t2t('present'), num: 1, get: g => fmtNum(g.daysPresent) },
            { label: t2t('absent'), num: 1, get: g => fmtNum(g.daysAbsent) },
            { label: t2t('lateArrivals'), num: 1, get: g => fmtNum(g.lateCount) },
            { label: t2t('overtimeHours'), num: 1, get: g => fmtNum(g.overtimeHours) },
            { label: t2t('net'), num: 1, get: g => `<span class="tabular-nums font-bold text-teal-700">${fmt(g.net)}</span>` },
          ], r.generated, { empty: t2t('slipsEmpty') }) +
          (r.skipped.length ? `<h4 class="font-bold text-amber-700 text-sm mt-4 mb-2">${t2t('skipped')}</h4>` +
            tableHTML([
              { label: t2t('employee'), get: g => `<span class="font-medium text-slate-700">${esc(g.employeeName)}</span>` },
              { label: 'Reason', get: g => `<span class="text-xs text-amber-700">${esc(g.reason)}</span>` },
            ], r.skipped, {}) : '');
        toast(r.generated.length + ' ' + t2t('generatedOk'), 'success');
        loadRuns();
      }catch(e){ toast(e.message, 'error'); }
      genB.disabled = false; genB.textContent = t2t('generate');
    };

    await loadStructs(); await loadRules(); await loadRuns();
  },

  structureEditor(s, emps, onDone){
    const isNew = !s; s = s || { employeeId: '', basic: '', allowancesJson: '', effectiveFrom: todayISO(), payFrequency: 'monthly' };
    const m = modal(isNew ? t2t('addStructure') : t2t('editStructure'), `
      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-2">${field(t2t('employee'), 'employeeId', { type: 'select', value: s.employeeId, req: true,

      const d = collectForm(m.el);
      if(!d.employeeId || !Number(d.basic)){ toast(t2t('fillRequired'), 'warn'); return; }

        if((d.allowancesJson || '').trim()) JSON.parse(d.allowancesJson);

      await API.call('saveSalaryStructure', { ...(isNew ? {} : { id: s.id }), ...d });
      m.close(); toast(t2t('structureSaved'), 'success'); onDone && onDone();
    };
  },

/* The session token is read exactly like 01_api.js does: Session.user, which
   is parsed from localStorage key 'ams_session' (set at login). */
window.AndroidGetPunchConfig = function(){

/* ---------- "Automatic attendance" toggle card on the punch page ---------- */
function t5CardHTML(on){
  return `<div class="max-w-5xl mt-4" id="t5-auto-card">
    <div class="bg-white rounded-2xl border border-slate-200/70 shadow-[0_1px_3px_rgba(15,23,42,.05)] p-6 anim-fadeUp">
      <div class="flex items-center justify-between gap-4">
        <div class="min-w-0">
          <h3 class="font-display font-bold text-slate-800">${esc(I18N.t('t5.autoTitle'))}</h3>
          <p class="text-sm text-slate-500 mt-1">${esc(I18N.t('t5.autoDesc'))}</p>
        </div>
        <label class="relative inline-flex cursor-pointer items-center shrink-0" title="${esc(I18N.t('t5.autoTitle'))}">
          <input type="checkbox" id="t5-auto-toggle" class="sr-only peer"${on ? ' checked' : ''}>
          <span class="block w-11 h-6 rounded-full bg-slate-200 peer-checked:bg-teal-500 transition-colors"></span>
          <span class="absolute left-0.5 top-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform peer-checked:translate-x-5 pointer-events-none"></span>
        </label>
      </div>
      <div id="t5-auto-status" class="text-xs text-slate-400 mt-3">${esc(I18N.t(on ? 't5.isOn' : 't5.isOff'))}</div>
    </div>
  </div>`;
}

function injectToggle(){
  try{
    if(!Session.user) return false;
    if(document.getElementById('t5-auto-card')) return true;
    /* punch page marker: 30_punch.js renders a "<cid>-msg" div */
    const msg = document.querySelector('[id$="-msg"]');
    if(!msg) return false;
    const grid = msg.closest('.grid');
    if(!grid || !grid.parentNode) return false;
    const eid = T5.myEmployeeId();
    if(!eid) return false;
    grid.insertAdjacentHTML('afterend', t5CardHTML(true));
    const tgl = document.getElementById('t5-auto-toggle');
    const status = document.getElementById('t5-auto-status');
    if(!tgl || !status) return false;
    const paint = on=>{
      tgl.checked = !!on;
      status.textContent = I18N.t(on ? 't5.isOn' : 't5.isOff');
    };
    /* load the real toggle state + warm the bridge cache */
    T5.refresh(eid).then(()=>paint(T5.cache.autoPunch)).catch(()=>{});
    tgl.addEventListener('change', async ()=>{
      tgl.disabled = true;
      try{
        const r = await API.call('setAutoPunch', eid, tgl.checked);
        T5.cache.autoPunch = !!(r && r.autoPunch);
        paint(T5.cache.autoPunch);
        toast(I18N.t('t5.saved'), 'success');
      }catch(e){
        paint(!tgl.checked);
        toast((e && e.message) || I18N.t('t5.saveFail'), 'error');
      }
      tgl.disabled = false;
    });
    return true;
  }catch(e){ return false; }
}

/* Hook the punch route lazily: the route renders asynchronously, so retry
   until the marker appears (or give up quietly). */
let t5Timer = null;
function maybeHookT5(){
  if((location.hash || '') !== '#/punch') return;
  let tries = 0;
  if(t5Timer) clearInterval(t5Timer);
  t5Timer = setInterval(()=>{
    tries++;
    let done = false;
    try{ done = injectToggle(); }catch(e){ done = false; }
    if(done || tries > 24) clearInterval(t5Timer);
  }, 250);
}
window.addEventListener('hashchange', maybeHookT5);
maybeHookT5();
})();

  't6.loadFail': 'قواعد لوڈ نہیں ہو سکے',
  't6.adminOnly': 'صرف منتظم قواعد تبدیل کر سکتے ہیں — آپ صرف دیکھ سکتے ہیں۔',

});

/* ---------- nav + route (runtime registration, no existing file touched) ---------- */
